# Fault-mode catalogue (architecture §6 M11, §9.2-9.3, AD-18; report §9). Rows of the two research catalogues:
#   FD#n  = faults_and_degradation.md §9(b) fault-mode catalogue (38 rows)
#   TFG#n = texture_and_fault_gap_closure.md synthesis (c) fault-signature table (41 rows)
# Every row of both is covered by at least one mode (tests/unit/test_faults_catalogue.py).
#
# class:   degradation (gradual, advanced by M10 processes) | shock | transient | sensor | discrete | intermittent |
#          latent (maintenance-induced) | physics (emerges from module physics; no injection)
# onset:   m10 | physics | poisson (rate per flight hour, param) | per_event (probability per driver event) |
#          markov (two-state per sortie) | latent (per maintenance action) | triggered (M10 damage threshold) | scripted
# effects: perturbations applied at onset (I6: only state changes; never an observation):
#          health     -> health.fault {state, delta x severity}
#          sensors    -> sensor_fault to M12 {channel, mode, value, rate, duty, probe} (AD-42), built from
#                        magnitude (fraction of channel span x severity), rate_per_s (drift, fraction of
#                        span per s, bounded by magnitude), rate (1/s), duty, probe, factor, level
#          monitoring -> monitor.lru_condition {code, magnitude (test-statistic σ units) x severity}
#          utilities  -> util.fault to M09 {tail, mode} (AD-44 vocabulary: gen_fail, bk_fail, fire_onset,
#                        fire_loop_open, fire_loop_short; their clears follow automatically)
#          engine|fadec|airframe -> <prefix>.fault_inject {tail, mode, param x severity, instance, engine, clear}
#                        (AD-48.4); airframe adds leg (M06 gear leg 0 nose, 1 left, 2 right, -1 all), given as
#                        `legs: [..]`, `leg: n`, `leg: "*"` (a main leg by the instance's choice) or `leg: key`
#                        (the trigger key's side suffix); airframe modes are M06's kernel.AF_FAULT_MODES
#          health states may name the hydraulic system as {h} (taken from the trigger key, else 1)
# graph_root: node of graph.yaml where the cascade starts (propagated with the edge latencies).
# detection.coverage: probability the BIT test that owns the code can see this instance (missed-detection pool).
# validation (AD-55, W2.5): status validated (the priority set: B7 checks run in depth, ids of
#          analysis/faults_b7b8/, with the literature evidence) or unvalidated with its reason. The label-leak
#          audit and G0 cover every mode.
format: phalanx.fault_catalogue/2
modes:
  # ---------------------------------------------------------------- engine gradual degradation (M10 processes)
  FM.ENG.FOULING:            {name: "Fan/compressor fouling", subsystem: engine, class: degradation, nm_ref: NM.ENG.FAN_HEALTH, onset: {process: m10}, refs: ["FD#1"], signature: "At fixed N1/thrust: T5 up, Wf up, N2 shift; ~1 % Γ and η; recoverable by wash", evidence: {tag: "TRANSFER: Kurz & Brun", source: "N:FD §9(b) #1"}, validation: {status: validated, checks: [B7-ENG-FOUL-SIG, B7-ENG-FOUL-RATE], evidence: "Muir et al. AGARD-CP-448 p7 Fig. 15 fan and HPC rows (directions) [TRANSFER: F404-400 CF-18]; Kurz & Brun GT2011-45012 (~1 % Gamma and eta per roughness step; recoverable by wash) [TRANSFER]"}}
  FM.ENG.EROSION:            {name: "Compressor/turbine erosion", subsystem: engine, class: degradation, nm_ref: NM.ENG.HPC_HEALTH, onset: {process: m10}, refs: ["FD#2", "FD#5"], signature: "HPC η -5 %, Γ -9 % at 5,000 flights; stall margin down; LPT η -0.5 to -1.1 %", evidence: {tag: "TRANSFER: ProDiMES, C-MAPSS", source: "N:FD §9(b) #2, #5"}, validation: {status: validated, checks: [B7-ENG-ERO-SIG, B7-ENG-ERO-RATE], evidence: "ProDiMES NASA/TM-2010-215840 fleet HPC eta -5 %, Gamma -9 % at 5,000 flights and fighter severity S 1.5-2 (architecture §9.2) [TRANSFER + ASSUMPTION]; Muir Fig. 15 HPC row [TRANSFER]"}}
  FM.ENG.RUB_IN:             {name: "Tip-clearance growth (rub-in)", subsystem: engine, class: degradation, nm_ref: NM.ENG.TIP_CLEARANCE, onset: {process: m10}, refs: ["FD#3"], signature: "+1 °C EGT and +0.1 % SFC per 0.001 in HPT clearance; 1 % TSFC flight 1", evidence: {tag: "TRANSFER: Lattime & Steinetz; Sallee", source: "N:FD §9(b) #3"}, validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; M10 process with tagged rates and sweeps; no literature comparison run"}}
  FM.ENG.HPT_DETERIORATION:  {name: "HPT erosion/oxidation/TBC loss and abnormal onset", subsystem: engine, class: degradation, nm_ref: NM.ENG.HPT_HEALTH, onset: {process: m10}, refs: ["FD#4"], signature: "HPT η -2.6 %, Γ +1.8 % at 3,000 cycles; 1 % HPT fault: N2 -0.6 %, Wf +0.6 %, EGT +12 °F", evidence: {tag: "TRANSFER: C-MAPSS", source: "N:FD §9(b) #4"}, validation: {status: validated, checks: [B7-ENG-HPT-SIG, B7-ENG-HPT-ONSET], evidence: "Muir Fig. 15 HPT-efficiency row [TRANSFER: F404-400]; Vhora US 7,062,370 Tbl I (1 % HPT: N2 down, Wf up, EGT up) [TRANSFER]; N-CMAPSS abnormal-onset law (Arias Chao 2021) [TRANSFER]"}}
  FM.ENG.LIFE_USAGE:         {name: "Hot-section LCF/creep/TMF usage damage", subsystem: engine, class: degradation, nm_ref: NM.ENG.DISK_LIFE, onset: {process: m10}, refs: ["FD#14"], signature: "No gas-path signature until crack; usage counters (~2.5 TAC/EFH)", evidence: {tag: "TRANSFER: F-16 (Thunderbird AIB 2025)", source: "N:FD §9(b) #14 (Thunderbird AIB 2025: usage counting, no gas-path signature until crack; ~2.5 TAC/EFH inferred); tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, W2.1c)"}, validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; M10 process with tagged rates and sweeps; no literature comparison run"}}
  FM.ENG.BEARING_SPALL:      {name: "Main-shaft bearing spall progression", subsystem: engine, class: degradation, nm_ref: NM.ENG.BEARING_SPALL, onset: {process: m10}, refs: ["FD#15", "TFG#22"], signature: "Chips in oil (48 %), vibration (16 %), low oil pressure (12 %); ODM 2-50 mg/mm", evidence: {tag: "TRANSFER: Su-30MKI AL-31FP (IAF fleet); FEMTO rig", source: "N:FD §9(b) #15 (IAF Su-30MKI engine-failure statistics: chips 33/69, vibration 11/69, low oil pressure 8/69; FEMTO rig lives); N:TFG (c) #22; IAF-fleet evidence but another engine type (AL-31FP), so TRANSFER for the IN20; tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, W2.1c)"}, validation: {status: validated, checks: [B7-OIL-C25, B7-OIL-SPALL], evidence: "Bennett et al. 1996 QFDA Tbl I (CF188 Fe 0.4747 ug/h mean, 1.6813 ug/h 2 sigma, 26 filters) [TRANSFER: F404-400]; NASA TM-2011-217117 spall growth 0.08-0.34 mm/h, debris 2-50 mg per mm [TRANSFER]"}}
  FM.ENG.OIL_CONDITION:      {name: "Race wear / spinning raising oil Fe", subsystem: engine, class: degradation, nm_ref: NM.ENG.OIL_CONDITION, onset: {process: m10}, refs: ["TFG#25"], signature: "SOAP Fe slope 0.02-0.07 ppm/h normal -> 1-11 ppm/h; F404 abnormal ≥15 ppm", evidence: {tag: "TRANSFER: JOAP 2013", source: "N:TFG (c) #25"}, validation: {status: validated, checks: [B7-OIL-SOAP], evidence: "JOAP 2013 / N:TFG (c) #25: SOAP Fe slope 0.02-0.07 ppm/h normal, 1-11 ppm/h abnormal [TRANSFER: F404 family]"}}
  FM.ENG.SEAL_WEAR:          {name: "Carbon-seal wear / oil leak", subsystem: engine, class: degradation, nm_ref: NM.ENG.SEAL_WEAR, onset: {process: m10}, refs: ["TFG#26"], signature: "Oil consumption to limit (F110 0.355 L/h)", evidence: {tag: "TRANSFER: JOAP 2013", source: "N:TFG (c) #26"}, validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; M10 process with tagged rates and sweeps; no literature comparison run"}}
  FM.ENG.NOZZLE_FLAP_CRACK:  {name: "Nozzle flap cracking", subsystem: engine, class: degradation, nm_ref: NM.ENG.NOZZLE_HW, onset: {process: m10}, refs: ["TFG#11"], signature: "No gas-path signature; outer flap cracks 4-16 mm at ~25 % of a 330 h test", evidence: {tag: "TRANSFER: F404-102 (KDTQ 2006)", source: "N:TFG (c) #11"}, validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; M10 process with tagged rates and sweeps; no literature comparison run"}}
  # ---------------------------------------------------------------- engine shocks, transients and discrete faults
  FM.ENG.FOD_BIRD:
    name: "FOD or bird ingestion"
    subsystem: engine
    class: shock
    nm_ref: NM.ENG.FAN_HEALTH
    onset: {process: poisson, rate: bird_strike_rate, scale: engine_ingestion_fraction, env: dust}
    severity: {dist: lognormal, median: 1.0, sigma: fod_severity_sigma}
    effects:
      - {target: health, state: "eng:fod_fan_eta", delta: fod_eta_step}
      - {target: health, state: "eng:fod_fan_flow", delta: fod_flow_step}
      - {target: health, state: "eng:fod_hpc_eta", delta: fod_hpc_step}
      - {target: engine, mode: fod_imbalance, param: 1.0}
    detection: {codes: [ENG-501, ECM-701], coverage: 0.9}
    refs: ["FD#6", "TFG#3"]
    signature: "Abrupt Γ/η shift; stalls every 3-5 s; thrust ≈96 % MIL; vibration up; FOD may give no code"
    evidence: {tag: "TRANSFER: F-16/F-35A AIBs (Eielson, Luke); F100 (AIB 88-0165)", source: "N:FD §9(b) #6 (Eielson F-16, Luke F-35A AIBs); N:TFG (c) #3 (AIB 88-0165): the signature and effects; IAF bird strikes 357 incidents 2010-13 (indian_fleet_platform_relevance.md) is DIRECT IAF context for the rate, which M11.yaml bird_strike_rate tags on its own; tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, W2.1c)"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.POP_STALL:
    name: "Pop stall from inlet distortion"
    subsystem: engine
    class: transient
    nm_ref: NM.ENG.HPC_HEALTH
    onset: {process: poisson, rate: pop_stall_rate}
    severity: {dist: fixed, value: 1.0}
    duration_s: 3.0
    effects: [{target: engine, mode: pop_stall, param: 1.0}]
    detection: {codes: [ENG-501], coverage: 0.95}
    refs: ["TFG#1"]
    signature: "PS3 85 -> 10-15 psia in ≤1 sample, ≈75 psia within 0.3 s, baseline ≈3 s; only at AoA > 70° with high yaw rate"
    evidence: {tag: "TRANSFER: F404-400 (TM-104328)", source: "N:TFG (c) #1"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.BLADE_LOSS:
    name: "Mechanical stall from blade loss (turned vane -> HCF crack -> liberation)"
    subsystem: engine
    class: discrete
    nm_ref: NM.ENG.BLADE_CRACK
    onset: {process: triggered, trigger: "eng:crack_len"}
    severity: {dist: fixed, value: 1.0}
    graph_root: eng.blade_loss
    effects:
      - {target: health, state: "eng:extra_hpc_eta", delta: -0.05}
      - {target: health, state: "eng:extra_hpc_flow", delta: -0.08}
      - {target: engine, mode: blade_loss, param: 1.0}
    detection: {codes: [ENG-501, ENG-701, ENG-503, ENG-502], coverage: 1.0}
    refs: ["FD#8", "TFG#2"]
    signature: "N1 95 -> 15 % in 0.6 s; N2 sub-idle; T5 rises; stall +2 s, overtemp +4 s, T sensor fail +10 s, flameout +13 s; generators off, EPU +16-19 s"
    evidence: {tag: "TRANSFER: F110/F100 AIBs 88-0433, 90-0771, 87-0358; Thunderbird AIB 2025", source: "N:TFG (c) #2; N:FD §9(b) #8"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.HPC_DAMAGE:
    name: "HPC damage (F404 take-off signature)"
    subsystem: engine
    class: shock
    nm_ref: NM.ENG.HPC_HEALTH
    onset: {process: scripted}
    severity: {dist: fixed, value: 1.0}
    effects:
      - {target: health, state: "eng:extra_hpc_eta", delta: -0.05}
    detection: {codes: [ECM-501], coverage: 0.7}
    refs: ["TFG#4"]
    signature: "Take-off PS3 rise lags twin by 1.5-2 s, plateau -4 pts; PS3/P1 +8 %, Wf +8-14 % at fixed N2"
    evidence: {tag: "TRANSFER: F404-400 (AGARD-CP-448 P7)", source: "N:TFG (c) #4; the source quantifies the damage as about -5 % HPC efficiency equivalent only, so the unsourced -3 % HPC flow delta of the W1.5 entry was removed (W2.5)"}
    validation: {status: validated, checks: [B7-ENG-C26], evidence: "Muir et al. AGARD-CP-448 p7 (HPC blade damage ~ -5 % HPC efficiency: PS3/P1 +8 %, Wf +8-14 % at fixed N2) and the NRC model (C26) [TRANSFER: F404-400]"}
  FM.ENG.BEARING_FAILURE:
    name: "Bearing failure with stall/vibration ceiling"
    subsystem: engine
    class: discrete
    nm_ref: NM.ENG.BEARING_SPALL
    onset: {process: triggered, trigger: "eng:spall_len"}
    severity: {dist: fixed, value: 1.0}
    graph_root: eng.bearing_failure
    effects: [{target: engine, mode: bearing_failure, param: 1.0}]
    detection: {codes: [ECM-001, ECM-701, ENG-501], coverage: 0.9}
    refs: ["TFG#5"]
    signature: "Vibration at all powers; repeat stalls above ≈85 % RPM; RPM down with FTIT up; airstarts fail"
    evidence: {tag: "TRANSFER: F110 (ExecSum 2006/2001)", source: "N:TFG (c) #5"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.AB_NO_LIGHT:
    name: "AB no-light"
    subsystem: engine
    class: transient
    nm_ref: NM.ENG.AB_SPRAYBAR
    onset: {process: per_event, driver: ab_lights, probability: ab_no_light_p}
    severity: {dist: fixed, value: 1.0}
    duration_s: 10.0
    effects: [{target: engine, mode: ab_no_light, param: 1.0}]
    detection: {codes: [ENG-503], coverage: 0.95}
    refs: ["FD#11", "TFG#6"]
    signature: "No light-off detected 2.5 s after request; up to 3 retries; AB lever reverts to intermediate"
    evidence: {tag: "TRANSFER: F100 (TM-86745)", source: "N:TFG (c) #6; N:FD §9(b) #11"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.AB_BLOWOUT:
    name: "AB rumble and blowout"
    subsystem: engine
    class: transient
    nm_ref: NM.ENG.AB_SPRAYBAR
    onset: {process: per_event, driver: ab_lights, probability: ab_blowout_p}
    severity: {dist: fixed, value: 1.0}
    duration_s: 5.0
    effects: [{target: engine, mode: ab_rumble_blowout, param: 1.0}]
    detection: {codes: [ENG-503], coverage: 0.8}
    refs: ["FD#11", "TFG#7"]
    signature: "PAB 60 Hz, 2 psi pk-pk oscillation then blowout (band 30-200 Hz)"
    evidence: {tag: "TRANSFER: F100 (CP-2298 P11; AFAPL-TR-78-82)", source: "N:TFG (c) #7"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.QUICKFILL_STALL:
    name: "AB quickfill stall"
    subsystem: engine
    class: transient
    nm_ref: NM.ENG.HPC_HEALTH
    onset: {process: per_event, driver: ab_lights, probability: quickfill_stall_p}
    severity: {dist: fixed, value: 1.0}
    duration_s: 2.0
    effects: [{target: engine, mode: quickfill_stall, param: 1.0}]
    detection: {codes: [ENG-501], coverage: 0.95}
    refs: ["TFG#8"]
    signature: "Segment-fill pressure spike ≈300 psi -> fan stall; ≈1 per 994 segment-1 lights (high altitude, low speed)"
    evidence: {tag: "TRANSFER: F100 (CP-2298 P11)", source: "N:TFG (c) #8"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.NOZZLE_LIMIT_CYCLE:
    name: "Nozzle EPR-loop limit cycle"
    subsystem: engine
    class: intermittent
    nm_ref: NM.ENG.NOZZLE_HW
    onset: {process: markov, p_on: nozzle_lc_p_on, p_off: nozzle_lc_p_off}
    severity: {dist: fixed, value: 1.0}
    effects: [{target: fadec, mode: nozzle_loop_gain_margin, param: 1.0}]
    detection: {codes: [], coverage: 0.0}
    refs: ["TFG#9"]
    signature: "Sustained AJ limit cycle ±0.1-0.2 ft², intermittent, very sensitive to conditions; PAB ±2.5 psi; not detected as a fault. The F100 1-2 Hz (about 1.4 Hz) is a property of its EPR loop, not transferred: the IN20 nozzle loop holds T5 through the thermocouple harness (F404 probe τ 1.75 s, CR-1998-208416 Fig. 3), so its limit cycle is slower (M08 gives about 0.6 Hz, A-W2.1b-5)"
    evidence: {tag: "TRANSFER: F100 (CP-2298 P12; TM-85914)", source: "N:TFG (c) #9 and Q6 (EPR-loop nozzle instability: 1-2 Hz on the F100 EPR loop; fix = gain halved, EPR deadband x30); loop variable per f404_in20_engine_model.md Q4 (A8 holds T5 at/above IRP); frequency expectation revised in W2.5 (coordinator item after W2.1b): amplitude, persistence and non-detection transfer, the frequency does not"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.SHUTOFF_PARTIAL:
    name: "Main fuel shut-off valve partly closed"
    subsystem: engine
    class: discrete
    onset: {process: scripted}
    severity: {dist: fixed, value: 1.0}
    effects: [{target: engine, mode: fuel_restriction, param: 1.0}]
    detection: {codes: [], coverage: 0.0}
    refs: ["TFG#12"]
    signature: "RPM stuck ≈70 % sub-idle ≈3 min, no throttle response, NO caution; then ≈20 %"
    evidence: {tag: "TRANSFER: F110-129 (AIB 92-3886)", source: "N:TFG (c) #12; architecture §9.3 (no caution)"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.FUEL_SCHEDULE_BIAS:
    name: "Main fuel control over-fuelling"
    subsystem: engine
    class: discrete
    onset: {process: scripted}
    severity: {dist: uniform, lo: 0.5, hi: 1.0}
    effects: [{target: fadec, mode: fuel_schedule_bias, param: 0.04}]
    detection: {codes: [ECM-501], coverage: 0.5}
    refs: ["TFG#13"]
    signature: "Take-off fuel ratio Wf/PS3 ≈102-105 % vs 89-92 % at ≈80 % N2; flameout on start-up"
    evidence: {tag: "TRANSFER: F404-400 (AGARD-CP-448 P7)", source: "N:TFG (c) #13"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.HUNG_START:
    name: "Hung start"
    subsystem: engine
    class: transient
    onset: {process: per_event, driver: starts, probability: hung_start_p}
    severity: {dist: fixed, value: 1.0}
    duration_s: 30.0
    effects: [{target: engine, mode: hung_start, param: 1.0}]
    detection: {codes: [ENG-504], coverage: 0.95}
    refs: ["TFG#14"]
    signature: "N2 flat ≈35 %; FTIT up ≈12 °C/s; nozzle ≈90 % open; FADEC rule N2 < 60 % and not rising for 1 s"
    evidence: {tag: "TRANSFER: F100-229 (AIB 92-3890; CP-2298 P8)", source: "N:TFG (c) #14; architecture §6 M08"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.HOT_START:
    name: "Hot start"
    subsystem: engine
    class: transient
    onset: {process: per_event, driver: starts, probability: hot_start_p}
    severity: {dist: fixed, value: 1.0}
    duration_s: 20.0
    effects: [{target: engine, mode: hot_start, param: 1.0}]
    detection: {codes: [ENG-505, ENG-701], coverage: 0.95}
    refs: ["TFG#15"]
    signature: "FTIT overshoot; stall; control trims fuel above ≈760 °C"
    evidence: {tag: "TRANSFER: F100 (CP-2298 P8; TM-85900)", source: "N:TFG (c) #15"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.FLAMEOUT:
    name: "Flameout with FADEC relight"
    subsystem: engine
    class: transient
    onset: {process: poisson, rate: flameout_rate}
    severity: {dist: fixed, value: 1.0}
    duration_s: 15.0
    graph_root: eng.flameout
    effects: [{target: engine, mode: flameout, param: 1.0}]
    detection: {codes: [ENG-502], coverage: 1.0}
    refs: ["TFG#16"]
    signature: "T5 dips then rises; NH falling; PS3 collapse; flameout code set and cleared when T5 recovers"
    evidence: {tag: "TRANSFER: RM12 (SHK RM 2019:02)", source: "N:TFG (c) #16"}
    validation: {status: unvalidated, reason: "unvalidated (AD-55): outside the W2.5 priority set; realised as a state perturbation by M07/M08 (eng./fadec.fault_inject, AD-48.4, W2.1b); its signature is not compared with literature (most need the flying aircraft, W2.1a)"}
  FM.ENG.BLEED_LEAK:
    name: "Bleed leak or over-extraction"
    subsystem: engine
    class: discrete
    onset: {process: poisson, rate: bleed_leak_rate}
    severity: {dist: uniform, lo: 0.2, hi: 1.0}
    effects: [{target: engine, mode: bleed_leak, param: 0.45}]
    detection: {codes: [ECM-501], coverage: 0.3}
    refs: ["TFG#17"]
