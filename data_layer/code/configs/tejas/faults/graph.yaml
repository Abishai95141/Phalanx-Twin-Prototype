  - {id: G21, src: hyd1.pressure_low, dst: fcs.actuator_rate_limited, type: hydraulic, transfer: {kind: gain, gain: 1.0}, latency: {dist: fixed, s: 0.0}, mechanism: physics, evidence: {tag: "TRANSFER: hydraulic actuator practice", source: "architecture §6 M05 (rates limited by available ΔP)"}}
