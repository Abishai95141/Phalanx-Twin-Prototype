templates:
  T.ENG_ELEC:
    name: "Engine -> electrical (fan-blade liberation -> spool-down -> generators offline -> emergency power)"
    root: eng.fan_blade_liberation
    sequence: [eng.fan_blade_liberation, eng.spool_down, elec.gen_offline, elec.emergency_power]
    windows_s: {eng.spool_down: [0.0, 1.0], elec.gen_offline: [2.5, 6.0], elec.emergency_power: [2.5, 6.05]}
    evidence: "R§9 cascade 1; Holloman AIB 90-0755 (N:FD §9(b) #9: near-simultaneous lights, generator drop); ≤50 ms backup transfer (arch §6 M09; MIL-STD-704F, TRANSFER; the 5 kW DC backup is DIRECT)"
  T.ENG_AB_ELEC:
    name: "Engine -> AB -> electrical (turned vanes -> blade loss -> stall -> AB failure -> flameout -> generators off)"
    root: eng.blade_loss
    sequence: [eng.blade_loss, eng.stall, eng.overtemp, eng.t5_sensor_fail, eng.flameout, elec.gen_offline, elec.emergency_power]
    windows_s: {eng.stall: [1.5, 2.5], eng.overtemp: [3.0, 5.0], eng.ab_fail: [7.5, 12.5], eng.t5_sensor_fail: [7.5, 12.5], eng.flameout: [9.75, 16.25], elec.gen_offline: [12.0, 23.75], elec.emergency_power: [12.0, 23.75]}
    evidence: "N:TFG (c) #2 (AIBs 88-0433, 90-0771, 87-0358): codes +2 / +4 / +10 / +13 s, EPU +16-19 s; ±25 % (arch §6 M07)"
  T.HYD:
    name: "Hydraulic (actuator internal leak -> system A low -> system B low, within one flight)"
    root: hyd.actuator_internal_leak
    sequence: [hyd.actuator_internal_leak, hyd1.pressure_low, hyd2.pressure_low]
    windows_s: {hyd1.pressure_low: [0.0, 3600.0], hyd2.pressure_low: [60.0, 5400.0]}
    evidence: "N:FD §9(b) #18 (March ARB AIB 88-0477): within one flight (sortie ≤ 90 min, M02)"
  T.UTIL_BRAKE:
    name: "Utility -> braking (heat-exchanger crack -> utility hydraulic loss -> brake loss -> runway excursion)"
    root: hyd.fohe_crack
    sequence: [hyd.fohe_crack, hyd.utility_fluid_loss, brakes.loss, lg.runway_excursion]
    windows_s: {hyd.utility_fluid_loss: [300.0, 7200.0], brakes.loss: [300.0, 7800.0], lg.runway_excursion: [305.0, 7860.0]}
    evidence: "N:FD §9(b) #19 (Kingsley AIB 84-0046): hours to one flight"
  T.CONTAM_LAW:
    name: "Contamination -> control law (contaminated servicing + cold soak -> strut failure -> false WoW -> FCS ground law)"
    root: hyd.fluid_contaminated
    sequence: [hyd.fluid_contaminated, lg.strut_extension_failure, lg.false_wow, fcs.ground_law_in_flight]
    conditions: [env.cold_soak]
    windows_s: {lg.strut_extension_failure: [1800.0, 3000.0], lg.false_wow: [1800.0, 3001.0], fcs.ground_law_in_flight: [1800.0, 3001.05]}
    evidence: "N:FD §9(b) #21 (Eielson F-35A AIB 19-5535): ~40 min cold soak at about 0 °F"
  T.ELEC_AVI:
    name: "Electrical -> avionics (partial power loss -> EGI invalid without flag -> HUD ladder lost)"
    root: elec.partial_power_loss
    sequence: [elec.partial_power_loss, avi.egi_invalid_unflagged, avi.hud_pitch_ladder_lost]
    windows_s: {avi.egi_invalid_unflagged: [0.0, 1.0], avi.hud_pitch_ladder_lost: [30.0, 46.0]}
    evidence: "N:FD §9(b) #27 (Osan AIB 2023): HUD pitch ladder lost at 30-45 s"
