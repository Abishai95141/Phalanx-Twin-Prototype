# Typed dependency graph (AD-27; architecture §6 M11, §9.3; report §9 "Propagation follows documented cascades").
# Nodes are physical states (never fault codes). Edge types: shaft, hydraulic, thermal, data_electrical, discrete,
# mechanical. Each edge: transfer function + latency (s) + mechanism (physics | graph | health) + evidence.
# Templates are the documented AIB cascades with the evidenced time window of each node from the root.
# Windows: AIB times with the architecture's ±25 % transient-timing tolerance (§6 M07 accept), unless stated.
format: phalanx.fault_graph/1
nodes:
  # --- engine
  eng.turned_vane:          {subsystem: engine, description: "turned/reversed HPC vane (latent, not borescope-accessible)"}
  eng.blade_crack:          {subsystem: engine, description: "HCF crack in an HPC/fan blade (M10 crack state)"}
  eng.blade_loss:           {subsystem: engine, description: "blade liberation in the compressor"}
  eng.fan_blade_migration:  {subsystem: engine, description: "fan blade axial migration after a missing air seal"}
  eng.fan_blade_liberation: {subsystem: engine, description: "fan blade liberation"}
  eng.stall:                {subsystem: engine, description: "compressor stall / stagnation", effects: [{target: engine, mode: stall, param: 1.0}, {target: monitoring, code: ENG-501, magnitude: 8.0}]}
  eng.overtemp:             {subsystem: engine, description: "T5 above limit", effects: [{target: engine, mode: overtemp, param: 1.0}, {target: monitoring, code: ENG-701, magnitude: 8.0}]}
  eng.t5_sensor_fail:       {subsystem: engine, description: "T5 probe/harness failure after overtemperature", effects: [{target: sensors, channel: ENG.T5.HARNESS_A, mode: open, magnitude: 0.0}, {target: monitoring, code: ENG-005, magnitude: 8.0}]}
  eng.ab_fail:              {subsystem: engine, description: "afterburner failure / inhibited", effects: [{target: engine, mode: ab_fail, param: 1.0}, {target: monitoring, code: ENG-503, magnitude: 8.0}]}
  eng.flameout:             {subsystem: engine, description: "flameout or sub-idle stagnation", effects: [{target: engine, mode: flameout, param: 1.0}, {target: monitoring, code: ENG-502, magnitude: 8.0}]}
  eng.spool_down:           {subsystem: engine, description: "N2 falling below idle", effects: [{target: engine, mode: spool_down, param: 1.0}]}
  eng.thrust_loss:          {subsystem: engine, description: "thrust loss", effects: [{target: monitoring, code: ENG-506, magnitude: 8.0}]}
  eng.fire:                 {subsystem: engine, description: "engine fire / overheat", effects: [{target: utilities, mode: fire_onset}, {target: monitoring, code: FIR-501, magnitude: 8.0}]}
  eng.fuel_overmetering:    {subsystem: engine, description: "fuel control over-metering (MEC/FMU)"}
  eng.overspeed:            {subsystem: engine, description: "uncommanded acceleration / overspeed", effects: [{target: engine, mode: overspeed, param: 1.0}, {target: monitoring, code: ENG-703, magnitude: 8.0}]}
  eng.oil_quantity_low:     {subsystem: engine, description: "engine oil quantity low (leak, consumption, servicing)"}
  eng.oil_pressure_low:     {subsystem: engine, description: "main oil pressure low", effects: [{target: engine, mode: oil_pressure_low, param: 1.0}, {target: monitoring, code: ECM-702, magnitude: 8.0}]}
  eng.bearing_failure:      {subsystem: engine, description: "main-shaft bearing failure", effects: [{target: engine, mode: bearing_failure, param: 1.0}, {target: monitoring, code: ECM-001, magnitude: 8.0}]}
  eng.seizure:              {subsystem: engine, description: "rotor seizure", effects: [{target: engine, mode: seizure, param: 1.0}]}
  eng.n2:                   {subsystem: engine, threshold: 0.0, description: "core shaft speed (normal coupling root)"}
  # --- secondary power, electrical, avionics
  amagb.speed:              {subsystem: secondary_power, threshold: 0.0, description: "AMAGB/PTO speed (fixed ratio to N2)"}
  hyd.pump_flow:            {subsystem: hydraulics, threshold: 0.0, description: "engine-driven pump flow capacity Q_max(N2)"}
  elec.gen_speed:           {subsystem: electrical, threshold: 0.0, description: "generator drive speed"}
  elec.gen_offline:         {subsystem: electrical, description: "main generator offline (underspeed or GCU trip)", effects: [{target: utilities, mode: gen_fail}, {target: monitoring, code: ELE-401, magnitude: 8.0}]}
  elec.emergency_power:     {subsystem: electrical, description: "5 kW DC backup / battery on line", effects: [{target: monitoring, code: ELE-404, magnitude: 8.0}]}
  elec.partial_power_loss:  {subsystem: electrical, description: "partial electrical power disruption"}
  avi.egi_invalid_unflagged: {subsystem: avionics, description: "navigation data invalid without a validity flag"}
  avi.hud_pitch_ladder_lost: {subsystem: avionics, description: "HUD pitch ladder lost"}
  avi.agcas_fail:           {subsystem: avionics, description: "ground-collision avoidance unavailable"}
  # --- hydraulics, gear, brakes, FCS
  hyd.actuator_internal_leak: {subsystem: hydraulics, description: "FCS actuator internal leak (mis-installed check valves)"}
  hyd1.pressure_low:        {subsystem: hydraulics, description: "HYD1 pressure low", effects: [{target: monitoring, code: HYD-501, magnitude: 8.0}]}
  hyd2.pressure_low:        {subsystem: hydraulics, description: "HYD2 pressure low", effects: [{target: monitoring, code: HYD-502, magnitude: 8.0}]}
  hyd.pump_failure:         {subsystem: hydraulics, description: "engine-driven pump failure", effects: [{target: health, state: "util:hyd{h}_pump_wear", delta: 3.0}]}
  hyd.fohe_crack:           {subsystem: hydraulics, description: "fuel-oil heat exchanger weld crack (non-isolable circuit)"}
  hyd.utility_fluid_loss:   {subsystem: hydraulics, description: "utility hydraulic fluid loss"}
  hyd.fluid_contaminated:   {subsystem: hydraulics, description: "water-contaminated hydraulic servicing"}
  env.cold_soak:            {subsystem: environment, description: "cold soak at about 0 °F (condition)"}
  lg.strut_extension_failure: {subsystem: landing_gear, gate: and, description: "strut fails to extend (frozen water)", effects: [{target: airframe, mode: strut_extension_failure, param: 1.0, legs: [1, 2]}]}
  lg.false_wow:             {subsystem: landing_gear, description: "weight-on-wheels reads on-ground in flight", effects: [{target: fcs, event: wow_fault, legs: [1, 2], value: 1}, {target: monitoring, code: LGB-502, magnitude: 8.0}]}
  fcs.ground_law_in_flight: {subsystem: flight_control, description: "FCS ground law active in flight (M05 selects it from the false WoW)"}
  fcs.actuator_rate_limited: {subsystem: flight_control, description: "actuator rate limited by low supply pressure"}
  brakes.sw_config_defect:  {subsystem: landing_gear, description: "brake-software configuration defect (Tejas)"}
  brakes.loss:              {subsystem: landing_gear, description: "wheel-brake capability lost", effects: [{target: monitoring, code: LGB-503, magnitude: 8.0}]}
  lg.tyre_burst:            {subsystem: landing_gear, description: "main tyre burst", effects: [{target: airframe, mode: tyre_burst, param: 1.0, leg: "*"}]}
  lg.runway_excursion:      {subsystem: landing_gear, description: "runway excursion", effects: [{target: airframe, mode: runway_excursion, param: 1.0}]}
edges:
  # --- T.ENG_AB_ELEC: turned vane -> blade loss -> stall -> overtemp -> T sensor fail / AB fail -> flameout -> generators -> backup
  - {id: G01, src: eng.turned_vane, dst: eng.blade_crack, type: mechanical, transfer: {kind: delay}, latency: {dist: loguniform, lo: 3600, hi: 720000}, mechanism: health, evidence: {tag: "TRANSFER: F-16 (Thunderbird AIB 2025)", source: "N:FD §9(b) #8 (Thunderbird AIB 2025: turned vanes -> wake -> HCF crack; latent, not borescope-accessible); latency range ASSUMPTION A-W1.5-24; tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, E1-HY)"}}
  - {id: G02, src: eng.blade_crack, dst: eng.blade_loss, type: mechanical, transfer: {kind: threshold, threshold: 0.5}, latency: {dist: fixed, s: 0.0}, mechanism: health, evidence: {tag: "TRANSFER: F-16 (Thunderbird AIB 2025)", source: "N:FD §9(b) #8 (crack -> blade loss); M10 crack threshold triggers the M11 mode; tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, E1-HY)"}}
  - {id: G03, src: eng.blade_loss, dst: eng.stall, type: mechanical, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 1.5, hi: 2.0}, mechanism: physics, evidence: {tag: "TRANSFER: F110/F100 AIBs 88-0433, 90-0771, 87-0358", source: "N:TFG (c) #2: stall codes +2 s; N:FD §9(b) #8: 2 stall codes within 2 s"}}
  - {id: G04, src: eng.stall, dst: eng.overtemp, type: thermal, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 1.5, hi: 2.5}, mechanism: physics, evidence: {tag: "TRANSFER: F110/F100 AIBs", source: "N:TFG (c) #2: overtemperature/mode/hybrid +4 s; T5 rises while N falls"}}
  - {id: G05, src: eng.overtemp, dst: eng.t5_sensor_fail, type: thermal, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 5.0, hi: 7.0}, mechanism: physics, evidence: {tag: "TRANSFER: F110/F100 AIBs", source: "N:TFG (c) #2: T sensor fail +10 s"}}
  - {id: G06, src: eng.stall, dst: eng.ab_fail, type: discrete, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 6.5, hi: 9.0}, mechanism: physics, evidence: {tag: "TRANSFER: F-16 (Thunderbird AIB 2025)", source: "N:FD §9(b) #8: AB-fail + thrust-low codes at ~10 s (Thunderbird AIB); tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, E1-HY)"}}
  - {id: G07, src: eng.overtemp, dst: eng.flameout, type: thermal, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 8.0, hi: 10.0}, mechanism: physics, evidence: {tag: "TRANSFER: F110/F100 AIBs", source: "N:TFG (c) #2: flameout/sub-idle +13 s"}}
  - {id: G08, src: eng.flameout, dst: eng.spool_down, type: shaft, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 0.0, hi: 0.5}, mechanism: physics, evidence: {tag: "TRANSFER: RM12 (SHK RM 2019:02)", source: "f404_in20_engine_model.md: RM12 flameout rundown trace (NH falling)"}}
  - {id: G09, src: eng.spool_down, dst: elec.gen_offline, type: shaft, transfer: {kind: threshold, threshold: 0.5}, latency: {dist: uniform, lo: 2.5, hi: 5.0}, mechanism: physics, evidence: {tag: "TRANSFER: F110/F100 AIBs", source: "N:TFG (c) #2: generators off, EPU +16-19 s; spool-down to generator cut-out latency ASSUMPTION A-W1.5-24"}}
  - {id: G10, src: elec.gen_offline, dst: elec.emergency_power, type: data_electrical, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 0.0, hi: 0.05}, mechanism: physics, evidence: {tag: "TRANSFER: MIL-STD-704F", source: "architecture §6 M09: generator underspeed -> 5 kW DC backup / battery with ≤50 ms transfer; the 5 kW DC backup generator is DIRECT (DRDO '5 kW brushless DC Generating system for LCA Tejas', tejas_utility_systems.md electrical); the <=50 ms transfer interrupt is MIL-STD-704F (Distribution A, TRANSFER); the source-switching logic is an ASSUMPTION (tejas_utility_systems.md electrical [ASSUMPTION] state machine). Tagged by the transferred timing; E1-HY"}}
  # --- T.ENG_ELEC: missing air seal -> blade migration -> liberation -> spool-down -> generators -> backup
  - {id: G11, src: eng.fan_blade_migration, dst: eng.fan_blade_liberation, type: mechanical, transfer: {kind: delay}, latency: {dist: loguniform, lo: 3600, hi: 4.0e+6}, mechanism: health, evidence: {tag: "TRANSFER: F-16 (Holloman AIB 90-0755)", source: "N:FD §9(b) #9 (Holloman AIB 90-0755: 591 h latent, migration 0.4-1.0 in); tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, E1-HY)"}}
