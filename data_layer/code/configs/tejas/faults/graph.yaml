  - {id: G17, src: amagb.speed, dst: elec.gen_speed, type: shaft, transfer: {kind: gain, gain: 1.0}, latency: {dist: fixed, s: 0.0}, mechanism: physics, evidence: {tag: "DIRECT", source: "architecture §6 M09: N2 is the master variable; DIRECT: the generator is on an AMAGB output pad (ADA General Systems page; tejas_utility_systems.md KQ1). Kept DIRECT (E1-HY)"}}
