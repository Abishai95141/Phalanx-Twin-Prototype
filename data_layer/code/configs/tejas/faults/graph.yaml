  - {id: G13, src: eng.fan_blade_liberation, dst: eng.fire, type: thermal, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 0.0, hi: 1.0}, mechanism: graph, evidence: {tag: "TRANSFER: F-16 (Holloman AIB 90-0755)", source: "N:FD §9(b) #9: fire/overheat lights near-simultaneous; tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, E1-HY)"}}
  - {id: G14, src: eng.fan_blade_liberation, dst: eng.spool_down, type: shaft, transfer: {kind: gain, gain: 1.0}, latency: {dist: uniform, lo: 0.0, hi: 1.0}, mechanism: physics, evidence: {tag: "TRANSFER: F-16 (Holloman AIB 90-0755)", source: "R§9 engine -> electrical: fan-blade liberation -> spool-down -> generators offline -> emergency power; the R§9 template is the Holloman AIB (N:FD §9(b) #9); tag TRANSFER per RULES.md rule 3 (DIRECT is Tejas/IN20/IAF only; E1 verifier §7, E1-HY)"}}
  # --- normal coupling (N2 master variable, architecture §6 M09)
  - {id: G15, src: eng.n2, dst: amagb.speed, type: shaft, transfer: {kind: gain, gain: 1.0}, latency: {dist: fixed, s: 0.0}, mechanism: physics, evidence: {tag: "DIRECT", source: "architecture §6 M09: AMAGB and PTO fixed ratios to N2; DIRECT: the AMAGB takes its drive from the engine PTO at a rated 16,810 rpm (= 100 % N2) and carries the 2 hydraulic pumps, the generator and the JFS (ADA General Systems page; DDP node 8779; tejas_utility_systems.md KQ1). Kept DIRECT (E1-HY)"}}
