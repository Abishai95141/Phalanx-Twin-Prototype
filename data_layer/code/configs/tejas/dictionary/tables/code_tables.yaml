# Code tables. Everything marked synthetic is a Phalanx construct (AD-19: IAF-relabelled synthetic codes; synthetic
# SSS-NNN fault codes); it is never claimed to be the real Tejas code structure (RULES.md rule 6).
format: phalanx.dictionary.code_tables/1
tables:
  validity:
    title: Contract validity enum names (architecture §12; codes are owned by the W0.4 contract spec)
    synthetic: false
    prov: R-VALIDITY
    values: [NORMAL, NO_COMPUTED_DATA, FUNCTIONAL_TEST, FAILURE_WARNING, BUS_INVALID]
  ssm_bnr:
    title: ARINC-429 sign/status matrix for BNR words (bits 30-31) -> validity
    synthetic: false
    prov: R-VALIDITY
    codes: {"0": FAILURE_WARNING, "1": NO_COMPUTED_DATA, "2": FUNCTIONAL_TEST, "3": NORMAL}
  ssm_dis:
    title: ARINC-429 sign/status matrix for discrete words (bits 30-31) -> validity
    synthetic: false
    prov: R-VALIDITY
    codes: {"0": NORMAL, "1": NO_COMPUTED_DATA, "2": FUNCTIONAL_TEST, "3": FAILURE_WARNING}
  mil1553_validity_bit:
    # 0.1.2 (AD-45, contract precedence AD-38/41): a set invalid bit is BUS_INVALID; FAILURE_WARNING is reserved
    # for the ARINC-429 SSM failure-warning code
    title: Per-message validity word (synthetic, F/A-18C IAVAL-style) bit value -> validity
    synthetic: true
    prov: R-ICD-WORDS
    codes: {"0": NORMAL, "1": BUS_INVALID}
  mil1553_status_word:
    title: MIL-STD-1553B RT status word bits (bit 15 = first transmitted data bit after sync)
    synthetic: false
    prov: R-VALIDITY
    bits:
      "15": RT_ADDRESS_4
      "14": RT_ADDRESS_3
      "13": RT_ADDRESS_2
      "12": RT_ADDRESS_1
      "11": RT_ADDRESS_0
      "10": MESSAGE_ERROR
      "9": INSTRUMENTATION
      "8": SERVICE_REQUEST
      "4": BROADCAST_COMMAND_RECEIVED
      "3": BUSY
      "2": SUBSYSTEM_FLAG
      "1": DYNAMIC_BUS_CONTROL_ACCEPTANCE
      "0": TERMINAL_FLAG
  bit_code_format:
    title: Synthetic BIT/fault code format SSS-NNN (AD-19)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    pattern: "^[A-Z]{3}-[0-9]{3}$"
    prefixes:
      ENG: engine and FADEC
      ECM: ECMS / engine monitoring
      FCS: DFCC and actuators
      ADC: air data
      NAV: navigation
      HYD: hydraulics
      FUE: fuel
      ELE: electrical
      ECS: environmental control and life support
      LGB: landing gear, brakes, NWS, chute
      SPS: secondary power (AMAGB, JFS)
      FIR: fire protection
      AVI: avionics and buses
      CWS: centralised warning system
      STR: structure
    number_blocks:
      "001-099": sensor or input
      "100-199": actuator or output
      "200-299": processor, memory or software
      "300-399": interface or bus
      "400-499": power supply
      "500-699": function or performance monitor
      "700-899": exceedance or limit
      "900-999": reserved
    # 16-bit code word of a code_word channel (0.1.2, from A-W1.7-6; rule R-CODE-WORD): prefix index k (position of
    # the prefix in the channel's `prefixes` list) in bits 15-10, NNN in bits 9-0; EU value (CIR, contract) =
    # k * 1000 + NNN; word 0 / EU 0 = no active code (NNN 000 is never a code)
    word_layout:
      word_bits: 16
      prefix_index: {lsb_bit: 10, width: 6}
      number: {lsb_bit: 0, width: 10}
      eu_prefix_scale: 1000
      no_code: 0
      prov: R-CODE-WORD
  cws_legends:
    title: CWS legend slots (30 red/amber legends; the real legend list is not public)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    slots: 30
    slot_pattern: "CWS-L{n:02d}"
  fcs_law:
    title: FCS control-law state (from the inventory FCS.MODE row text)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    # 3 = GROUND added in 0.1.2 (W1.2, AD-47: M05 emits it on the ground)
    codes: {"0": SCHEDULED_GAIN, "1": FIXED_GAIN_REVERSION, "2": SPIN_RECOVERY, "3": GROUND}
  gps_fix:
    title: GPS fix state (synthetic)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    codes: {"0": NO_FIX, "1": FIX_2D, "2": FIX_3D}
  gps_fom:
    title: GPS figure of merit (synthetic; code 1 = best estimated position accuracy, 9 = worst)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    codes: {"1": FOM_1, "2": FOM_2, "3": FOM_3, "4": FOM_4, "5": FOM_5, "6": FOM_6, "7": FOM_7, "8": FOM_8, "9": FOM_9}
  ins_mode:
    title: INS mode (synthetic)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    codes: {"0": "OFF", "1": ALIGN, "2": NAV_HYBRID, "3": NAV_INERTIAL_ONLY, "4": ATTITUDE_ONLY}
  flight_phase:
    # 0-7 are the DASHlink PH codes (R-CODES-PHASE); 8-15 are synthetic fighter phases added in 0.1.2 (W1.1,
    # AD-49; R-CODES-SYNTHETIC), listed in synthetic_codes
    title: Derived flight phase (DASHlink PH codes 0-7; synthetic fighter phases 8-15)
    synthetic: false
    prov: R-CODES-PHASE
    extra_prov: [R-CODES-SYNTHETIC]
    synthetic_codes: ["8", "9", "10", "11", "12", "13", "14", "15"]
    codes: {"0": UNKNOWN, "1": PREFLIGHT, "2": TAXI, "3": TAKEOFF, "4": CLIMB, "5": CRUISE, "6": APPROACH, "7": ROLLOUT, "8": ENGINE_START, "9": MISSION, "10": DESCENT, "11": PATTERN, "12": TOUCH_AND_GO, "13": SHUTDOWN, "14": GROUND_RUN, "15": HOT_REFUEL}
  borescope_grade:
    title: Borescope finding grade (from the inventory MX.BORESCOPE range text)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    codes: {"0": PASS, "1": LIMIT, "2": REJECT}
  store_station:
    title: Store station content code (9 hard points; synthetic content codes)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    codes: {"0": EMPTY, "1": DROP_TANK, "2": AIR_TO_AIR, "3": AIR_TO_GROUND, "4": POD, "5": OTHER}
  bit_codes:
    # ONE synthetic BIT / fault / exceedance code table for every module (AD-48 item 5; AD-19). Promoted from
    # M14's configs/tejas/params/M14/codes.yaml (102 codes, same order, so M14's code index is unchanged) plus
    # ENG-509/ENG-510, which keep two M08 afterburner faults distinct. Identity and meaning only: desc, severity
    # (sev), fault list (PFL/MFL), detection mechanism (mech), source LRU, lane, src (internal = LRU self-test,
    # external = reported by the owning module, cir = limit monitor on a recorded channel), CWS legend slot,
    # voice channel, and the monitor channel / limit id / sense / gate. Detection timing, suspects, CND/NFF
    # propensity and sympathetic codes are M14 behaviour parameters and stay in M14's params.
    title: Unified synthetic BIT/fault/exceedance codes SSS-NNN (FADEC M08, FCS M05, utilities M09, monitoring M14)
    synthetic: true
    prov: R-CODES-SYNTHETIC
    format: bit_code_format
    groups: {ENG: ENGINE, ECM: ENGINE_MONITORING, FCS: FLIGHT_CONTROL, ADC: AIR_DATA, NAV: NAVIGATION, HYD: HYDRAULICS, FUE: FUEL, ELE: ELECTRICAL, ECS: ENVIRONMENTAL_CONTROL, LGB: LANDING_GEAR_BRAKES, SPS: SECONDARY_POWER, FIR: FIRE_PROTECTION, AVI: AVIONICS, CWS: WARNING_SYSTEM, STR: STRUCTURE}
    # limit ids that are module parameters, not dictionary channel limits (owner module)
    module_limits: {aoa_voice: M14, discrete_on: M14, hyd_low: M14, hyd_temp_high: M14, low_alt: M14, low_fuel: M14, mach_max: M14, n1_overspeed: M14, n2_overspeed: M14, obogs_o2_low: M14, oil_p_low: M14}
    codes:
