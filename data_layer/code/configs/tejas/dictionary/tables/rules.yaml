    tag: "TRANSFER: IECMS 1 Hz group; DASHlink 1 Hz class"
    source: "tejas_avionics_and_parameter_inventory.md Q7"
    sweep: none
    affects: [M15, M16]
  R-RATE-ECMS:
    title: ECMS record groups
    statement: >-
      ECMS gas path 10 Hz (altitude, Mach, AoA, T0, T1, N1, N2, T56, P56, PS3, Wfm, PLA, A8), slow 1 Hz (Nz, oil
      pressure, vibration, fuel temperature, anti-ice valve, bleed door), event windows 5 s pre + 25-35 s post,
      take-off record 6-10 s.
    tag: "TRANSFER: CF-18/USN IECMS"
    source: "Muir et al., AGARD-CP-448 paper 7 https://archive.org/details/DTIC_ADA203800 ; tejas_avionics_and_parameter_inventory.md Q4 (IECMS recording rates)"
    sweep: none
    affects: [M14, M16]
  R-RATE-CDR:
