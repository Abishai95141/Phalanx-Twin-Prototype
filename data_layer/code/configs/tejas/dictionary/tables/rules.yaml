  P-DVR:
    title: DVR.VIDEO is a metadata-only placeholder
    statement: DVR.VIDEO represents HUD/MFD video and cockpit audio as a media reference only; no video data are generated.
    tag: DIRECT
    proxy: true
    source: "parameter_inventory.csv DVR.VIDEO ('format ASSUMPTION')"
    sweep: none
    affects: [M16]
    exposing_test: tests/unit/test_dictionary_seed.py::test_proxy_placeholders_flagged
