    statement: CDR 16/8/4/1 Hz by parameter class.
    tag: ASSUMPTION
    basis: "DASHlink measured 0.25-16 Hz [MEASURED proxy]; 14 CFR App. M minima"
    source: "tejas_avionics_and_parameter_inventory.md Q7"
