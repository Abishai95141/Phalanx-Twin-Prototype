    statement: Raw accelerometer data are acquired at a nominal 10 kHz (band 2.5-10 kHz) and reduced to 1 Hz features.
    tag: ASSUMPTION
    basis: "TRANSFER: DSTO-TN-0530 F404 vibration"
    source: "parameter_inventory.csv ENG.VIB.*; tejas_avionics_and_parameter_inventory.md Q7"
    sweep: 2.5-10 kHz
    affects: [M12, M14]
    exposing_test: M14 vibration-feature tests (W1.5)
    replacement: ECMS vibration monitor specification
    assumption_id: A-W0.3-30
  R-RATE-FTI:
    title: FTI nominal rate
    statement: FTI channels at a nominal 64 Hz (band 64-800 Hz).
    tag: ASSUMPTION
    basis: "TRANSFER: HAL trainer FTI 64 Hz; HARV 25-800 sps"
    source: "tejas_avionics_and_parameter_inventory.md Q7"
    sweep: 64-800 Hz
    affects: [M16]
    exposing_test: M16 conformance tests (W1.7)
    replacement: Tejas FTI configuration
    assumption_id: A-W0.3-31
  R-RATE-EVT:
    title: Aperiodic groups
    statement: EVT (on change), SORTIE (per sortie) and INSP (per inspection) are aperiodic.
    tag: "TRANSFER: IRIG 106 event semantics"
    source: "tejas_avionics_and_parameter_inventory.md Q7"
    sweep: none
    affects: [M14, M16, M18]
  R-TIME-RTC:
    title: Recorder RTC resolution
    statement: The recorder real-time counter runs at 10 MHz (100 ns ticks); all times are int64 nanoseconds (AD-35).
    tag: "TRANSFER: IRIG 106 Ch10"
    source: "IRIG 106 Ch10 (10 MHz 48-bit RTC), data_pathway_and_formats.md Q4; architecture AD-35"
    sweep: none
    affects: [M16, M17]
  R-REC-SETUP:
    title: Recorder setup - recording events and time-based index
    statement: >-
      The SYNTHETIC recorder (R-1) records event and index packets: three recorder events (REC_START,
      TIME_LOCK_LOST, TIME_LOCK_REGAINED; type R, priority 1, no initial capture, limit count 65,535) and a
      time-based index every 10 s, as M16 writes them (IRIG 106-15 10.6.7.3: index packets are enabled when event
      packets are; TMATS Table 9-3 R-x\EV, R-x\IDX). The TMATS generator emits these attributes from the dictionary.
    tag: ASSUMPTION
    basis: "event/index semantics TRANSFER: IRIG 106-15 Ch10 10.6.7 and Ch9 Table 9-3"
    source: "src/phalanx/recorder/setup.py and writer.py (W1.7, A-W1.7-12); research_sources/data_pathway/ch9_trmc_113019518.txt"
    sweep: index interval 1-60 s (no Tejas recorder setup is public)
    affects: [M16, M17]
    exposing_test: tests/unit/test_dictionary_tmats.py::test_recording_attributes_equal_the_m16_overlay
    replacement: Tejas recorder setup (not public)
    assumption_id: A-W0.3-44
  R-JFS-RATED-SPEED:
    title: JFS (GTSU-110) rated speed, the EU reference of SPS.JFS.SPEED
    statement: >-
      100 % SPS.JFS.SPEED = 60,000 rpm, the M09 JFS model's rated gas-generator speed (A-W1.4-26); one value,
      tested equal to M09's jfs_rated_speed. Not public.
    tag: ASSUMPTION
    source: "configs/tejas/params/M09.yaml jfs.jfs_rated_speed (A-W1.4-26: 100 kW-class centrifugal gas generators run ~50-70 krpm)"
    sweep: 40,000-80,000 rpm
    affects: [M09, M13]
    exposing_test: tests/unit/test_dictionary_eu.py::test_jfs_reference_equals_the_m09_parameter
    replacement: GTSU-110 data sheet
    assumption_id: A-W0.3-45
  R-REC-CDR48:
    title: CDR 4-8 Hz split
    statement: Inventory 'CDR4-8' rows record attitudes, heading and body rates/accelerations at CDR8 and positions, velocities and status at CDR4.
    tag: ASSUMPTION
    source: "tejas_avionics_and_parameter_inventory.md Q7 (attitudes and rates at 8; air data and engine at 4)"
    sweep: 4-8 Hz
    affects: [M16]
    exposing_test: M16 conformance tests (W1.7)
    replacement: Tejas CDR parameter list
    assumption_id: A-W0.3-32
  R-REC-DEFAULT:
    title: Default record group for a flagged sink with no record token
    statement: >-
      A sink the inventory flags (Y/A) but for which the row names no record group gets the sink default: COCKPIT ->
      DISPLAY, MPDRU -> LOG (on change + per-flight log), CDR -> CDR1, ECMS_HUMS -> ECMS1 (engine rows) or HUMS,
      FTI -> FTI.
    tag: ASSUMPTION
    source: "parameter_inventory.csv sink flags and rate_group_record; tables/sinks.yaml"
    sweep: per sink, any record group of that sink
    affects: [M14, M16]
    exposing_test: tests/unit/test_dictionary_validate.py::test_no_orphan_channels
    replacement: Tejas recorder parameter lists
    assumption_id: A-W0.3-33
  # ---- sinks ------------------------------------------------------------------------------------------------------
  R-SINK-ASSUMED:
    title: Sinks the inventory marks as assumed ('A')
    statement: Sink membership flagged 'A' (assumed) in the inventory is carried with basis 'assumed'.
    tag: ASSUMPTION
    source: "parameter_inventory.csv sink_* columns (Y evidenced, A assumed)"
    sweep: include/exclude the sink
    affects: [M14, M16]
    exposing_test: tests/unit/test_dictionary_validate.py::test_no_orphan_channels
    replacement: Tejas recorder/display parameter lists
    assumption_id: A-W0.3-34
  R-SINK-INTERNAL:
    title: Lanes are consumed by the voter or signal validator
    statement: >-
      Sensor lanes are consumed inside the acquiring LRU (DFCC median voting; FADEC cross-channel validation); harness
      averages are consumed by the FADEC T5 average; they reach recorders only through the validated output.
    tag: DIRECT
    basis: "DFCC median voting DIRECT (Kala); FADEC cross-channel checks TRANSFER (report §9)"
    source: "architecture §7; Kala (ADE), JOAST 67(2A) 2015"
    sweep: none
    affects: [M05, M08]
  R-SINK-FIX:
    title: Consumers for rows the inventory gives no sink
    statement: >-
      ENG.T25 is consumed inside the FADEC (N2c schedule on T25); SYS.PHASE and USAGE.TAC are computed on the ground;
      STRUCT.STRAIN and FTI.ALL are FTI (their fti_only flag is N although their bus/record groups are FTI-only - an
      inventory inconsistency). (MX.* rows need no fix: their record column names the maintenance record.)
    tag: ASSUMPTION
    source: "parameter_inventory.csv bus/rate_group_record columns; architecture M08 (N2 scheduled on PLA/T25)"
    sweep: none (structural)
    affects: [M08, M16, M18]
    exposing_test: tests/unit/test_dictionary_validate.py::test_no_orphan_channels
    replacement: Tejas FTI and maintenance-record definitions
    assumption_id: A-W0.3-35
  # ---- calibration, codes, limits ---------------------------------------------------------------------------------
  R-CAL-LINEAR:
    title: Linear counts-to-EU calibration at dictionary level
    statement: >-
      EU = c0 + c1 x counts with c0 = 0 and c1 = recorder LSB for BNR words; the calibration date is the dictionary
      release date. Per-serial calibration and installation bias are hidden state of M12 (AD-07), not dictionary values.
    tag: ASSUMPTION
    source: "IRIG 106 Ch9 C-group polynomial conversion (data_pathway_and_formats.md Q4/Q6)"
    sweep: none at dictionary level (per-serial offsets are M12 latent states)
    affects: [M12, M16, M17]
    exposing_test: tests/unit/test_dictionary_tmats.py::test_tmats_round_trips_channel_list
    replacement: calibration database per sensor serial
    assumption_id: A-W0.3-36
  R-CODES-SYNTHETIC:
    title: Synthetic code tables
    statement: >-
      SSS-NNN BIT/fault codes, CWS legend slots, FCS law, GPS fix / figure of merit / INS mode, borescope grade and
      store-station codes are synthetic Phalanx tables (AD-19); real Tejas code structures, the CWS legend list and the
      IAF forms are not public. The GPS figure of merit is a 9-level code (the inventory gives its units as 'enum' and
      its quantisation as 'bits'); the number of levels and their order are synthetic. 0.1.2: FCS law 3 = GROUND
      (W1.2), fighter flight phases 8-15 (W1.1), and one unified BIT/fault/exceedance table `bit_codes` (104 codes:
      M14's 102 plus two M08 afterburner faults; severities, fault lists, CWS legend and voice mapping, monitor limit
      ids; AD-48 item 5) with a documented map from M08's earlier codes.
    tag: ASSUMPTION
    source: "architecture AD-19; tejas_avionics_and_parameter_inventory.md Q3/Q6; parameter_inventory.csv notes ('Tejas code structure not public', 'Legend list not public')"
    sweep: none (labels only)
    affects: [M02, M05, M08, M14, M17, M18]
    exposing_test: tests/unit/test_dictionary_compile.py::test_code_tables_marked_synthetic
    replacement: CWS legend list and BIT code structure (architecture §19 request)
    assumption_id: A-W0.3-37
  R-CODE-WORD:
    title: Code-word bit layout of SSS-NNN fault-code channels
    statement: >-
      A code_word channel carries one synthetic SSS-NNN code per 16-bit word: prefix index k (position of the prefix
      in the channel's prefixes list) in bits 15-10 and NNN in bits 9-0; the EU value (CIR and contract) is
      k * 1000 + NNN, and 0 means no active code. Moved into the dictionary (bit_code_format.word_layout) from the
      W1.7 bus encoder (A-W1.7-6).
    tag: ASSUMPTION
    source: "src/phalanx/bus/words.py (W1.7, A-W1.7-6); R-CODES-SYNTHETIC defines the format, not the bit layout"
    sweep: any injective layout (no physical effect)
    affects: [M08, M14, M15, M17]
    exposing_test: tests/unit/test_dictionary_codes.py::test_code_word_layout_round_trips_every_code
    replacement: Tejas ICD fault-word format
    assumption_id: A-W0.3-43
  R-CODES-PHASE:
    title: Flight-phase codes from DASHlink
    statement: SYS.PHASE uses the DASHlink PH codes (0 unknown, 1 preflight, 2 taxi, 3 takeoff, 4 climb, 5 cruise, 6 approach, 7 rollout).
    tag: "TRANSFER: DASHlink FAQ (2014)"
    source: "analysis/dashlink_texture/dlio.py PHASES (DASHlink FAQ 2014)"
    sweep: none
    affects: [M02, M17, M20]
  # ---- proxies ----------------------------------------------------------------------------------------------------
  P-FTI-ALL:
    title: FTI.ALL is a placeholder channel
    statement: >-
      FTI.ALL stands for the ~1,500-parameter Tejas FTI set (test aircraft only) as one placeholder channel; the
      individual FTI parameters are not expanded (the list is not public).
