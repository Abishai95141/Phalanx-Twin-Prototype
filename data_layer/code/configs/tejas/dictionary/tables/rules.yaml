# Provenance rules. A dictionary field whose value does not come verbatim from parameter_inventory.csv cites one of
# these rules (prov ref "R-..." or "P-..."). Every rule tagged ASSUMPTION, and every rule with `proxy: true`, has an
# `assumption_id` and a row in docs/assumptions.md (W0.3 section): one row per rule, listing the parameters it affects
# (brief W0.3 §2). `tag` must parse with phalanx.core.module.EvidenceTag: DIRECT[-unnamed|-part], TRANSFER: <donor>,
# MEASURED or ASSUMPTION. PROXY is a flag (`proxy: true`, P- rules), not an evidence tag (core Param.proxy).
format: phalanx.dictionary.rules/1
rules:
  # ---- inventory-level -------------------------------------------------------------------------------------------
  R-INV-ROW-ASSUMPTION:
    title: Inventory rows whose evidence tag includes ASSUMPTION
    statement: >-
      Values transcribed from inventory rows whose evidence tag contains ASSUMPTION (wholly or in part) are carried
      with that tag; the channel exists and is wired as the inventory states, but its existence, sensor or allocation
      on the IN20/Tejas is not public.
    tag: ASSUMPTION
    source: research_notes/Virtual fighter telemetry layer research/parameter_inventory.csv (evidence_tag column)
    sweep: per value; channel existence on/off, ranges x0.5-x1.5 of span
    affects: [M07, M08, M09, M12, M13, M14, M15]
    exposing_test: tests/unit/test_dictionary_provenance.py::test_assumption_rules_registered
    replacement: GE/HAL FADEC I/O list and ADA utility I/O lists (architecture §19 requests)
    assumption_id: A-W0.3-1
  R-INV-FIELD-ASSUMPTION:
    title: Inventory fields individually marked [ASSUMPTION]
    statement: >-
      Ranges, rates, sensor types, redundancy and allocations that the inventory itself marks [ASSUMPTION] in a field
      (for example ENG.OIL_P range 0-200 psid, AD.* bus rate 25 Hz, CDR 16 Hz) are used as written and tagged ASSUMPTION.
    tag: ASSUMPTION
    source: research_notes/Virtual fighter telemetry layer research/parameter_inventory.csv (field text)
    sweep: ranges x0.5-x1.5 of span; rates inside the band stated in the field
    affects: [M08, M12, M13, M15, M16]
    exposing_test: tests/unit/test_dictionary_provenance.py::test_inv_fields_marked_assumption_are_tagged
    replacement: Tejas ICD / LRU specifications if released
    assumption_id: A-W0.3-2
  # ---- lane and channel expansion ---------------------------------------------------------------------------------
  R-LANE-FCS-QUAD:
    title: DFCC quadruplex sensing expands to lanes A-D plus the voted output
    statement: >-
      Rate sensors, accelerometers, pilot-command sensors and primary actuator position transducers are acquired by
      each of the four DFCC channels (lanes A-D, consumed by median voting); the voted/selected value (lane V) carries
      the row's bus mapping and sinks.
    tag: DIRECT
    source: "Kala (ADE), JOAST 67(2A) 2015 https://joast.org/index.php/joast/article/view/317 (quadruplex, median voting); tejas_airframe_aero_fcs.md Q3"
    sweep: none
    affects: [M05, M12, M13]
  R-LANE-AD-QUAD:
    title: Air-data transducers and vane LVDTs expand to four ADC lanes plus the selected output
    statement: >-
      Each of the four ADCs has its own Ps/Pt/dP transducers and each vane has a quadruplex LVDT; lane n is read by
      ADC n and sent over RS-422 to DFCC channel n; lane V is the selected value relayed to the avionics bus.
    tag: DIRECT
    source: "Kala (ADE), JOAST 67(2A) 2015; Rajalakshmi et al., DSJ 56(1) 2006 https://www.publicationsdrdo.in/index.php/dsj/article/view/1863"
    sweep: none
    affects: [M05, M12, M13]
  R-LANE-FADEC-DUAL:
    title: FADEC dual-channel acquisition (lanes A/B plus the validated output)
    statement: >-
      Engine sensors the inventory marks dual (PLA, N1 dual pickups, N2 alternator winding per channel, T1, PS3, A8)
      are acquired by FADEC channels A and B; lane V is the validated value after FADEC signal validation (M08).
      The IN20 FADEC channel count is not public (dual is assumed in the inventory).
    tag: ASSUMPTION
    source: "parameter_inventory.csv redundancy column; f404_in20_engine_model.md Q3 (-400 dual NL pickups); NASA CR-191195"
    sweep: simplex (1 lane) or dual (2 lanes) per sensor
    affects: [M07, M08, M12, M13]
    exposing_test: M08 signal-validation acceptance tests (W1.3b)
    replacement: GE/HAL FADEC I/O list
    assumption_id: A-W0.3-3
  R-LANE-ACTUATOR-UNITS:
    title: Slat and airbrake rows expand per actuator and per sensor core
    statement: >-
      FCS.SLAT.POS covers 6 slat actuators (IB/MB/OB per side), each with dual electrical position feedback;
      FCS.AIRBRAKE.POS covers 2 open-loop jacks, each with a dual-core LVDT; each actuator also has a selected output V.
    tag: DIRECT
    source: "parameter_inventory.csv FCS.SLAT.POS, FCS.AIRBRAKE.POS; report §1 (13 actuators: 4 elevons, rudder, 6 slats, 2 airbrakes)"
    sweep: none
    affects: [M05, M12]
  R-UNITS-INV:
    title: Per-unit expansion named in the inventory row
    statement: >-
      Rows that name their units (fuel tanks F1/F1A/F2/wing L/R and drop-tank stations; DC buses main/essential/
      emergency; TRU 1/2; DFCC channels; ADC units; generator phases; gears; 1553 buses) expand to one channel per unit.
    tag: DIRECT
    source: "parameter_inventory.csv row text; tejas_utility_systems.md KQ3 (tanks, drop tanks 2 x 1,200 L inboard + centreline), KQ5"
    sweep: none
    affects: [M09, M12, M15]
  R-UNITS-ASSUMED:
    title: Per-unit expansion whose unit list is not public
    statement: >-
      Brake pressure is expanded to the two main wheels (L/R), the main AC generator voltage to three phases
      (115/200 V 3-phase 400 Hz feed of the HAL TRUs), and drop-tank contents to three stations (inboard L/R, centreline).
    tag: ASSUMPTION
    source: "tejas_utility_systems.md KQ3, KQ5, KQ7; MIL-STD-704F"
    sweep: unit count +/-1 (e.g. single-phase sensing, nose-wheel brake absent/present)
    affects: [M09, M12]
    exposing_test: M09 balance tests (W1.4)
    replacement: ADA electrical and brake schematics
    assumption_id: A-W0.3-4
  R-COMPONENTS:
    title: Multi-quantity rows split into one channel per quantity
    statement: >-
      Rows that combine several physical quantities (for example V/A/Ah) are split into one channel per quantity, as
      named in the row text, so that every channel has exactly one engineering unit.
    tag: DIRECT
    source: parameter_inventory.csv name and units columns
    sweep: none
    affects: [M12, M13, M15]
  R-DISCRETE-PACK:
    title: Discretes packed into bit-packed status words
    statement: >-
      The discretes of a row are packed one bit each into a single 16-bit (or 32-bit) status word, bit order = order of
      mention in the row text; MIL-STD-1553B permits bit packing.
    tag: ASSUMPTION
    source: "parameter_inventory.csv recommended_quantization ('1 bit per discrete (bit-packed status word) [ASSUMPTION]'); MIL-STD-1553B §4.3.2 (data_pathway_and_formats.md Q2)"
    sweep: bit order and word grouping (no effect on physical values)
    affects: [M14, M15, M17]
    exposing_test: tests/unit/test_dictionary_icd.py::test_bitfield_words_have_unique_bits
    replacement: Tejas ICD
    assumption_id: A-W0.3-5
  R-PER-RT:
    title: RT status, BIT word and health message expanded per synthetic-ICD remote terminal
    statement: >-
      AV.RT.STATUS (1553 status word), AV.LRU.BIT (mode code 19 BIT word) and AV.LRU.HEALTH (ADE-style 4-word health
      message: words 0-2 link/port/memory codes, word 3 device temperature 0.1 degF two's complement) are expanded to
      one channel set per remote terminal of the synthetic ICD.
    tag: ASSUMPTION
    source: "Trivedi (ADE), JOAST 63(4) 2011 https://joast.org/index.php/joast/article/view/598 [DIRECT-unnamed]; MIL-STD-1553B mode codes [TRANSFER]"
    sweep: RT set follows R-ICD-TOPOLOGY
    affects: [M14, M15, M17]
    exposing_test: tests/unit/test_dictionary_icd.py::test_per_rt_rows_cover_every_rt
    replacement: Tejas ICD
    assumption_id: A-W0.3-6
  R-VOTED-SEPARATE:
    title: No V lane where the inventory has a separate voted row
    statement: FCS.RSA.Q and FCS.ASA.NZ have no V lane because the inventory carries FCS.VOTED.Q and FCS.VOTED.NZ.
    tag: DIRECT
    source: parameter_inventory.csv rows FCS.VOTED.Q, FCS.VOTED.NZ
    sweep: none
    affects: [M05, M15]
  R-T5-HARNESS:
    title: T5 probes are averaged inside two harnesses; no per-probe channels
    statement: >-
      The 8 T5 probes are electrically averaged within 2 harnesses (open probe drops out, shorted probe pulls the
      harness low); the acquired quantities are the two harness averages and their FADEC average.
    tag: "TRANSFER: F404-400"
    source: "NASA CR-1998-208416 §3.2.4 https://ntrs.nasa.gov/citations/19980219005 ; f404_in20_engine_model.md Q3"
    sweep: none
    affects: [M12]
  # ---- synthetic ICD ----------------------------------------------------------------------------------------------
  R-ICD-TOPOLOGY:
    title: Synthetic bus topology
    statement: >-
      Three MIL-STD-1553B buses: AV-MUX-1 (mission; BC OAC), AV-MUX-2 (vehicle systems; BC OAC), WPN-MUX (BC SMS);
      CDR and HUMS DAU are listen-only bus monitors on AV-MUX-1/2. Labelled SYNTHETIC; not the Tejas ICD.
    tag: ASSUMPTION
    source: "tejas_avionics_and_parameter_inventory.md Q1 Inferences; 'three 1553B buses' (FAS 1999, secondary only)"
    sweep: 2-5 buses (Gripen has 5); FADEC on ARINC-429 instead of 1553
    affects: [M15, M16, M17]
    exposing_test: tests/unit/test_dictionary_icd.py::test_bus_addresses_unique
    replacement: Tejas ICD (architecture §19 request)
    assumption_id: A-W0.3-7
  R-ICD-RT-MAP:
    title: Synthetic RT address map
    statement: RT addresses and the LRU-to-bus allocation are synthetic and arbitrary.
    tag: ASSUMPTION
    source: "tejas_avionics_and_parameter_inventory.md Q1 Gaps (RT addresses not public)"
    sweep: any permutation (no physical effect; decoders must read addresses from the dictionary)
    affects: [M15, M17]
    exposing_test: tests/unit/test_dictionary_icd.py::test_bus_addresses_unique
    replacement: Tejas ICD
    assumption_id: A-W0.3-8
  R-ICD-WORDS:
    title: AS15532-style data words and per-message validity words
    statement: >-
      Analog quantities are 16-bit two's-complement BNR words with LSB = recorder LSB; quantities that do not fit use
      2 words, most-significant word first; discretes are bit-packed; each message starts with one validity word per
      16 data items (bit set = BUS_INVALID, AD-45), in the style of the F/A-18C ADC validity words; data items are packed
      in channel-ID order, fastest rate group first.
    tag: ASSUMPTION
    source: "data_pathway_and_formats.md Q2 Inferences (SAE AS15532 conventions; MIL-STD-1553B §4.3.2 MSW first) ; NAWCADPAX/RTR-2001/1 Table E-3 (F/A-18C validity words IAVAL3/IAVAL4, MSW/LSW) https://archive.org/details/DTIC_ADA407860"
    sweep: word width 16/32 bits; validity carried in status bits instead of validity words
    affects: [M15, M16, M17]
    exposing_test: tests/unit/test_dictionary_icd.py::test_words_fit_range_and_lsb
    replacement: Tejas ICD
    assumption_id: A-W0.3-9
  R-ICD-DFCC:
    title: DFCC 1553 interface carries voted FCS data and relayed air data
    statement: >-
      RT 1 (DFCC channel A interface) transmits the voted/selected FCS, actuator and relayed ADC words; channel B-D
      interfaces (RT 2-4) mirror it. The DFCC transmit buffer updates at FCS40 and the BC polls at AV50 (inventory
      [ASSUMPTION]); LG.WOW (inventory bus group FCS40) is carried here too.
    tag: ASSUMPTION
    source: "parameter_inventory.csv bus/bus_rate_hz ('50 (BC poll) of DFCC transmit buffer updated at 40 [ASSUMPTION]'); Raveendran & Prabhu RTO-MP-SCI-162-14 (DFCC -> 1553 -> CDR/GUH/FTI)"
    sweep: poll 40-80 Hz; mirrored vs channel-specific message sets
    affects: [M05, M15, M17]
    exposing_test: M15 duplicate/skip statistics (W1.7)
    replacement: Tejas ICD
    assumption_id: A-W0.3-10
  R-ICD-FADEC:
    title: FADEC/ECMS gateway is a 1553 RT on AV-MUX-2
    statement: >-
      Engine and ECMS words are published by a FADEC/ECMS gateway RT on AV-MUX-2 (alternative: ARINC-429 to the OAC or
      a utility EU). FVG/CVG, which the inventory records on the CDR via an assumed FADEC->CDR path, use this RT.
    tag: ASSUMPTION
    source: "parameter_inventory.csv ENG.* bus ('FADEC->1553 avionics bus or ARINC 429 ... [ASSUMPTION]'); tejas_avionics_and_parameter_inventory.md Q1 (Pickering note, F/A-18C SDC)"
    sweep: 1553 RT vs ARINC-429 transport
    affects: [M08, M15, M17]
    exposing_test: M15 encode/decode round trip (W1.7)
    replacement: GE/HAL FADEC interface definition
    assumption_id: A-W0.3-11
  R-ICD-UTILITY:
    title: Utility signals are published by BHEEM-EU and ECFM-C
    statement: >-
      Hydraulic, electrical, secondary-power, gear/brake/NWS/chute and fire signals are digitised and published by the
      BHEEM-EU RT; fuel, ECS and life-support signals by the ECFM-C RT. The digitising EU is the channel's clock domain.
    tag: ASSUMPTION
    source: "parameter_inventory.csv origin_lru ('utility EU (production: BHEEM-EU / ECFM-C) [ASSUMPTION for allocation]'); tejas_avionics_and_parameter_inventory.md Q1"
    sweep: alternative allocation between the two EUs
    affects: [M09, M13, M15]
    exposing_test: tests/unit/test_dictionary_validate.py::test_every_channel_has_producer
    replacement: ADA BHEEM/ECFM I/O lists
    assumption_id: A-W0.3-12
  R-ICD-OAC-BCAST:
    title: OAC-originated words are BC-to-broadcast messages
    statement: >-
      Words that originate in the OAC (1553 bus status, UTC time word, pilot event marker) are sent as BC-to-RT
      broadcast messages (RT 31) on AV-MUX-2 so that the bus monitors record them.
    tag: ASSUMPTION
    source: "MIL-STD-1553B broadcast message structures (data_pathway_and_formats.md Q2); tejas_avionics_and_parameter_inventory.md Q1 (bus monitors)"
    sweep: dedicated RT-to-RT messages instead of broadcast
    affects: [M15, M16, M17]
    exposing_test: tests/unit/test_dictionary_icd.py::test_bus_addresses_unique
    replacement: Tejas ICD
    assumption_id: A-W0.3-13
  R-ICD-429:
    title: CWS and radar altimeter on ARINC-429 with synthetic labels
    statement: >-
      The CWS output and the radar altimeter use ARINC-429 links to the OAC. Labels are synthetic octal values, not
      ARINC 429 Attachment 1 assignments (paywalled); SDI 0; BNR data in bits 11-29 (19-bit two's complement);
      discrete words in bits 11-29; SSM per ARINC 429.
    tag: ASSUMPTION
    source: "data_pathway_and_formats.md Q2 (ARINC 429 word format; COTS LRUs on 429; Attachment 1 paywalled); DDP CWS (ARINC-429 + discretes)"
    sweep: radar altimeter on 1553 instead of 429; label values arbitrary
    affects: [M15, M17]
    exposing_test: tests/unit/test_dictionary_icd.py::test_bus_addresses_unique
    replacement: Tejas ICD
    assumption_id: A-W0.3-14
  R-ICD-RS422:
    title: ADC to DFCC and FTP to DFCC over RS-422
    statement: ADC unit n sends to DFCC channel n over RS-422; these links are internal to the FCS and not recorded.
    tag: DIRECT
    source: "Kala (ADE), JOAST 67(2A) 2015; tejas_avionics_and_parameter_inventory.md Q1"
    sweep: none
    affects: [M05, M15]
  R-ICD-FTI-PCM:
    title: FTI channels in a synthetic PCM minor frame
    statement: FTI channels are 12-bit words of one synthetic PCM minor frame at 64 Hz (test aircraft only).
    tag: ASSUMPTION
    source: "parameter_inventory.csv FTI.ALL ('10-12 bit PCM typical'); HAL trainer FTI 64 Hz (JOAST 67(2A) 331); HARV 25-800 sps"
    sweep: 10-16 bit words; 64-800 Hz
    affects: [M16]
    exposing_test: tests/unit/test_dictionary_tmats.py::test_tmats_round_trips_channel_list
    replacement: Tejas FTI format (not public)
    assumption_id: A-W0.3-15
  R-VALIDITY:
    title: Validity semantics
    statement: >-
      ARINC-429 SSM (BNR and discrete tables) and MIL-STD-1553B status-word semantics map to the contract validity
      names (NORMAL, NO_COMPUTED_DATA, FUNCTIONAL_TEST, FAILURE_WARNING, BUS_INVALID). Contract precedence (AD-38/41,
      AD-45): a set 1553 validity-word bit or RT status error is BUS_INVALID; FAILURE_WARNING comes only from the
      ARINC-429 SSM failure-warning code.
    tag: "TRANSFER: ARINC 429 / MIL-STD-1553B"
    source: "report §13 (validity enum); data_pathway_and_formats.md Q2; architecture §12"
    sweep: none
    affects: [M15, M17]
  # ---- quantisation -----------------------------------------------------------------------------------------------
  R-LSB-DASHLINK:
    title: Recorder LSB transferred from the DASHlink recorder lattice
    statement: >-
      Where the inventory recommends a DASHlink-measured recorder lattice (for example 0.03125 % N1, 8 lb/h fuel flow,
      0.044 deg AoA), that LSB is used for the Tejas bus/recorder word. The Tejas value is not public; DASHlink is a
      B757 QAR (other platform), so this is a stand-in, not a Tejas measurement. Native steps measured on DASHlink are
      NOT used in the Tejas dictionary (they are proxy-mode values).
    tag: ASSUMPTION
    basis: "TRANSFER: DASHlink Tail 687 recorder lattice [MEASURED on the proxy platform]"
    source: "parameter_inventory.csv recommended_quantization; empirical_dashlink_texture.md Q11(b)"
    sweep: LSB x0.25-x4 (keep steady-state sigma/LSB within 0.3-1.5)
    affects: [M13, M15, M17]
    exposing_test: M13 G1 residue-usage test (W1.6)
    replacement: Tejas recorder/ICD scaling
    assumption_id: A-W0.3-16
  R-LSB-MSDC:
    title: Recorder LSB transferred from the F404-400 IECMS/MSDC chain
    statement: Where the inventory recommends the -400 MSDC resolution (16 rpm, 1 K, 0.5 psia, 0.06 psia), that LSB is used.
    tag: ASSUMPTION
    basis: "TRANSFER: F404-400 IECMS (Henry, AGARD-CP-448 paper 37)"
    source: "parameter_inventory.csv recommended_quantization; Henry, AGARD-CP-448 paper 37 Table 1 https://archive.org/details/DTIC_ADA203800"
    sweep: LSB x0.25-x1 (FADEC likely finer than the legacy chain)
    affects: [M13, M15]
    exposing_test: M13 G1 residue-usage test (W1.6)
    replacement: IN20 FADEC/ECMS word scaling
    assumption_id: A-W0.3-17
  R-LSB-INVREC:
    title: Recorder LSB as recommended by the inventory without a stated basis
    statement: The inventory's recommended quantisation is used as the recorder LSB where it states no source.
    tag: ASSUMPTION
    source: parameter_inventory.csv recommended_quantization
    sweep: LSB x0.25-x4
    affects: [M13, M15]
    exposing_test: M13 G1 residue-usage test (W1.6)
    replacement: Tejas ICD scaling
    assumption_id: A-W0.3-18
  R-LSB-BNR:
    title: Power-of-two BNR LSB computed from the full-scale range
    statement: >-
      Where the inventory gives no numeric quantisation (for example '16-bit BNR; choose LSB so steady-state sigma is
      ~0.3-1.5 LSB'), the LSB is the smallest power of two 2^k with which the full-scale range [rmin, rmax] fits an
      n-bit AS15532-style word (icd.bnr_lsb). Two's complement when rmin < 0: counts -2^(n-1) .. 2^(n-1) - 1, so
      LSB >= max(-rmin / 2^(n-1), max(rmax, 0) / (2^(n-1) - 1)) (the negative side holds one more count). Unsigned
      when rmin >= 0: counts 0 .. 2^n - 1, so LSB >= rmax / (2^n - 1). n = 16 for one 1553 word, 32 for a two-word
      (MSW-first) quantity, 12 for an FTI PCM word; on ARINC 429 the 19-bit BNR field (18 data bits + sign) gives
      LSB >= max(abs(rmin), abs(rmax)) / (2^18 - 1). The smallest word that fits the range at that LSB is then chosen. A
      value that leaves the aircraft only in a download or maintenance record (float64, no recorder word) keeps the
      LSB of the row's 16-bit word as its native (acquisition) step and has no recorder LSB.
    tag: ASSUMPTION
    source: "parameter_inventory.csv recommended_quantization; data_pathway_and_formats.md Q2 Inferences; src/phalanx/dictionary/icd.py bnr_lsb"
    sweep: >-
      LSB x0.25-x4; for two-word (32-bit) quantities from the 32-bit LSB up to the 16-bit (MSW-only) LSB, x1-x65536;
      re-choose so steady-state sigma/LSB is 0.3-1.5 once M13 noise is calibrated
    affects: [M13, M15]
    exposing_test: tests/property/test_dictionary_properties.py::test_bnr_lsb_fits_and_is_minimal
    replacement: Tejas ICD scaling
    assumption_id: A-W0.3-19
  R-NATIVE-EQ-LSB:
    title: Native step equal to the recorder LSB when not public
    statement: >-
      Where the sensor/LRU native resolution is not public, native step = recorder LSB (a degenerate double quantiser).
      DASHlink native steps (N1/N2 0.04 %, EGT 0.8 degC, FF 8 lb/h) are proxy-mode values and are not used here.
    tag: ASSUMPTION
    basis: "native/recorder step ratios 1.0-1.6 measured on DASHlink (FF 1.0, N1 1.28, EGT 1.6) [MEASURED, proxy]"
    source: "analysis/settling_experiment/results/native_step_cal.json; architecture M13 (AD-05)"
    sweep: native/LSB ratio 1.0-1.6
    affects: [M13]
    exposing_test: M13 G1 residue-usage test (W1.6)
    replacement: Tejas recorder data (residue analysis as in native_step_cal)
    assumption_id: A-W0.3-20
  R-FADEC-ADC:
    title: FADEC lane converter step from an assumed 14-bit FADEC converter
    statement: >-
      FADEC lane channels (ENG.*.A/B, role lane, digitised inside the FADEC) carry the FADEC's own converter
      resolution in converter_step = full-scale span / 2^14 (analog lanes adc_bits = 14; speed lanes the equivalent
      14-bit counter resolution). The IN20 FADEC bit resolution is not public (f404_in20_engine_model.md Gaps;
      empirical_dashlink_texture.md: 'F404-IN20 FADEC/1553 word resolution is unknown'); across the whole sweep the
      converter step stays finer than the recorded word LSB (PS3 0.5 psi, the -400 MSDC resolution), which is what
      the FADEC control loop needs (W1.3b: 0.5 psi PS3 steps make fuel flicker). Since 0.1.3 this step is the
      lanes' native_step (until 0.1.2 it was carried as converter_step while M13 still scaled its MEASURED lane
      noise by the native step; M13 now quantises the lanes at this step with the lane noise in EU, W2.2).
    tag: ASSUMPTION
    source: "f404_in20_engine_model.md (Gaps: IN20 FADEC bit resolution not public; MSDC resolutions PS3 0.5 psia, N 16 rpm, T 1 K); empirical_dashlink_texture.md Q3; W1.3b report; src/phalanx/acquisition/config.py (sigma = sigma_steps x native_step)"
    sweep: 12-16 bits (converter step span/4096 .. span/65536)
    affects: [M08, M12, M13]
    exposing_test: tests/unit/test_dictionary_validate.py::test_fadec_lanes_carry_the_fadec_converter_step
    replacement: IN20 FADEC converter specification
    assumption_id: A-W0.3-41
  R-ADC-BITS:
    title: ADC resolution sufficient for the native step
    statement: For analog-acquired channels, adc_bits = max(12, ceil(log2(span / native_step))).
    tag: ASSUMPTION
    source: "parameter_inventory.csv FTI.ALL ('10-12 bit PCM typical'); architecture M01 (ADC bits per channel)"
    sweep: 10-18 bits
    affects: [M12, M13]
    exposing_test: tests/unit/test_dictionary_validate.py::test_adc_bits_vs_native_step
    replacement: LRU acquisition specifications
    assumption_id: A-W0.3-21
  # ---- units and ranges -------------------------------------------------------------------------------------------
  R-UNIT-CHOICE:
    title: Reported engineering unit chosen among the inventory's alternatives
    statement: >-
      Where the inventory lists alternative units, the reported unit follows the cited bus word or recorder practice:
      %N1/%N2 (DASHlink, F/A-18C SDC), nozzle position % (F/A-18C SDC), pilot commands %, load factor in standard
      gravity (range and LSB stated in g), level in %.
    tag: ASSUMPTION
    source: "parameter_inventory.csv units/range/recommended_quantization; NAWCADPAX/RTR-2001/1 Table E-3"
    sweep: alternative unit (no physical effect; conversion is exact or linear)
    affects: [M13, M15, M17]
    exposing_test: tests/unit/test_dictionary_validate.py::test_units_parse_and_match_quantity
    replacement: Tejas ICD
    assumption_id: A-W0.3-22
  R-RANGE-FULLSCALE:
    title: Full-scale range bracketing an inventory operating band
    statement: >-
      Where the inventory gives an operating band rather than a measurement range, full scale = [0, 1.5 x band upper]
      for magnitudes (sources collapse to zero on transfer, MIL-STD-704F), and [-54 degC, band upper + 0.5 x
      (band upper + 54)] for temperatures (-54 degC is the inventory's common RTD floor); the band itself becomes a
      'normal_band' limit.
    tag: ASSUMPTION
    source: "parameter_inventory.csv range column; tejas_utility_systems.md KQ5 (MIL-STD-704F transfer semantics)"
    sweep: margin factor 1.2-2.0
    affects: [M09, M12, M13]
    exposing_test: tests/unit/test_dictionary_validate.py::test_range_lsb_word_consistency
    replacement: LRU sensor specifications
    assumption_id: A-W0.3-23
  R-RANGE-NOTPUBLIC:
    title: Full-scale range not public
    statement: >-
      Where the inventory gives no range for the channel (range '-', 'not public', or only a range of another quantity:
      cabin dP for cabin absolute pressure, row-total internal fuel for each tank), a full scale is stated per channel
      (for example NWS +/-75 deg, OBOGS outlet 0-500 kPa, strain +/-5000 microstrain, wheel speed 0-3500 rpm from the
      340 km/h emergency chute speed and the 26 in main tyre); each value is an ASSUMPTION swept inside the stated
      range. A full scale derived from capacities the inventory does give has its own rule (R-RANGE-FUEL-TOTAL).
    tag: ASSUMPTION
    source: "parameter_inventory.csv (range '-' or not public); tejas_utility_systems.md KQ7 (26x8.0-14 tyre, chute <=340 km/h)"
    sweep: per channel, x0.5-x2 of full scale
    affects: [M09, M12, M13]
    exposing_test: tests/unit/test_dictionary_validate.py::test_range_lsb_word_consistency
    replacement: LRU sensor specifications
    assumption_id: A-W0.3-24
  R-RANGE-FUEL-TOTAL:
    title: Total-fuel full scale from internal plus the largest external fuel load
    statement: >-
      FUEL.TOTAL full scale = 0 to internal fuel 2,458 kg (the inventory range) plus the largest stated drop-tank
      load, three tanks of 2 x 1,200 L + 800 L = 3,200 L (a three-drop-tank ferry is demonstrated), at the
      internal-fuel density 2,458 kg / 3,060 L = 0.803 kg/L (about 2,570 kg): about 5,030 kg, rounded up to
      6,000 kg. The capacities are DIRECT (secondary); that one total word covers external fuel, and the rounding
      margin, are assumed.
    tag: ASSUMPTION
    basis: "internal 2,458 kg / 3,060 L and 1,200/800/725 L drop tanks [DIRECT, secondary]"
    source: "parameter_inventory.csv FUEL.TOTAL range ('0-2,458 internal (+ drop tanks 1,200/800/725 L)'); tejas_utility_systems.md KQ3 (2,458 kg / 3,060 L; three-drop-tank ferry)"
    sweep: full scale 5,030-8,000 kg (LSB 1 kg from the inventory; a 16-bit unsigned word holds up to 65,535 kg)
    affects: [M09, M13, M15]
    exposing_test: tests/unit/test_dictionary_validate.py::test_range_lsb_word_consistency
    replacement: ECFM-C gauging specification
    assumption_id: A-W0.3-40
  R-AD51-COMPUTED:
    title: The radar-altimeter height is an LRU-computed digital output (AD-51), not an analog reading
    statement: >-
      The inventory classes NAV.RADALT as measured. The radar altimeter's height word is the output of the LRU's
      own range tracker (internally digitised, acquisition LRU-INT), and AD-51 makes it an output of the M12
      avionics extension supplied to the recorder as a RECORDED (LRU-computed) value, like the INS and AHRS
      outputs. The channel's signal class is therefore computed (no recorder-side converter, no adc_bits); range,
      LSB, bus and sinks are unchanged.
    tag: ASSUMPTION
    basis: "AD-51 (architecture decision register); the radar-altimeter tracker model in phalanx.sensors.avionics.radalt"
    source: "docs/architecture.md AD-51; parameter_inventory.csv NAV.RADALT (rate_group_acquisition LRU-INT)"
    sweep: "none (classification)"
    affects: [M12, M13, M15]
    exposing_test: tests/integration/test_w22_avionics_ports.py::test_recorded_channels_against_the_dictionary
    replacement: Tejas radio-altimeter ICD (output word definition)
    assumption_id: A-W0.3-46
  R-AD-PORT-PRESSURE:
    title: AD.DPA/DPB are flow-angle port pressures (absolute), not differential pressures
    statement: >-
      The inventory names AD.DPA/DPB 'differential pressure' but gives 35-1500 mbar, the range Kala (2015) quotes
      for the ADC transducers on the flow-angle ports (P-alpha1/beta1, P-alpha2/beta2; 'four pressure transducers
      fitted inside each ADC ... 35 to 1300 mbar (Ps); 35-2700 mbar (Pt), 35-1500 mbar (P-alpha/beta)'). A range
      starting at 35 mbar, like the absolute Ps/Pt transducers, is an absolute range, so the channels are absolute
      port pressures from which the ADC computes AoA/AoSS by differencing; the range is kept as written (DIRECT)
      and the pressure reference is absolute.
    tag: ASSUMPTION
    basis: "transducer range 35-1500 mbar [DIRECT, Kala (ADE) JOAST 67(2A) 2015 p. 215]"
    source: "parameter_inventory.csv AD.DPA/AD.DPB; tejas_airframe_aero_fcs.md (Kala 2015 transducer quote); report §4 air data"
    sweep: "pressure reference absolute (35-1500 mbar) or differential (signed, +/-1465 mbar span)"
    affects: [M12, M13]
    exposing_test: tests/unit/test_dictionary_validate.py::test_e0b_ad_port_pressures
    replacement: ADC interface specification
    assumption_id: A-W0.3-42
  R-RANGE-SENSOR:
    title: Voted outputs inherit the sensor range
    statement: >-
      A voted output can take any value its lanes can, so its word range is the sensor range (FCS.VOTED.NZ uses the
      ASA +/-13 g range; the inventory's -3.5..+9 g is the operating envelope and becomes a limit).
    tag: DIRECT
    source: "parameter_inventory.csv FCS.ASA.NZ (+/-13 g) and FCS.VOTED.NZ (envelope +8/-3.5)"
    sweep: none
    affects: [M05, M15]
  # ---- rates ------------------------------------------------------------------------------------------------------
  R-RATE-FCS:
    title: DFCC 80 Hz frame and binary sub-rates
    statement: DFCC frame 80 Hz (12.5 ms); sub-rates 40/20/10 Hz.
    tag: DIRECT
    basis: "80 Hz DIRECT; sub-rates TRANSFER: F/A-18 FCC (NASA TM-107601)"
    source: "Kala (ADE), JOAST 67(2A) 2015; tejas_avionics_and_parameter_inventory.md Q7"
    sweep: none
    affects: [M05, M13, M15]
  R-RATE-FADEC:
    title: FADEC frame 60 Hz inside the 50-67 Hz band
    statement: >-
      The FADEC acquisition frame is 60 Hz, inside the 50-67 Hz TRANSFER band (NASA FADEC templates); 60 Hz divides the
      240 Hz truth step exactly (240 = 4 x 60).
    tag: ASSUMPTION
    basis: "TRANSFER: NASA C-MAPSS40k/MAPSS templates (50-67 Hz)"
    source: "tejas_avionics_and_parameter_inventory.md Q7; architecture §8"
    sweep: 50-67 Hz
    affects: [M08, M13]
    exposing_test: M08 closed-loop lead-lag test (W1.3b)
    replacement: GE IN20 FADEC frame rate
    assumption_id: A-W0.3-25
  R-RATE-LRU:
    title: LRU-internal acquisition frames
    statement: >-
      Nominal internal frames: INS 100 Hz (band 100-2000), hydraulic model 200 Hz (band 200-500), slow utility 10 Hz
      (band 1-10), utility EUs and CWS 40 Hz (HARV utility data at 40 sps), radar altimeter 25 Hz, AHRS 100 Hz,
      SMS and radar 50 Hz.
    tag: ASSUMPTION
    basis: "bands TRANSFER (tejas_avionics_and_parameter_inventory.md Q7; NASA CR-201670)"
    source: "parameter_inventory.csv native_rate_hz; tejas_avionics_and_parameter_inventory.md Q7"
    sweep: inside each band
    affects: [M12, M13, M15]
    exposing_test: M15 duplicate/skip statistics (W1.7)
    replacement: LRU specifications
    assumption_id: A-W0.3-26
  R-RATE-AV:
    title: Avionics 1553 rate groups
    statement: 50 Hz minor frame, 12.5 Hz major frame (4 minor frames), 25 and 6.25 Hz binary sub-multiples.
    tag: ASSUMPTION
    basis: "DIRECT-unnamed: ADE 12.5 Hz health message with 4 minor frames (JOAST 63(4) 598)"
    source: "tejas_avionics_and_parameter_inventory.md Q7"
    sweep: minor frame 25-100 Hz
    affects: [M15]
    exposing_test: M15 bus-loading test (W1.7)
    replacement: Tejas BC schedule
    assumption_id: A-W0.3-27
  R-RATE-SLOW:
