# M07 F404-GE-IN20 engine truth model: model parameters (format phalanx.params/1).
# Owner: W1.3a. Evidence base: research_notes/Virtual fighter telemetry layer research/f404_in20_engine_model.md
# ("note" below), report §3/§7/§10 and Appendix A. Restricted values (report App. A1: F404 start EGT, oil-pressure
# bands, -402 MIL EGT limit, thermal-soak restart rule) are NOT used anywhere in this file.
# Derived quantities (map scalers, design references) are computed from these inputs by phalanx.engine.design.
format: phalanx.params/1
module: M07
sets:
  design:
    w2_design:
      value: 70.0
      units: kg/s
      description: Inlet airflow at SLS ISA maximum rating (design point of the cycle)
      evidence: {tag: DIRECT, source: "GE F404 family data sheet (IN20: 153 lb/s, 70 kg/s); note Q1, Q12 row 2"}
    opr_design:
      value: 28.0
      units: "1"
      description: Overall pressure ratio P3/P2 at the design point
      evidence: {tag: DIRECT, source: "GE F404 family data sheet (IN20 OPR 28:1); note Q12 row 3"}
    thrust_max_ab:
      value: 84.0
      units: kN
      description: Maximum (afterburning) uninstalled thrust at SLS ISA; sets the max-AB fuel flow at design
      evidence: {tag: DIRECT, source: "GE F404 family data sheet (84 kN, 19,000 lb class); note Q12 row 1"}
    fpr_design:
      value: 4.35
      units: "1"
      description: Fan total pressure ratio at design (IN20 closure)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure 4.3-4.4 (-402 4.3 NPS 1998; RM12 4.0-4.4 derived); architecture §6 M07"}
      sweep: [4.3, 4.4]
      assumption_id: A-W1.3a-1
    bpr_design:
      value: 0.28
      units: "1"
      description: Bypass ratio at design (IN20 closure)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure 0.27-0.30 (-402 0.27/0.29; RM12 0.31); architecture §6 M07"}
      sweep: [0.27, 0.30]
      assumption_id: A-W1.3a-1
    t4_design:
      value: 1780.0
      units: K
      description: Combustor-exit total temperature at design (before NGV cooling dilution)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure 1,770-1,790 K (-400 TIT 1,663 K ARL 1985 + RM12-type uplift); architecture §6 M07"}
      sweep: [1770.0, 1790.0]
      assumption_id: A-W1.3a-1
    n1_100pct:
      value: 13270.0
      units: rpm
      description: Fan mechanical speed at 100 % N1 (percent reference; the design MIL point runs at 100 % N1)
      evidence: {tag: "TRANSFER: F404-400", source: "ARL-AERO-PROP-TM-426 Fig. 3; dictionary constants channel_reference.n1_100pct; note Q12 row 17"}
    n2_100pct:
      value: 16810.0
      units: rpm
      description: Core mechanical speed at 100 % N2 (percent reference; the design MIL point runs at n2_mil_frac of it)
      evidence: {tag: "TRANSFER: F404-400", source: "ARL-AERO-PROP-TM-426 Fig. 3; DSTO-TN-0530 (280 Hz 1/rev); dictionary constants channel_reference.n2_100pct"}
    n2_mil_frac:
      value: 0.952
      units: "1"
      description: Core speed at the design MIL point as a fraction of 100 % N2 (AD-46; MIL is not at 100 % N2)
      evidence: {tag: ASSUMPTION, source: "F404-400/F1D2 test cell MIL N2 15,994 rpm = 95.2 % (USAF IERA-RS-BR-TR-1999-0006 Tbl 4-71, DTIC ADA361473 [TRANSFER]); IN20 MIL N2 about 94-97 % (research_notes/.../iaf_usage_and_validation_gap_closure.md Q3 inferences)"}
      sweep: [0.94, 0.97]
      assumption_id: A-W1.3a-20
    eta_fan_design:
      value: 0.853
      units: "1"
      description: Fan isentropic efficiency at design (from polytropic 0.88 at PR 4.35)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption fan polytropic 0.87-0.89"}
      sweep: [0.83, 0.87]
      assumption_id: A-W1.3a-1
    eta_hpc_design:
      value: 0.858
      units: "1"
      description: HPC isentropic efficiency at design (from polytropic 0.89 at PR 6.47)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption HPC polytropic 0.88-0.90"}
      sweep: [0.83, 0.88]
      assumption_id: A-W1.3a-1
    eta_hpt_design:
      value: 0.885
      units: "1"
      description: HPT isentropic efficiency at design (single stage, cooled)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure (turbine polytropic 0.88-0.89); ARL 1985 single-stage turbines 'at some cost in efficiency'"}
      sweep: [0.86, 0.91]
      assumption_id: A-W1.3a-1
    eta_lpt_design:
      value: 0.89
      units: "1"
      description: LPT isentropic efficiency at design
      evidence: {tag: ASSUMPTION, source: "note Q1 closure (turbine polytropic 0.88-0.89)"}
      sweep: [0.86, 0.91]
      assumption_id: A-W1.3a-1
    f_ngv:
      value: 0.11
      units: "1"
      description: HP NGV cooling air, fraction of HPC delivery (mixes upstream of the HPT rotor)
      evidence: {tag: "TRANSFER: F404-400", source: "ARL-AERO-PROP-TM-426 PDF pp.9-10 (about 11 % of compressor-discharge air cools the HP NGVs); note Q12 row 26"}
    f_rot:
      value: 0.07
      units: "1"
      description: Turbine blade/disc and LPT cooling air, fraction of HPC delivery (mixes downstream of the HPT rotor)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption (about 7 % blade/disc cooling); pyCycle mixed-flow example 6.7 % + 5.1 %"}
      sweep: [0.04, 0.10]
      assumption_id: A-W1.3a-1
    p_acc_design:
      value: 50.0
      units: kW
      description: Engine accessory-gearbox load at 100 % N2 (fuel, lube and VEN pumps, alternator); scales with N2^2
      evidence: {tag: ASSUMPTION, source: "note Q1 closure used 150 kW total power off-take (incl. aircraft PTO); engine-only share not public"}
      sweep: [20.0, 150.0]
      assumption_id: A-W1.3a-16
    eta_mech:
      value: 0.995
      units: "1"
      description: Shaft mechanical efficiency (bearing and windage losses)
      evidence: {tag: ASSUMPTION, source: "not public; generic gas-turbine practice"}
      sweep: [0.98, 1.0]
      assumption_id: A-W1.3a-16
    fan_ncmap_design:
      value: 1.0
      units: "1"
      description: Design-point position on the fan (AXI5) map, corrected-speed axis
      evidence: {tag: ASSUMPTION, source: "pyCycle AXI5 map defaults (NcMap 1.00, RlineMap 2.0); map positions not public"}
      sweep: [0.95, 1.05]
      assumption_id: A-W1.3a-2
    fan_rline_design:
      value: 2.0
      units: "1"
      description: Design-point position on the fan (AXI5) map, R-line axis (stall line R = 1.0)
      evidence: {tag: ASSUMPTION, source: "pyCycle AXI5 map defaults (RlineMap 2.0)"}
      sweep: [1.6, 2.4]
      assumption_id: A-W1.3a-2
    hpc_ncmap_design:
      value: 1.0
      units: "1"
      description: Design-point position on the HPC (HBTF) map, corrected-speed axis
      evidence: {tag: ASSUMPTION, source: "pyCycle HBTF HPC map (defaults NcMap 0.976, RlineMap 2.05); 1.0/2.0 chosen to centre 100 % N2c"}
      sweep: [0.95, 1.05]
      assumption_id: A-W1.3a-2
    hpc_rline_design:
      value: 2.0
      units: "1"
      description: Design-point position on the HPC (HBTF) map, R-line axis
      evidence: {tag: ASSUMPTION, source: "pyCycle HBTF HPC map defaults (RlineMap 2.05)"}
      sweep: [1.6, 2.4]
      assumption_id: A-W1.3a-2
    turb_npmap_design:
      value: 100.0
      units: "1"
      description: Design-point position on the HPT/LPT (HBTF) maps, Np axis
      evidence: {tag: ASSUMPTION, source: "pyCycle HBTF HPT/LPT map defaults (NpMap 100)"}
      sweep: [90.0, 110.0]
      assumption_id: A-W1.3a-2
    turb_prmap_design:
      value: 6.0
      units: "1"
      description: Design-point position on the HPT/LPT (HBTF) maps, PR axis
      evidence: {tag: ASSUMPTION, source: "pyCycle HBTF HPT/LPT map defaults (PRmap 6.0)"}
      sweep: [4.0, 7.0]
      assumption_id: A-W1.3a-2
    m3_design:
      value: 0.25
      units: "1"
      description: HPC-exit Mach number at design (sets the PS3/P3 static-to-total relation)
      evidence: {tag: ASSUMPTION, source: "pyCycle mixed-flow example hpc.MN 0.2442; F404 value not public"}
      sweep: [0.15, 0.35]
      assumption_id: A-W1.3a-1
    eps13_frac:
      value: 0.001
      units: "1"
      description: Bypass-duct flow-law regularisation, fraction of the design duct pressure drop (numerical)
      evidence: {tag: ASSUMPTION, source: "numerical regularisation of W ~ sqrt(dP) near dP = 0; no physical content"}
      sweep: [0.0001, 0.01]
      assumption_id: A-W1.3a-5
  components:
    dp_core_duct:
      value: 0.0048
      units: "1"
      description: Fan-exit to HPC-inlet total-pressure loss fraction
      evidence: {tag: ASSUMPTION, source: "pyCycle mixed-flow example splitter_core_duct dPqP 0.0048"}
      sweep: [0.002, 0.015]
      assumption_id: A-W1.3a-1
    dp_burner:
      value: 0.05
      units: "1"
      description: Combustor total-pressure loss fraction at design (scales with corrected flow squared)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption (combustor dP 5 %); pyCycle 0.054"}
      sweep: [0.04, 0.06]
      assumption_id: A-W1.3a-1
    dp_bypass_duct:
      value: 0.03
      units: "1"
      description: Bypass-duct total-pressure loss fraction at design (fan exit to mixer entry)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption (bypass duct loss 3 %)"}
      sweep: [0.01, 0.05]
      assumption_id: A-W1.3a-1
    m_bypass_mixer:
      value: 0.40
      units: "1"
      description: Bypass-stream Mach number at mixer entry at design (sets the mixer static pressure)
      evidence: {tag: ASSUMPTION, source: "pyCycle mixed-flow example bypass_duct MN 0.4463; F404 value not public"}
      sweep: [0.25, 0.55]
      assumption_id: A-W1.3a-5
    dp_mixer:
      value: 0.02
      units: "1"
      description: Mixing total-pressure loss (mixed-out total relative to the mass-averaged entry totals) at design
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption (mixer 2 %)"}
      sweep: [0.005, 0.04]
      assumption_id: A-W1.3a-1
    dp_ab_dry:
      value: 0.04
      units: "1"
      description: Afterburner duct dry total-pressure loss fraction at design (scales with corrected flow squared)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption (dry AB duct 4 %)"}
      sweep: [0.02, 0.06]
      assumption_id: A-W1.3a-1
    k_rayleigh:
      value: 0.03
      units: "1"
      description: Afterburner heat-addition (Rayleigh) pressure loss per unit (T7/T6 - 1)
      evidence: {tag: ASSUMPTION, source: "not public; order of the hot-loss increase for a duct Mach about 0.2"}
      sweep: [0.01, 0.06]
      assumption_id: A-W1.3a-1
    eta_burner:
      value: 0.99
      units: "1"
      description: Main combustor efficiency (constant; no loading or altitude dependence in W1)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption (eta 0.99)"}
      sweep: [0.97, 0.995]
      assumption_id: A-W1.3a-17
    lhv:
      value: 43.1
      units: MJ/kg
      description: Fuel lower heating value (Jet-A/JP-8 class)
      evidence: {tag: "TRANSFER: Jet-A/JP-8 typical", source: "note Q1 closure assumption (LHV 43.1 MJ/kg); F100 TM X-3261 used 44.07"}
    eta_ab:
      value: 0.91
      units: "1"
      description: Afterburner combustion efficiency
      evidence: {tag: ASSUMPTION, source: "note Q1 closure (AB efficiency 0.90-0.92)"}
      sweep: [0.88, 0.94]
      assumption_id: A-W1.3a-17
    cfg:
      value: 0.98
      units: "1"
      description: Nozzle gross-thrust coefficient (fully expanded ideal thrust times cfg)
      evidence: {tag: ASSUMPTION, source: "note Q1 closure assumption (nozzle Cv 0.98); pyCycle Cfg 0.9933"}
      sweep: [0.96, 0.995]
      assumption_id: A-W1.3a-19
    cd8:
      value: 0.97
      units: "1"
      description: Nozzle throat discharge coefficient (effective / geometric A8)
      evidence: {tag: ASSUMPTION, source: "not public; generic convergent-divergent nozzle"}
      sweep: [0.94, 0.99]
      assumption_id: A-W1.3a-19
    pr_choke_hpt:
      value: 2.0
      units: "1"
      description: HPT stage pressure ratio above which the flow capacity is choked
      evidence: {tag: ASSUMPTION, source: "pyCycle HBTF turbine maps are choked over their whole range; unchoking modelled as an equivalent nozzle"}
      sweep: [1.7, 2.4]
      assumption_id: A-W1.3a-4
    pr_choke_lpt:
      value: 1.9
      units: "1"
      description: LPT stage pressure ratio above which the flow capacity is choked
      evidence: {tag: ASSUMPTION, source: "as pr_choke_hpt"}
      sweep: [1.6, 2.3]
      assumption_id: A-W1.3a-4
    gamma_turb_eq:
      value: 1.3
      units: "1"
      description: Ratio of specific heats of the equivalent nozzle used for turbine unchoking
      evidence: {tag: ASSUMPTION, source: "hot-gas gamma; form only"}
      sweep: [1.28, 1.35]
      assumption_id: A-W1.3a-4
    stall_slope:
      value: 1.0
      units: "1"
      description: Flow fall-off beyond the speed-line PR peak, relative (keeps the volume dynamics stable past the peak)
      evidence: {tag: ASSUMPTION, source: "numerical continuation of the map; surge is triggered on the stall line before this region"}
      sweep: [0.5, 4.0]
      assumption_id: A-W1.3a-2
    mil_e_5008b_a:
      value: 0.075
      units: "1"
      description: MIL-E-5008B supersonic ram-recovery coefficient (1 - a (M - 1)^b)
      evidence: {tag: "TRANSFER: MIL-E-5008B standard inlet recovery", source: "MIL-E-5008B; standard supersonic inlet recovery used in engine decks"}
    mil_e_5008b_b:
      value: 1.35
      units: "1"
      description: MIL-E-5008B supersonic ram-recovery exponent
      evidence: {tag: "TRANSFER: MIL-E-5008B standard inlet recovery", source: "MIL-E-5008B"}
  dynamics:
    v21:
      value: 1.0
      units: m**3
      description: Fan-exit + bypass-duct volume (F100 V13 1.427 m3 scaled by airflow 70/98.4)
      evidence: {tag: ASSUMPTION, source: "NASA TP-1034 Tbl I volumes (note Q6) scaled by design corrected airflow (F100 98.4 kg/s, TP-1069)"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.3a-5
    v3:
      value: 0.067
      units: m**3
      description: HPC-exit + combustor volume (F100 V3 + V4 = 0.0936 m3 scaled)
      evidence: {tag: ASSUMPTION, source: "NASA TP-1034 Tbl I (note Q6), scaled by airflow"}
      sweep: [0.033, 0.134]
      assumption_id: A-W1.3a-5
    v45:
      value: 0.3
      units: m**3
      description: HPT-LPT inter-turbine volume (F100 V4.1 0.656 m3 scaled by airflow and reduced for the F404's single-stage turbines)
      evidence: {tag: ASSUMPTION, source: "NASA TP-1034 Tbl I (note Q6); F404 single-stage HPT/LPT (ARL 1985)"}
      sweep: [0.1, 0.6]
      assumption_id: A-W1.3a-5
    v5:
      value: 0.15
      units: m**3
      description: LPT-exit duct volume up to the mixer chutes (core stream)
      evidence: {tag: ASSUMPTION, source: "not public; F404 compact LPT-exit/mixer section (ARL 1985 cross-section)"}
      sweep: [0.05, 0.4]
      assumption_id: A-W1.3a-5
    v6:
      value: 1.1
      units: m**3
      description: Mixer + afterburner + nozzle volume (F100 V6 + V7 = 1.56 m3 scaled)
      evidence: {tag: ASSUMPTION, source: "NASA TP-1034 Tbl I (note Q6), scaled by airflow"}
      sweep: [0.55, 2.2]
      assumption_id: A-W1.3a-5
    i_lp:
      value: 3.5
      units: kg*m**2
      description: LP spool polar moment of inertia (fan + LPT)
      evidence: {tag: ASSUMPTION, source: "note Q6/Q12 row 47 (F100 6.10 kg m2 scaled by mass flow^1.5); architecture §6 M07 'I_LP about 3.5, tuned'"}
      sweep: [2.0, 5.0]
      assumption_id: A-W1.3a-7
    i_hp:
      value: 3.0
      units: kg*m**2
      description: HP spool polar moment of inertia (HPC + HPT + gearbox)
      evidence: {tag: ASSUMPTION, source: "note Q6/Q12 row 47 (F100 5.65 kg m2 scaled); architecture §6 M07 'I_HP about 3, tuned'"}
      sweep: [2.0, 4.5]
      assumption_id: A-W1.3a-7
    tau_comb:
      value: 0.01
      units: s
      description: Combustor gas energy-storage time constant on T41 (residence-time order)
      evidence: {tag: ASSUMPTION, source: "combustor residence time of order milliseconds; breaks the NGV-flow/T41 algebraic loop"}
      sweep: [0.003, 0.03]
      assumption_id: A-W1.3a-6
  actuators:
    tau_fmv:
      value: 0.05
      units: s
      description: Fuel metering valve servo time constant
      evidence: {tag: "TRANSFER: generic NASA C-MAPSS", source: "NASA TM-2007-215026 (FMV 20 rad/s); note Q12 row 39"}
    fuel_transport_delay:
      value: 0.04
      units: s
      description: Fuel transport delay metering valve to nozzles (rounded to whole 240 Hz ticks)
      evidence: {tag: "TRANSFER: generic NASA C-MAPSS40k", source: "NASA TM-2010-216810 p.6 (40 ms); note Q12 row 39"}
    tau_a8:
      value: 0.1
      units: s
      description: Nozzle (VEN) actuator time constant (small-signal)
      evidence: {tag: ASSUMPTION, source: "not public; consistent with CF-18 'nozzle fully closed about 1 s after a slam' with the rate limit"}
      sweep: [0.05, 0.3]
      assumption_id: A-W1.3a-11
    a8_rate_ratio:
      value: 0.8
      units: 1/s
      description: Nozzle area slew-rate limit as a fraction of the design MIL A8 per second (-400 about 180 in2/s at MIL A8 about 220 in2)
      evidence: {tag: "TRANSFER: F404-400", source: "Henry, AGARD-CP-448 paper 37 (VEN fully closed about 1 s after a slam); TM-4240 (flight idle 400 in2 -> MIL about 220 in2); note Q6"}
    a8_min_ratio:
      value: 0.95
      units: "1"
      description: Minimum nozzle throat area relative to the design MIL A8 (-400 MIL A8 sits at the 220 in2 bottom of its range)
      evidence: {tag: ASSUMPTION, source: "derived from -400 values: NASA TP-3001 Tbl 2 (A8 220-540 in2) and TM-4240 MIL about 218-221 in2 (note Q4); the IN20 ratio is not public"}
      sweep: [0.85, 1.0]
      assumption_id: A-W1.3a-11
    a8_max_ratio:
      value: 2.45
      units: "1"
      description: Maximum nozzle throat area relative to the design MIL A8 (-400 540/220 in2)
      evidence: {tag: "TRANSFER: F404-400", source: "NASA TP-3001 Tbl 2 (A8 220-540 in2), note Q3/Q4"}
    tau_vg:
      value: 0.05
      units: s
      description: Variable-geometry (FVG, CVG) actuator time constant
      evidence: {tag: ASSUMPTION, source: "not public; FVG loop needs the highest bandwidth (CR-1998-208416 §7.5)"}
      sweep: [0.02, 0.2]
      assumption_id: A-W1.3a-11
    vg_rate:
      value: 40.0
      units: deg/s
      description: Variable-geometry slew-rate limit (FVG about 80 % stroke/s on a 2.7 in, about 50 deg stroke)
      evidence: {tag: "TRANSFER: F404-400", source: "NASA CR-1998-208416 §7.5-7.6 (FVG max slew 2.16 in/s); note Q12 row 32"}
    vg_min:
      value: -5.0
      units: deg
      description: Variable-geometry position limit, open end
      evidence: {tag: "TRANSFER: F404-400", source: "NASA TP-3001 Tbl 2 (CVG -5 to +55 deg)"}
    vg_max:
      value: 55.0
      units: deg
      description: Variable-geometry position limit, closed end
      evidence: {tag: "TRANSFER: F404-400", source: "NASA TP-3001 Tbl 2 (CVG -5 to +55 deg)"}
    tau_wfab:
      value: 0.1
      units: s
      description: Afterburner fuel actuator / manifold-fill time constant
      evidence: {tag: ASSUMPTION, source: "not public"}
      sweep: [0.05, 0.3]
      assumption_id: A-W1.3a-11
  geometry_effects:
    k_w_fvg:
      value: 0.6
      units: 1/rad
      description: Fan flow-capacity loss per rad of FVG closed beyond its reference schedule
      evidence: {tag: ASSUMPTION, source: "sign per Muir et al. AGARD-CP-448 paper 7 (fan VG off-schedule: W1 vs N1 down); magnitude not public"}
      sweep: [0.2, 1.2]
      assumption_id: A-W1.3a-12
    k_e_fvg:
      value: 0.65
      units: 1/rad**2
      description: Fan efficiency loss per rad^2 of FVG off-schedule
      evidence: {tag: ASSUMPTION, source: "not public (about -2 % at 10 deg)"}
      sweep: [0.2, 1.5]
      assumption_id: A-W1.3a-12
    k_w_cvg:
      value: 0.38
      units: 1/rad
      description: HPC flow-capacity change per rad of CVG off-schedule (6 deg opening gives about +8 % PS3/P1 at fixed N2 in M07)
      evidence: {tag: ASSUMPTION, source: "Muir et al. AGARD-CP-448 paper 7 Figs. 17-18 (NRC model: 6 deg CVG shift -> +8.1 % PS3/P1, +11.1 % Wfm vs N2 at fixed N2); value scaled so M07's 6 deg response matches the PS3/P1 anchor"}
      sweep: [0.15, 0.8]
      assumption_id: A-W1.3a-12
    k_e_cvg:
      value: 0.65
      units: 1/rad**2
      description: HPC efficiency loss per rad^2 of CVG off-schedule
      evidence: {tag: ASSUMPTION, source: "not public"}
      sweep: [0.2, 1.5]
      assumption_id: A-W1.3a-12
    vg_dev_sat:
      value: 15.0
      units: deg
      description: Saturation of the off-schedule VG angle in the map-shift model (smooth, +-15 deg)
      evidence: {tag: ASSUMPTION, source: "sensitivities anchored on 6 deg mis-rigs (Muir et al.); NAPC ran VG up to 10 deg off schedule (Glenny 1989); larger deviations unsupported"}
      sweep: [8.0, 30.0]
      assumption_id: A-W1.3a-12
    fvg_ref_n1c:
      value: [0.73, 0.80, 0.90, 0.95, 1.00, 1.05, 1.08]
      units: "1"
      description: Reference FVG schedule breakpoints, corrected fan speed (fraction of 100 % N1c) on which the fan map is defined
      evidence: {tag: "TRANSFER: F404-400", source: "NASA CR-198052 Fig. 31 digitised FVG schedule (note Q4)"}
    fvg_ref_angle:
      value: [50.0, 38.0, 18.25, 10.0, 0.5, 0.0, 6.25]
