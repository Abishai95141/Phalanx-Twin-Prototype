  AD.AOA_VANE_R.D: {class: vane_aoa, input: af.alpha, index: 0, element: VANE_AOA_R}
  AD.AOSS_VANE.A: {class: vane_aoss, input: af.beta, index: 0, element: VANE_AOSS}
  AD.AOSS_VANE.B: {class: vane_aoss, input: af.beta, index: 0, element: VANE_AOSS}
