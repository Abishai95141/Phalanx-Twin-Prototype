  ENG.T5.HARNESS_B: {class: tc_t5, input: eng.t5, index: 0, probes: 4}
  ENG.P5: {class: p5_transducer, input: eng.p5, index: 0}
  ENG.OIL_P: {class: oil_pressure, input: eng.oil_p, index: 0}
