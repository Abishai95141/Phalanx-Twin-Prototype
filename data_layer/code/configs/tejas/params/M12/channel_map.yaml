# M12 channel map (structure only; every number is in ../M12.yaml with provenance).
#
# classes: sensor class -> H_sensor source, D_sensor dynamics, the M12.yaml parameter set, and how the set's
#   parameters map onto the kernel (`map`: kernel parameter -> set parameter).
# channels: dictionary channel -> class, truth input signal (catalogue key in configs/interfaces/w1_ports.yaml)
#   and element index within that signal. Channels that share `element` read one physical element (a vane read
#   by four pick-offs). `probes: n` builds a harness of n probe elements whose open probes drop out of the
#   average. `axis` is the installed sensitive axis in body axes (x fwd, y right, z down); NZ reads -f_z.
#   `transform` derives gain/offset from set parameters (a8_fraction: percent stroke linear in area; arm: stroke
#   per radian). `index_note` flags an index map owned by another module (W2.1 binds it from that module).
#   A class with `trip` is a discrete: source `discrete` (1 when the truth state code reaches `level`), then its
#   dynamics, then the LRU's input comparator at `trip` (W2.2: the UV flame detector on eng.ab_state).
format: phalanx.sensors.channel_map/1
platform: tejas
classes:
  shaft_speed: {source: linear, dynamics: none}
  rtd_inlet: {source: linear, dynamics: lag1_flux, params: rtd_inlet, flow: eng.w2,
              map: {tau: tau, wref: w_ref, nexp: n_exp, wminf: w_min_frac, pattern: deice_bias}}
  tc_t5: {source: linear, dynamics: lag1_flux, params: tc_t5, flow: eng.w2,
          map: {tau: tau, wref: w_ref, nexp: n_exp, wminf: w_min_frac, pattern: pattern}}
  tc_t25: {source: linear, dynamics: lag1_flux, params: tc_t25, flow: eng.w2,
           map: {tau: tau, wref: w_ref, nexp: n_exp, wminf: w_min_frac}}
  ps3_transducer: {source: linear, dynamics: lag1, params: ps3_transducer, map: {tau: tau}}
  p5_transducer: {source: linear, dynamics: lag1, params: p5_transducer, map: {tau: tau}}
  oil_pressure: {source: linear, dynamics: lag1, params: oil_pressure, map: {tau: tau}}
  oil_temperature: {source: linear, dynamics: lag1, params: oil_temperature, map: {tau: tau}}
  fuel_flowmeter_main: {source: linear, dynamics: lag1, params: fuel_flowmeter_main, map: {tau: tau},
                        hold: update_interval}
  fuel_flowmeter_ab: {source: linear, dynamics: lag1, params: fuel_flowmeter_ab, map: {tau: tau}}
  lvdt: {source: linear, dynamics: none}
  reservoir_level: {source: linear, dynamics: none}
  fuel_inlet_rtd: {source: linear, dynamics: lag1, params: fuel_inlet_rtd, map: {tau: tau}}
  ecs_duct_rtd: {source: linear, dynamics: lag1, params: ecs_duct_rtd, map: {tau: tau}}
  ecs_compartment_rtd: {source: linear, dynamics: lag1, params: ecs_compartment_rtd, map: {tau: tau}}
  ecs_pressure: {source: linear, dynamics: lag1, params: ecs_pressure, map: {tau: tau}}
  uv_flame_detector: {source: discrete, dynamics: lag1, params: uv_flame_detector,
                      map: {tau: tau, level: flame_level}, trip: trip}
  a8_lvdt: {source: linear, dynamics: none, params: a8_lvdt, transform: a8_fraction}
  airbrake_rvdt: {source: linear, dynamics: none, params: airbrake_rvdt, transform: arm}
  static_pressure: {source: pstatic, dynamics: lag1_pneu, params: static_pressure, map: {tau: lambda_sl},
                    tables: {tab0: [pe_mach, pe_k]}}
  total_pressure: {source: ptotal, dynamics: lag1_pneu, params: total_pressure, map: {tau: lambda_sl}}
  vane_aoa: {source: vane, dynamics: lag2_eas, params: vane_aoa,
             map: {kf: kf, zeta: zeta, ku: ku, kbend: kbend, easmin: eas_min}, tables: {tab0: [bias_mach, bias]}}
  vane_aoss: {source: vane, dynamics: lag2_eas, params: vane_aoss,
              map: {kf: kf, zeta: zeta, ku: ku, easmin: eas_min}, tables: {tab0: [bias_mach, bias]}, no_bending: true}
  tat_probe: {source: tat, dynamics: lag1_flux, params: tat_probe, flux: rho_tas, heater_input: util.probe_heat,
              map: {tau: tau, wref: flux_ref, nexp: n_exp, wminf: w_min_frac},
              tables: {tab0: [rec_mach, recovery], tab1: [dhe_z, dhe]}}
  boom_vane_alpha: {source: vane, dynamics: lag2_eas, params: boom_vane_alpha,
                    map: {kf: kf, zeta: zeta, ku: ku, kbend: kbend, easmin: eas_min}, tables: {tab0: [bias_mach, bias]}}
  boom_vane_beta: {source: vane, dynamics: lag2_eas, params: boom_vane_beta,
                   map: {kf: kf, zeta: zeta, ku: ku, easmin: eas_min}, tables: {tab0: [bias_mach, bias]}, no_bending: true}
  boom_static: {source: pstatic, dynamics: lag1_pneu, params: boom_static, map: {tau: lambda_sl},
                tables: {tab0: [pe_mach, pe_k]}}
  boom_total: {source: ptotal, dynamics: lag1_pneu, params: boom_total, map: {tau: lambda_sl}}
  rate_gyro: {source: axis3, dynamics: lag2, params: rate_gyro, map: {wn: wn, zeta: zeta}}
  accelerometer: {source: axis3, dynamics: lag2, params: accelerometer, map: {wn: wn, zeta: zeta}}
  hyd_pressure: {source: linear, dynamics: lag1, params: hyd_pressure, map: {tau: tau}}
  hyd_temperature: {source: linear, dynamics: lag1, params: hyd_temperature, map: {tau: tau}}
  wheel_speed: {source: linear, dynamics: none}
  bus_voltage: {source: linear, dynamics: none}
  fuel_gauge: {source: fuel_gauge, dynamics: lag1, params: fuel_gauge,
               map: {tau: tau, att: att, unwet: unwet, dead: dead}}
