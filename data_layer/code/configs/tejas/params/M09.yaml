# M09 Utility systems: model parameters (format phalanx.params/1; loader phalanx.dictionary.params).
# Sources: R = reports/Virtual fighter telemetry layer research.md; N = research_notes/Virtual fighter telemetry
# layer research/tejas_utility_systems.md (KQ = key question, Syn = synthesis); donor PDFs are the released
# copies under research_sources/tejas_utility/donors/ (never the restricted folder). Restricted values (R App. A1:
# F-16 JFS timings, F-16 tyre/brake-energy limits, F/A-18 AMAD/fuel-hot limits) are NOT used anywhere here.
# Every ASSUMPTION has a sweep and an assumption_id registered in docs/assumptions.md (W1.4 section).
format: phalanx.params/1
module: M09
sets:
  constants:
    isa_t0:
      value: 288.15
      units: K
      description: ISA sea-level temperature (cabin altitude from cabin pressure)
      evidence: {tag: "TRANSFER: ISO 2533 ISA", source: "ISO 2533:1975 Standard Atmosphere"}
    isa_lapse:
      value: 0.0065
      units: K/m
      description: ISA tropospheric temperature lapse rate
      evidence: {tag: "TRANSFER: ISO 2533 ISA", source: "ISO 2533:1975 Standard Atmosphere"}
    isa_p0:
      value: 101325
      units: Pa
      description: ISA sea-level pressure
      evidence: {tag: "TRANSFER: ISO 2533 ISA", source: "ISO 2533:1975 Standard Atmosphere"}
    g0:
      value: 9.80665
      units: m/s**2
      description: Standard acceleration of gravity
      evidence: {tag: "TRANSFER: SI standard (ISO 80000-3)", source: "CGPM 1901 standard gravity; ISO 80000-3"}
    r_air:
      value: 287.05287
      units: J/kg/K
      description: Specific gas constant of dry air
      evidence: {tag: "TRANSFER: ISO 2533 ISA", source: "ISO 2533:1975 Standard Atmosphere (USSA-1976 identical below 32 km)"}
    gamma_air:
      value: 1.4
      units: "1"
      description: Ratio of specific heats of dry air
      evidence: {tag: "TRANSFER: ISO 2533 ISA", source: "ISO 2533:1975 Standard Atmosphere"}
    cp_air:
      value: 1004.685
      units: J/kg/K
      description: Specific heat of dry air at constant pressure (gamma R / (gamma - 1))
      evidence: {tag: "TRANSFER: ISO 2533 ISA", source: "derived from ISO 2533 gamma and R"}

  amagb:
    pto_ratio:
      value: 1.0
      units: "1"
      description: PTO/AMAGB input speed per unit N2 (PTO rated 16,810 rpm = F404 100 % N2)
      evidence: {tag: ASSUMPTION, source: "N KQ1 (PTO rated 16,810 rpm, DDP 8779) and engine note 100 % N2 = 16,810 rpm; ratio not public"}
      sweep: [0.95, 1.05]
      assumption_id: A-W1.4-1
    pto_rated_speed:
      value: 16810
      units: rpm
      description: AMAGB/PTO rated input speed (= dictionary channel_reference.amagb_rated_speed)
      evidence: {tag: DIRECT, source: "DDP AMAGB (LCA) https://www.ddpmod.gov.in/node/8779; N KQ1"}
    pto_torque_normal:
      value: 118
      units: N*m
      description: PTO shaft normal operating torque at 16,810 rpm (calibration ceiling of the accessory load, ~208 kW)
      evidence: {tag: DIRECT, source: "DRDO 'Power Take Off shaft of LCA Tejas' (search-index excerpt), N KQ1"}
    pto_torque_peak:
      value: 410
      units: N*m
      description: PTO shaft peak starting torque (torque limit of the JFS start drive)
      evidence: {tag: DIRECT, source: "DRDO 'Power Take Off shaft of LCA Tejas' (search-index excerpt), N KQ1"}
    gb_loss_rated:
      value: 2.0
      units: kW
      description: AMAGB gear/bearing/churning loss at rated speed (scales with speed squared)
      evidence: {tag: ASSUMPTION, source: "N KQ1 Inferences (gear and bearing losses in the AMAGB torque sum); not public"}
      sweep: [0.5, 5.0]
      assumption_id: A-W1.4-1
    gb_heat_cap:
      value: 12000
      units: J/K
      description: AMAGB oil plus housing heat capacity
      evidence: {tag: ASSUMPTION, source: "N Syn (d) AMAGB 1-2-state lumped oil thermal model; oil quantity not public"}
      sweep: [4000, 40000]
      assumption_id: A-W1.4-1
    gb_ua:
      value: 40
      units: W/K
      description: AMAGB heat rejection conductance to the bay
      evidence: {tag: ASSUMPTION, source: "N Syn (d); not public"}
      sweep: [10, 150]
      assumption_id: A-W1.4-1
    gb_eff:
      value: 0.98
      units: "1"
      description: Starter-pad to PTO transmission efficiency
      evidence: {tag: ASSUMPTION, source: "N KQ1 Inferences; not public"}
      sweep: [0.95, 0.995]
      assumption_id: A-W1.4-1
    hyd_pump_engine:
      value: [0, 0]
      units: "1"
      description: Engine index driving each hydraulic pump (both pumps are AMAGB pads of the single engine)
      evidence: {tag: DIRECT, source: "ADA GS page (AMAGB drives 2 hydraulic pumps, 1 generator, 1 starter); N KQ1"}
    gen_engine:
      value: 0
      units: "1"
      description: Engine index driving the main generator and the 5 kW DC backup generator
      evidence: {tag: DIRECT, source: "ADA GS page (generator on the AMAGB); N KQ1, KQ4"}
    jfs_engine:
      value: 0
      units: "1"
      description: Engine index started by the JFS through the AMAGB starter pad
      evidence: {tag: DIRECT, source: "ADA GS page; DDP GTSU-110 https://www.ddpmod.gov.in/node/8778"}
    amagb_life:
      value: 750
      units: hour
      description: AMAGB per-unit life (usage counter limit; consumed by M10/M18)
      evidence: {tag: DIRECT, source: "DRDO 'AMAGB for LCA' (search-index excerpt), N KQ1"}
    n2_100pct:
      value: 16810
      units: rpm
      description: Core speed at 100 % N2 (= dictionary channel_reference.n2_100pct)
      evidence: {tag: "TRANSFER: F404-400", source: "parameter_inventory.csv ENG.N2; R §1; dictionary constants channel_reference"}

  hydraulics:
    hyd_p_nom:
      value: 280
      units: bar
      description: Nominal system pressure (compensator cut-off, gauge) of each of the two systems
      evidence: {tag: DIRECT, source: "Kala (ADE) JOAST 67(2A) 2015 https://joast.org/index.php/joast/article/view/317; N KQ2"}
    hyd_p_ret:
      value: 5.5
      units: bar
      description: Return/reservoir LP-side pressure (gauge)
      evidence: {tag: DIRECT-part, source: "DDP bootstrap reservoir 280/5.5 bar https://www.ddpmod.gov.in/node/9659; N KQ2"}
    hyd_dp_band:
      value: 14
      units: bar
      description: Compensator droop from zero to full stroke (about 5 % of nominal)
      evidence: {tag: ASSUMPTION, source: "TRANSFER HAL 207 bar VD pump full-flow 197-207 bar (DDP 9658) scaled to 280 bar; MIL-H-5440H §3.6.3.4"}
      sweep: [5, 25]
      assumption_id: A-W1.4-2
    hyd_tau_swash:
      value: 0.02
      units: s
      description: Swash-plate (compensator) response time constant
      evidence: {tag: ASSUMPTION, source: "R §3 coupling map: N2 x demand -> pressure, time scale 10-100 ms"}
      sweep: [0.005, 0.05]
      assumption_id: A-W1.4-2
    hyd_dp_starve:
      value: 10
      units: bar
      description: Pressure margin over return below which consumer flow is starved (flow collapses linearly to zero)
      evidence: {tag: ASSUMPTION, source: "N KQ2 inference (actuator flow Q = A x_dot needs pressure); M05 owns the sqrt(dP) law"}
      sweep: [2, 30]
      assumption_id: A-W1.4-2
    hyd_q_rated:
      value: 110
      units: L/min
      description: Pump maximum geometric flow at rated pad speed (100 % N2)
      evidence: {tag: ASSUMPTION, source: "R App. A2 '110 L/min' lead (search excerpt, unverified); N KQ2 Inferences: consistent with the 208 kW PTO budget"}
      sweep: [60, 130]
      assumption_id: A-W1.4-3
    hyd_eta_v:
      value: 0.95
      units: "1"
      description: Pump volumetric efficiency at rated pressure, speed and reference temperature (sets case-drain leakage)
      evidence: {tag: ASSUMPTION, source: "TRANSFER civil EDP practice (Bischof et al. PHME 2022; Gomes et al. PHM 2012), N KQ10"}
      sweep: [0.90, 0.98]
      assumption_id: A-W1.4-4
    hyd_eta_hm:
      value: 0.90
      units: "1"
      description: Pump hydro-mechanical efficiency (shaft power = Q_geo dP / eta_hm)
      evidence: {tag: ASSUMPTION, source: "N KQ1 Inferences (pump torque dP D / (2 pi eta_m)); not public"}
      sweep: [0.85, 0.95]
      assumption_id: A-W1.4-4
    hyd_q_leak_int:
      value: 3.0
      units: L/min
      description: System internal leakage at nominal pressure and reference temperature (servo-valve nulls, seals)
      evidence: {tag: ASSUMPTION, source: "N KQ2/KQ10 (leakage conductances); not public; F-16 AIB 31 ml/min single-leak case (fault scale)"}
      sweep: [1.0, 8.0]
      assumption_id: A-W1.4-4
    hyd_visc_b:
      value: 2000
      units: K
      description: Andrade viscosity-temperature constant of the MIL-H-5606-class fluid (mu ~ exp(B/T))
      evidence: {tag: ASSUMPTION, source: "R §3 (hydraulic temperature -> leakage, viscosity); no MIL-H-5606 viscosity table in the evidence base"}
      sweep: [1500, 3500]
      assumption_id: A-W1.4-5
    hyd_t_ref:
      value: 313.15
      units: K
      description: Reference temperature of the rated leakage and filter values (also the JFS oil viscosity reference)
      evidence: {tag: ASSUMPTION, source: "modelling reference (40 degC); not public"}
      sweep: [293.15, 333.15]
      assumption_id: A-W1.4-5
    hyd_beta:
      value: 1.0e+9
      units: Pa
      description: Effective bulk modulus of fluid plus hose compliance
      evidence: {tag: ASSUMPTION, source: "N Syn (d) (pressure node with bulk modulus); not public"}
      sweep: [7.0e+8, 1.6e+9]
      assumption_id: A-W1.4-6
    hyd_v_line:
      value: 4.0
      units: L
      description: Pressurised fluid volume of one system (lines, actuator high-pressure sides)
      evidence: {tag: ASSUMPTION, source: "TRANSFER F-16 system capacities about 5-7 gal total (AIB 88-0477, N KQ2); pressurised share assumed"}
      sweep: [2.0, 8.0]
      assumption_id: A-W1.4-6
    hyd_res_v:
      value: 9.5
      units: L
      description: Bootstrap reservoir total volume (level 0-100 % of this)
      evidence: {tag: DIRECT-part, source: "DDP bootstrap reservoir LH/RH 9.5 L https://www.ddpmod.gov.in/node/9659 (Tejas fitment probable)"}
    hyd_res_fill0:
      value: 0.6
      units: "1"
      description: Reservoir fill fraction at servicing (depressurised, reference temperature)
      evidence: {tag: ASSUMPTION, source: "N Syn (b) reservoir level 0-9.5 L; servicing level not public"}
      sweep: [0.4, 0.8]
      assumption_id: A-W1.4-6
    hyd_v_total:
      value: 15
      units: L
      description: Total fluid volume of one system (thermal expansion and heat capacity)
      evidence: {tag: ASSUMPTION, source: "TRANSFER F-16 system capacities 5-7 gal (19-26 L) (N KQ2), scaled to a lighter fighter"}
      sweep: [10, 25]
      assumption_id: A-W1.4-6
    hyd_rho:
      value: 850
      units: kg/m**3
      description: Fluid density (MIL-H-5606 class)
      evidence: {tag: ASSUMPTION, source: "MIL-H-5606 fluid named on the HAL reservoir (DDP 9659); property value not in the evidence base"}
      sweep: [830, 870]
      assumption_id: A-W1.4-5
    hyd_cp:
      value: 1900
      units: J/kg/K
      description: Fluid specific heat
      evidence: {tag: ASSUMPTION, source: "MIL-H-5606 class; not in the evidence base"}
      sweep: [1700, 2100]
      assumption_id: A-W1.4-5
    hyd_alpha_v:
      value: 8.0e-4
      units: 1/K
      description: Fluid volumetric thermal expansion coefficient (reservoir level vs temperature)
      evidence: {tag: ASSUMPTION, source: "N KQ2 Inferences (reservoir level depends on temperature); value not in the evidence base"}
      sweep: [6.0e-4, 1.0e-3]
      assumption_id: A-W1.4-5
    hyd_acc_v:
      value: 1.0
      units: L
      description: Accumulator total (gas + fluid) volume per system
      evidence: {tag: ASSUMPTION, source: "N KQ2 gaps (accumulator count and precharges not public); DDP 9656 brake accumulator 0.41 L as scale"}
      sweep: [0.3, 2.0]
      assumption_id: A-W1.4-7
    hyd_acc_pre:
      value: 130
      units: bar
      description: Accumulator N2 precharge (gauge), nominal
      evidence: {tag: ASSUMPTION, source: "TRANSFER UCI hydraulic rig precharge levels 130/115/100/90 bar (faults note); Tejas value not public"}
      sweep: [80, 180]
      assumption_id: A-W1.4-7
    hyd_acc_t_charge:
      value: 288.15
      units: K
      description: Gas temperature at which the accumulator precharge is set (servicing)
      evidence: {tag: ASSUMPTION, source: "R §3 cold-soak edge (accumulator precharge follows the gas law); servicing temperature not public"}
      sweep: [273.15, 308.15]
      assumption_id: A-W1.4-7
    hyd_acc_n:
      value: 1.4
      units: "1"
      description: Accumulator gas polytropic exponent (adiabatic for 10-100 ms transients)
      evidence: {tag: ASSUMPTION, source: "gas-law modelling choice (R §3 cold-soak edge: gas law); isothermal 1.0 is the other bound"}
      sweep: [1.0, 1.4]
      assumption_id: A-W1.4-7
    hyd_relief_crack:
      value: 1.10
      units: "1"
      description: System relief valve cracking pressure, fraction of nominal
      evidence: {tag: ASSUMPTION, source: "MIL-H-5440H §3.11.21 (relief valve required; Table II settings not machine-readable)"}
      sweep: [1.05, 1.20]
      assumption_id: A-W1.4-8
    hyd_relief_full:
      value: 1.20
      units: "1"
      description: Relief valve full-flow pressure, fraction of nominal (passes rated pump flow)
      evidence: {tag: ASSUMPTION, source: "MIL-H-5440H §3.11.21.1 (capacity >= rated pump flow); Table II not machine-readable"}
      sweep: [1.10, 1.35]
      assumption_id: A-W1.4-8
    hyd_filter_dp:
      value: 1.0
      units: bar
      description: Clean pressure-filter dP at rated flow and reference temperature
      evidence: {tag: ASSUMPTION, source: "TRANSFER case-drain filter dP 6-12 psi clean (US 12,265,000, R §9.2 utility wear); MIL-H-5440H §3.11.9"}
      sweep: [0.3, 2.0]
      assumption_id: A-W1.4-9
    hyd_filter_exp:
      value: 3.0
      units: "1"
      description: Exponential growth of filter dP with loading fraction (dP x exp(k L))
      evidence: {tag: ASSUMPTION, source: "TRANSFER filter dP increases exponentially with captured contaminant (US 6,855,249; N KQ10)"}
      sweep: [1.0, 5.0]
      assumption_id: A-W1.4-9
    hyd_c_metal:
      value: 15000
      units: J/K
      description: Heat capacity of pumps, lines and actuators in thermal contact with the fluid
      evidence: {tag: ASSUMPTION, source: "N Syn (d) 1-state thermal per system; not public"}
      sweep: [5000, 40000]
      assumption_id: A-W1.4-10
    hyd_ua_amb:
      value: 30
      units: W/K
      description: Fluid heat loss conductance to the bay/airframe
      evidence: {tag: ASSUMPTION, source: "N Syn (d); not public"}
      sweep: [10, 100]
      assumption_id: A-W1.4-10
    hyd_hx_ua:
      value: 300
      units: W/K
      description: Fuel-cooled hydraulic heat-exchanger conductance (UA)
      evidence: {tag: ASSUMPTION, source: "TRANSFER F-15D fuel-oil heat exchanger routing (AIB 84-0046, N KQ2); Tejas HX type and location not public"}
      sweep: [100, 1000]
      assumption_id: A-W1.4-10
    hyd_q_hx:
      value: 5.0
      units: L/min
      description: Fluid circulation through the heat exchanger (return and case-drain flow at low demand)
      evidence: {tag: ASSUMPTION, source: "MIL-H-5440H (variable-delivery pumps keep case cooling flow at zero output); value not public"}
      sweep: [2.0, 15.0]
      assumption_id: A-W1.4-10
    hyd_nsub:
      value: 8
      units: "1"
      description: Explicit-Euler sub-steps per 240 Hz tick for the stiff pressure/swash states (numerical)
      evidence: {tag: ASSUMPTION, source: "architecture §8 (stiff hydraulic states sub-step internally); Lantto ICAS 2006-039 step rules"}
      sweep: [4, 16]
      assumption_id: A-W1.4-11

  fuel:
    fuel_rho_15:
      value: 803
      units: kg/m**3
      description: Fuel density at 15 degC
      evidence: {tag: DIRECT, source: "derived: internal fuel 2,458 kg / 3,060 L (N KQ3, Wikipedia spec table, secondary)"}
    fuel_internal:
      value: 2458
      units: kg
      description: Internal fuel capacity (checks the tank table; full-internal default)
      evidence: {tag: DIRECT, source: "N KQ3 (Wikipedia HAL Tejas spec table, secondary); R §1 Fuel row"}
    fuel_internal_volume:
      value: 3060
      units: L
      description: Internal fuel volume (sum of the internal tank capacities)
      evidence: {tag: DIRECT, source: "N KQ3 (Wikipedia HAL Tejas spec table, secondary)"}
    fuel_alpha:
      value: 9.5e-4
      units: 1/K
      description: Fuel volumetric thermal expansion coefficient
      evidence: {tag: ASSUMPTION, source: "Jet A-1/ATF class; not in the evidence base"}
      sweep: [8.0e-4, 1.1e-3]
      assumption_id: A-W1.4-12
    fuel_cp:
      value: 2000
      units: J/kg/K
      description: Fuel specific heat
      evidence: {tag: ASSUMPTION, source: "Jet A-1/ATF class; not in the evidence base"}
      sweep: [1800, 2200]
      assumption_id: A-W1.4-12
    fuel_c_struct:
      value: 1.0e+5
      units: J/K
      description: Tank structure heat capacity in contact with the fuel (keeps the lumped node finite near empty)
      evidence: {tag: ASSUMPTION, source: "N Syn (d) per-tank lumped fuel temperature; not public"}
      sweep: [3.0e+4, 3.0e+5]
      assumption_id: A-W1.4-12
    fuel_ua_skin:
      value: 150
      units: W/K
      description: Tank skin heat-exchange conductance to the recovery temperature
      evidence: {tag: ASSUMPTION, source: "N KQ3 Inferences (fuel temperature vs hot-day soak, Jaisalmer 39-42 degC); not public"}
      sweep: [50, 500]
      assumption_id: A-W1.4-12
    fuel_q_xfer:
      value: 5.0
      units: kg/s
      description: Maximum transfer rate into the collector (transfer pumps plus ECS pressurisation)
      evidence: {tag: ASSUMPTION, source: "N KQ3 gaps (boost/transfer pump specs not public); above max-AB burn ~4.4 kg/s (engine note)"}
      sweep: [3.0, 8.0]
      assumption_id: A-W1.4-13
    fuel_tau_xfer:
      value: 2.0
      units: s
      description: Collector level-control time constant of the ECFM auto-transfer
      evidence: {tag: ASSUMPTION, source: "ADA AR 2015-16 'Fuel auto transfer functionality' (logic not public)"}
      sweep: [0.5, 5.0]
      assumption_id: A-W1.4-13
    fuel_fill_target:
      value: 0.98
      units: "1"
      description: Collector (F2) fill fraction held by auto-transfer
      evidence: {tag: ASSUMPTION, source: "ADA AR 2015-16 auto transfer; MIL-F-17874B 5 % expansion space"}
      sweep: [0.95, 1.0]
      assumption_id: A-W1.4-13
    fuel_tau_ic:
      value: 5.0
      units: s
      description: F1-F2 interconnect fill-equalisation time constant (F1/F2 feed group)
      evidence: {tag: ASSUMPTION, source: "ADA AR 2018-19 'drop in F1/F2 tank contents' (F1/F2 reported together); plumbing not public"}
      sweep: [1.0, 20.0]
      assumption_id: A-W1.4-13
    fuel_residual:
      value: 0.005
      units: "1"
      description: Unusable fraction below which a source tank counts as empty for transfer sequencing
      evidence: {tag: ASSUMPTION, source: "transfer logic not public"}
      sweep: [0.001, 0.02]
      assumption_id: A-W1.4-13
    fuel_pickup_band:
      value: 0.02
      units: m
      description: Fuel depth over a pick-up at which it delivers full flow (linear to zero when uncovered)
      evidence: {tag: ASSUMPTION, source: "N KQ3 Inferences (pick-up uncovering at high pitch); geometry not public"}
      sweep: [0.005, 0.05]
      assumption_id: A-W1.4-14
    fuel_f1a_pickup_mod:
      value: 0.10
      units: "1"
      description: F1A pick-up station after the pick-up/vent modification (fraction of tank length from the aft wall)
      evidence: {tag: ASSUMPTION, source: "ADA AR 2018-19 ('optimization of fuel pick up and vent mod in F1A tank'); position not public"}
      sweep: [0.05, 0.3]
      assumption_id: A-W1.4-14
    slosh_omega:
      value: 4.0
      units: rad/s
      description: First sloshing-mode natural frequency of the lumped free surface
      evidence: {tag: ASSUMPTION, source: "rectangular-tank first mode about 0.5-0.8 Hz for 1-1.3 m tanks; N KQ3 (slosh); geometry not public"}
      proxy: true
      sweep: [2.0, 8.0]
      assumption_id: A-W1.4-15
    slosh_zeta:
      value: 0.15
      units: "1"
      description: Sloshing-mode damping ratio (baffled tanks)
      evidence: {tag: ASSUMPTION, source: "not public"}
      proxy: true
      sweep: [0.05, 0.4]
      assumption_id: A-W1.4-15
    slosh_g_min:
      value: 0.2
      units: "1"
      description: Minimum effective normal specific force (fraction of g) in the slope computation (near-zero-g guard)
      evidence: {tag: ASSUMPTION, source: "modelling guard; fuel orientation undefined near zero g"}
      sweep: [0.1, 0.5]
      assumption_id: A-W1.4-15
    slosh_s_max:
      value: 3.0
      units: "1"
      description: Maximum free-surface slope (about 72 deg)
      evidence: {tag: ASSUMPTION, source: "modelling guard"}
      sweep: [1.0, 5.0]
      assumption_id: A-W1.4-15

  fuel_tanks:
    tank_cap:
      table: {file: tanks.csv, column: cap_l}
      units: L
      description: Tank capacity (F1, F1A, F2, wing L, wing R, drop tank centreline, inboard L, inboard R)
      evidence: {tag: ASSUMPTION, source: "drop tanks 1,200/1,200/800 L DIRECT (N KQ3); internal split of 3,060 L not public (fuselage tanks hold m_ref - m_oe = 1,658 kg; feed group F1 + F2 sized so the zoom-climb anchor is reproduced)"}
      sweep: [400, 1200]
      assumption_id: A-W1.4-14
    tank_length:
      table: {file: tanks.csv, column: length_m}
      units: m
      description: Tank length along body x (rectangular-box geometry)
      evidence: {tag: ASSUMPTION, source: "geometry not public (N KQ3 gaps)"}
      sweep: [1.0, 4.0]
      assumption_id: A-W1.4-14
    tank_height:
      table: {file: tanks.csv, column: height_m}
      units: m
      description: Tank height
      evidence: {tag: ASSUMPTION, source: "geometry not public (N KQ3 gaps)"}
      sweep: [0.2, 0.8]
      assumption_id: A-W1.4-14
    tank_x:
      table: {file: tanks.csv, column: x_m}
      units: m
      description: Tank centroid x from the datum (reference CG), forward positive
      evidence: {tag: ASSUMPTION, source: "geometry not public (N KQ3 gaps); fuselage tanks F1 forward, F2 collector near the wing root"}
      sweep: [-1.0, 2.5]
      assumption_id: A-W1.4-17
    tank_y:
      table: {file: tanks.csv, column: y_m}
      units: m
      description: Tank centroid y, right positive
      evidence: {tag: ASSUMPTION, source: "geometry not public"}
      sweep: [-2.0, 2.0]
      assumption_id: A-W1.4-17
    tank_z:
      table: {file: tanks.csv, column: z_m}
