# M14 BIT / exceedance / caution code BEHAVIOUR (W2.1c; dictionary 0.1.2, AD-48 item 5). The codes themselves -
# identity and meaning: desc, severity, fault list, mechanism, source LRU, lane, src, CWS legend and voice channel,
# monitor channel / limit / sense / gate, groups - are the dictionary's single SYNTHETIC table
# `code_tables.bit_codes` (AD-19), read with `Dictionary.bit_codes()` / `bit_code(c)`. A code's index is its
# dictionary index. Every dictionary code has exactly one row here and every row is a dictionary code (checked on
# load). FADEC-reported codes are dictionary codes (M08 re-keyed, W2.1b); `MonitoringConfig(fadec_codes="M08")`
# reads a not-yet-re-keyed M08 through the dictionary's legacy map instead.
#
# Per code (M14 behaviour, SYNTHETIC / ASSUMPTION as A-W1.5-36): tech (LRU technology for CND/NFF propensity),
#   displayed (reaches the cockpit; default true), suspects ([lru, isolation confidence]), regime (bit | ehm: the
#   threshold regime of an internal test), sympathetic ([code, p, delay lo, hi] s), monitor (cir codes: persist_s,
#   clear_s).
format: phalanx.m14_codes/2
cnd_by_tech: {rf: 0.295, digital: 0.445, analog: 0.63, electromech: 0.30, sensor: 0.40}
