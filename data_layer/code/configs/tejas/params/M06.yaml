# M06 Airframe 6-DOF and Tejas-anchored aero database (W1.2). Format phalanx.params/1 (src/phalanx/dictionary/params.py).
# Evidence notes: "notes" = research_notes/Virtual fighter telemetry layer research/; report = reports/Virtual fighter
# telemetry layer research.md. Digitised Tejas curves are DIRECT; fits and derived values are ASSUMPTION (swept; see
# docs/assumptions.md, W1.2 section). For table and vector entries the sweep is a multiplicative factor on the whole
# table ([1.0, 1.0] = breakpoints or geometry not swept). Restricted-manual values (report Appendix A1) are not used anywhere in this file.
format: phalanx.params/1
module: M06
sets:
  geometry:
    s_ref:
      value: 38.4
      units: m**2
      description: Wing reference area (aero coefficient reference)
      evidence: {tag: DIRECT, source: "report §1 Airframe row; notes tejas_airframe_aero_fcs.md Q1 (ADA/Wikipedia 38.4 m2; NFTC AeSI FTG 2005 38.5 m2, immaterial conflict)"}
    b_ref:
      value: 8.20
      units: m
      description: Wing span (lateral coefficient reference)
      evidence: {tag: DIRECT, source: "ADA Tejas brochure 2013 p.2; MoD DDP LCA Tejas; notes tejas_airframe_aero_fcs.md Q1 #1"}
    c_ref:
      value: 5.5
      units: m
      description: Mean aerodynamic chord (pitch coefficient reference); not published
      evidence: {tag: ASSUMPTION, source: "notes tejas_airframe_aero_fcs.md Q1/Q4 #7: cranked-planform integration and NAL dimensional/non-dimensional derivative consistency give 5.4-5.7 m"}
      sweep: [5.2, 5.9]
      assumption_id: A-W1.2-1
    cg_ref_mac:
      value: 0.34
      units: "1"
      description: "Reference point of all aero moments and of util.cg: the reference CG at 34 % MAC (fraction of MAC)"
      evidence: {tag: DIRECT-unnamed, source: "DSJ 71(2) 2021 §3.5 (ADA IFCS: CG 34.0 % MAC at ~9 t); NFTC AeSI FTG 2005 §5 (33.5 % MAC); notes tejas_airframe_aero_fcs.md Q1 #8"}
  earth:
    earth_a:
      value: 6378137.0
      units: m
      description: WGS-84 semi-major axis
      evidence: {tag: "TRANSFER: WGS-84 (NIMA TR8350.2)", source: "NIMA TR8350.2 3rd ed. Table 3.1; standard Earth model, platform independent"}
    earth_f:
      value: 0.0033528106647474805
      units: "1"
      description: WGS-84 flattening (1/298.257223563)
      evidence: {tag: "TRANSFER: WGS-84 (NIMA TR8350.2)", source: "NIMA TR8350.2 Table 3.1"}
    earth_omega:
      value: 7.292115e-5
      units: rad/s
      description: WGS-84 Earth rotation rate
      evidence: {tag: "TRANSFER: WGS-84 (NIMA TR8350.2)", source: "NIMA TR8350.2 Table 3.1"}
    earth_gm:
      value: 3.986004418e+14
      units: m**3/s**2
      description: WGS-84 gravitational constant GM (atmosphere included)
      evidence: {tag: "TRANSFER: WGS-84 (NIMA TR8350.2)", source: "NIMA TR8350.2 Table 3.1"}
    earth_j2:
      value: 1.08262668e-3
      units: "1"
      description: Second zonal harmonic J2 (= -sqrt(5) C20, EGM96 normalised C20)
      evidence: {tag: "TRANSFER: WGS-84 (NIMA TR8350.2)", source: "NIMA TR8350.2 Table 3.3 / EGM96; same gravity model as the NESC check cases (NASA/TM-2015-218675)"}
    g0:
      value: 9.80665
      units: m/s**2
      description: Standard gravity (load-factor normalisation af.nz)
      evidence: {tag: "TRANSFER: ISO 80000-3 standard gravity", source: "BIPM SI Brochure / ISO 80000-3 (gn exact); also dictionary channels in standard_gravity"}
  aero:
    cl0:
      value: -0.015
      units: "1"
      description: Lift at zero alpha (Polhamus-form fit to the Tejas WT lift curve)
      evidence: {tag: ASSUMPTION, source: "fit of the digitised Tejas WT CL(alpha) (AeSI FTG 2005 Fig-3; notes tejas_airframe_aero_fcs.md Q4 inferences: CL0 -0.015, -15..30 deg fit)"}
      sweep: [-0.035, 0.005]
      assumption_id: A-W1.2-3
    kp:
      value: 2.25
      units: "1"
      description: Potential-lift constant Kp (per rad) of the Polhamus form, at M 0.2
      evidence: {tag: ASSUMPTION, source: "notes tejas_airframe_aero_fcs.md Q4 inferences (-15..30 deg fit Kp 2.25; -15..20 fit 2.15); Polhamus NASA TN D-3767 Fig. 6 (Kp 2.2-2.3 at A 1.75)"}
      sweep: [2.05, 2.45]
      assumption_id: A-W1.2-3
    kv:
      value: 1.54
      units: "1"
      description: Effective vortex-lift constant Kv,eff of the Polhamus form (about 50 % of sharp-edge theory)
      evidence: {tag: ASSUMPTION, source: "notes tejas_airframe_aero_fcs.md Q4 inferences (-15..30 deg fit Kv,eff 1.54; sharp-edge theory 3.2 at A 1.75, TN D-3767 Fig. 9)"}
      sweep: [1.2, 1.9]
      assumption_id: A-W1.2-3
    cn_max_flat:
      value: 1.6
      units: "1"
      description: Flat-plate normal-force coefficient used above the vortex-breakdown band (post-stall shape; FCS prevents entry)
      evidence: {tag: ASSUMPTION, source: "no Tejas data above 30 deg (WT CLmax still rising to ~35 deg, AeSI FTG 2005 §7); flat-plate CN of slender deltas 1.2-2.0 (Polhamus TN D-3767 discussion)"}
      sweep: [1.2, 2.0]
      assumption_id: A-W1.2-3
    alpha_flat_lo:
      value: 33.0
      units: deg
      description: Start of the blend from the Polhamus form to the flat plate (vortex breakdown onset)
      evidence: {tag: ASSUMPTION, source: "WT CLmax near 35 deg (AeSI FTG 2005 §7); notes tejas_airframe_aero_fcs.md Q8 step 2"}
      sweep: [30.0, 38.0]
      assumption_id: A-W1.2-3
    alpha_flat_hi:
      value: 45.0
      units: deg
      description: End of the blend to the flat-plate normal force
      evidence: {tag: ASSUMPTION, source: "post-stall shape assumption; spin modes at alpha 57-85 deg are not to be entered (AeSI FTG 2005 §11)"}
      sweep: [40.0, 55.0]
      assumption_id: A-W1.2-3
    cm0:
      value: 0.0
      units: "1"
      description: Pitching moment at zero alpha about the 34 % MAC reference (HAL Cm(alpha) baseline is ~0 to -0.003 for -4..11 deg)
      evidence: {tag: ASSUMPTION, source: "AeSI FTG 2004 §18 (HAL ARDC Cm vs alpha, digitised in notes tejas_airframe_aero_fcs.md Q4); reference CG of that plot not stated"}
      sweep: [-0.01, 0.01]
      assumption_id: A-W1.2-5
    k_dcm0_dsm:
      value: -0.32
      units: "1"
      description: "Zero-lift pitching-moment change per unit forward neutral-point shift: dCm0(M) = k * max(dSM(M), 0) (the subsonic shift rotates the moment curve so the 8 km cruise trims need little elevon)"
      evidence: {tag: ASSUMPTION, source: "fitted to the ELS trim point M0.6/8 km alpha 6.59 deg (DSJ 49(3) 1999), whose trimmed CL matches the low-speed WT lift curve, i.e. near-zero elevon lift (notes tejas_airframe_aero_fcs.md Q4 inferences); AD-08 'core fitted to ... trim points'"}
      sweep: [-0.5, -0.1]
      assumption_id: A-W1.2-5
    cl_q:
      value: 4.0
      units: "1"
      description: Lift due to pitch rate CL_q (per qhat = q c/2V), derived from the NAL M0.22 short-period model
      evidence: {tag: ASSUMPTION, source: "derived from DSJ 57(4) 2007 eq. (2) alpha-dot q-coefficient 0.9724 with m 9,060 kg, V 74.6 m/s, qbar 3,313 Pa, c 5.5 m (this WP; method as notes tejas_airframe_aero_fcs.md Q4 inferences)"}
      sweep: [1.0, 5.0]
      assumption_id: A-W1.2-6
    cl_de:
      value: 1.15
      units: 1/rad
      description: Total symmetric-elevon lift power at low alpha (scaled by elev_eff(alpha); 0.98/rad at alpha ~17 deg)
      evidence: {tag: ASSUMPTION, source: "DSJ 57(4) 2007 Z_de -0.1842 -> CL_de 0.98/rad at M0.22 trim (notes tejas_airframe_aero_fcs.md Q4 inferences), divided by elev_eff(16.7 deg) 0.848"}
      sweep: [0.85, 1.35]
      assumption_id: A-W1.2-6
    frac_pitch_ib:
      value: 0.55
      units: "1"
      description: Share of symmetric pitch/lift power carried by the inboard elevon pair (outboard = 1 - share)
      evidence: {tag: ASSUMPTION, source: "not public (HAL tables are per elevon, AeSI FTG 2004 §16); VSPAERO would supply it (notes tejas_airframe_aero_fcs.md Q8 step 2)"}
      sweep: [0.4, 0.7]
      assumption_id: A-W1.2-6
    cl_da_ib:
      value: 0.045
      units: 1/rad
      description: Rolling moment per rad of one inboard elevon (left positive, right negative), strip-theory estimate
      evidence: {tag: ASSUMPTION, source: "strip theory: per-elevon lift 0.25 x CL_de at a spanwise centroid ~1.5 m over b 8.2 m (this WP); Tejas Cl_da not public (notes tejas_airframe_aero_fcs.md Q4 gaps)"}
      sweep: [0.02, 0.07]
      assumption_id: A-W1.2-7
    cl_da_ob:
      value: 0.090
      units: 1/rad
      description: Rolling moment per rad of one outboard elevon (left positive), strip-theory estimate (centroid ~3.0 m)
      evidence: {tag: ASSUMPTION, source: "strip theory as cl_da_ib (this WP); ADMIRE/GAM or VSPAERO to replace (notes tejas_airframe_aero_fcs.md Q8 step 4)"}
      sweep: [0.04, 0.13]
      assumption_id: A-W1.2-7
    cy_beta:
      value: -0.8
      units: 1/rad
      description: Side force due to sideslip (body axes)
      evidence: {tag: ASSUMPTION, source: "not public; typical single-fin delta fighters -0.6..-1.0/rad (ADMIRE/F-106B class, notes tejas_airframe_aero_fcs.md Q8 step 4); value chosen mid-range"}
      sweep: [-1.2, -0.5]
      assumption_id: A-W1.2-7
    cl_dr:
      value: 0.016
      units: 1/rad
      description: Rolling moment due to rudder (fin centre of pressure above the roll axis)
      evidence: {tag: ASSUMPTION, source: "derived from Tejas Cn_dr with an assumed fin arm l_v ~5 m and height z_v ~1.2 m: Cl_dr ~ -Cn_dr z_v/l_v (this WP)"}
      sweep: [0.0, 0.04]
      assumption_id: A-W1.2-7
    cy_dr:
      value: 0.11
      units: 1/rad
      description: Side force due to rudder
      evidence: {tag: ASSUMPTION, source: "derived from Tejas Cn_dr with l_v ~5 m: CY_dr ~ -Cn_dr b/l_v (this WP)"}
      sweep: [0.05, 0.2]
      assumption_id: A-W1.2-7
    cn_dr:
      value: -0.0012
      units: 1/deg
      description: Yawing moment due to rudder, nearly constant from alpha -15 to +30 deg (rudder TE-left positive)
      evidence: {tag: DIRECT, source: "AeSI FTG 2005 Fig-6 (LCA SGE 26D, M 0.5), digitised in notes tejas_airframe_aero_fcs.md Q4 (-0.0012/deg, -0.0013 at 30 deg)"}
    k_cl_r:
      value: 0.25
      units: "1"
      description: Roll due to yaw rate as Cl_r = k CL (wing strip-theory estimate)
      evidence: {tag: ASSUMPTION, source: "classical estimate Cl_r ~ CL/4 (Etkin & Reid); Tejas value not public"}
      sweep: [0.1, 0.4]
      assumption_id: A-W1.2-7
    k_cn_p:
      value: -0.125
      units: "1"
      description: Yaw due to roll rate as Cn_p = k CL (wing estimate)
      evidence: {tag: ASSUMPTION, source: "classical estimate Cn_p ~ -CL/8 (Etkin & Reid); Tejas value not public"}
      sweep: [-0.25, 0.0]
      assumption_id: A-W1.2-7
    k_friction:
      value: 7.0
      units: "1"
      description: Friction-equivalent factor (wetted area x form factor / S_ref) multiplying the flat-plate Cf; sets CD0 ~0.016 subsonic
      evidence: {tag: ASSUMPTION, source: "calibrated so CD0 = 0.016 at M0.6/5 km (notes tejas_airframe_aero_fcs.md Q8 step 5, #32); V9 calibration in W2.3"}
      sweep: [5.0, 9.0]
      assumption_id: A-W1.2-8
    cd_de2:
      value: 0.10
      units: 1/rad**2
      description: Profile drag of deflected control surfaces, per rad squared per surface
      evidence: {tag: ASSUMPTION, source: "not public; DATCOM/Delta-method build-up practice (notes tejas_airframe_aero_fcs.md Q8 step 5)"}
      sweep: [0.0, 0.3]
      assumption_id: A-W1.2-8
    alpha_suction_lo:
      value: 12.0
      units: deg
      description: Alpha where the induced drag starts blending from K CL^2 to zero suction (CL tan alpha)
      evidence: {tag: ASSUMPTION, source: "notes tejas_airframe_aero_fcs.md Q8 step 5 (switch to zero suction at high alpha)"}
      sweep: [8.0, 16.0]
      assumption_id: A-W1.2-8
    alpha_suction_hi:
      value: 25.0
      units: deg
      description: Alpha where zero leading-edge suction is reached
      evidence: {tag: ASSUMPTION, source: "as alpha_suction_lo"}
      sweep: [20.0, 30.0]
      assumption_id: A-W1.2-8
    dcd_gear:
      value: 0.020
      units: "1"
      description: Drag increment of the extended undercarriage
      evidence: {tag: ASSUMPTION, source: "HAL data set has gear increments (AeSI FTG 2004 §12-20), values not public; fighter practice 0.015-0.03"}
      sweep: [0.01, 0.035]
      assumption_id: A-W1.2-8
    dcm_gear:
      value: 0.0
      units: "1"
      description: Pitching-moment increment of the extended undercarriage
      evidence: {tag: ASSUMPTION, source: "HAL data set has undercarriage increments (AeSI FTG 2004 §18), values not public"}
      sweep: [-0.01, 0.01]
      assumption_id: A-W1.2-8
    dcd_airbrake:
      value: 0.06
      units: "1"
      description: Drag increment of both airbrakes fully open
      evidence: {tag: ASSUMPTION, source: "HAL data set has airbrake increments (AeSI FTG 2004), values not public; fighter airbrakes 0.03-0.09"}
      sweep: [0.03, 0.09]
      assumption_id: A-W1.2-8
    dcm_airbrake:
      value: 0.0
      units: "1"
      description: Pitching-moment increment of both airbrakes fully open
      evidence: {tag: ASSUMPTION, source: "airbrakes beside the fin on the upper rear fuselage (notes tejas_airframe_aero_fcs.md Q2); value not public"}
      sweep: [-0.01, 0.01]
      assumption_id: A-W1.2-8
    cn_airbrake_asym:
      value: -0.005
      units: "1"
      description: Yawing moment per unit asymmetric airbrake opening (left open more -> nose left)
      evidence: {tag: ASSUMPTION, source: "geometry sign only (airbrakes either side of the fin); magnitude not public"}
      sweep: [-0.015, 0.0]
      assumption_id: A-W1.2-8
    cl_slat_asym:
      value: 0.01
      units: "1"
      description: Rolling moment per unit asymmetric slat deployment (left more -> roll right)
      evidence: {tag: ASSUMPTION, source: "sign from geometry; magnitude bounded by the +/-0.03 total slat lift effect (AeSI FTG 2005 §7)"}
      sweep: [0.0, 0.03]
      assumption_id: A-W1.2-8
    slat_max_ob:
      value: 30.0
      units: deg
      description: Outboard slat full deflection (normalises the slat increments; equals the M05 position limit)
      evidence: {tag: DIRECT, source: "Alpha Defense 2026 (secondary), 30 deg corroborated by AeSI FTG 2005 Fig-4 'Slat30 deg' (notes tejas_airframe_aero_fcs.md Q2 #39)"}
    slat_max_mb:
      value: 27.5
      units: deg
      description: Mid-board slat full deflection
      evidence: {tag: DIRECT, source: "Alpha Defense 2026 (secondary source; notes tejas_airframe_aero_fcs.md Q2 #39)"}
    slat_max_ib:
      value: 17.5
      units: deg
      description: Inboard slat full deflection
      evidence: {tag: DIRECT, source: "Alpha Defense 2026 (secondary source; notes tejas_airframe_aero_fcs.md Q2 #39)"}
    airbrake_max:
      value: 50.0
      units: deg
      description: Airbrake full-open angle (normalises the airbrake increments; equals the M05 position limit)
      evidence: {tag: ASSUMPTION, source: "not public; airbrake LVDT stroke 294 mm is DIRECT-part (dictionary FCS.AIRBRAKE.POS) but the crank geometry is not"}
      sweep: [30.0, 60.0]
      assumption_id: A-W1.2-9
    datcom_kappa:
      value: 0.95
      units: "1"
      description: Section lift-slope ratio kappa = cl_alpha/2pi in the DATCOM subsonic lift-slope formula
      evidence: {tag: "TRANSFER: USAF DATCOM method", source: "DATCOM §4.1.3.2 lift-curve slope formula (AFFDL-TR-79-3032; notes tejas_airframe_aero_fcs.md Q8 (c)); kappa 0.95 standard for thin sections"}
    sweep_half_chord:
      value: 34.0
      units: deg
      description: Effective mid-chord sweep of the cranked delta (LE 50/62.5 deg, TE -4 deg) for the DATCOM formula
      evidence: {tag: ASSUMPTION, source: "derived from LE sweeps 50/62.5 deg and TE -4 deg (AeSI FTG 2005 §5): atan((tan 55 + tan(-4))/2) ~ 34 deg (this WP)"}
      sweep: [28.0, 40.0]
      assumption_id: A-W1.2-4
    supersonic_cot_lambda:
      value: 0.4375
      units: "1"
      description: Cotangent of the effective delta leading-edge sweep for supersonic linear theory (A/4 of an equivalent delta of the same aspect ratio)
      evidence: {tag: ASSUMPTION, source: "equivalent pure delta with A = b^2/S = 1.75 (cot = A/4); supersonic thin-wing theory for subsonic leading edges, CL_alpha = 2 pi cot(Lambda)/E(k) (this WP)"}
      sweep: [0.35, 0.7]
      assumption_id: A-W1.2-4
    mach_fair_lo:
      value: 0.95
      units: "1"
      description: Transonic fairing start (DATCOM subsonic lift slope used below)
      evidence: {tag: "TRANSFER: USAF DATCOM method", source: "DATCOM: 'transonic methods do not exist ... fairing between subsonic and supersonic data' (notes tejas_airframe_aero_fcs.md Q8 (c))"}
    mach_fair_hi:
      value: 1.05
      units: "1"
      description: Transonic fairing end (supersonic linear theory used above)
      evidence: {tag: "TRANSFER: USAF DATCOM method", source: "as mach_fair_lo"}
  aero_tables:
    wt_cl_alpha:
      table: {file: tejas_wt_cl.csv, column: alpha_deg}
      units: deg
      description: Digitised Tejas WT lift curve, alpha breakpoints (V1 target; fit source of cl0/kp/kv)
      evidence: {tag: DIRECT, source: "AeSI FTG 2005 Fig-3 (NFTC 'High AoA testing of the Tejas LCA'), digitised by eye in notes tejas_airframe_aero_fcs.md Q4 (+/-0.01)"}
    wt_cl:
      table: {file: tejas_wt_cl.csv, column: cl}
      units: "1"
      description: Digitised Tejas WT lift coefficient (low speed, Mach not stated, probably ~0.2)
      evidence: {tag: DIRECT, source: "AeSI FTG 2005 Fig-3, digitised (notes tejas_airframe_aero_fcs.md Q4)"}
    cn_beta_alpha:
      table: {file: tejas_cn_beta.csv, column: alpha_deg}
      units: deg
      description: Alpha breakpoints of Cn_beta (rows with digitised=0 are linear interpolations between digitised anchors)
      evidence: {tag: DIRECT, source: "AeSI FTG 2005 Fig-4 (M0.21, slat 30 deg, fuel 1,900), digitised in notes tejas_airframe_aero_fcs.md Q4"}
    cn_beta:
      table: {file: tejas_cn_beta.csv, column: cn_beta}
      units: 1/rad
      description: Directional stability Cn_beta(alpha) with the cliff near 25 deg; held beyond the table ends
      evidence: {tag: DIRECT, source: "AeSI FTG 2005 Fig-4 digitised (+0.04..0.06 to 15 deg, ~0 at 23-25 deg, -0.03/-0.08/-0.135 at 26/27/28 deg)"}
    cl_beta_alpha:
      table: {file: tejas_cl_beta.csv, column: alpha_deg}
      units: deg
      description: Alpha breakpoints of Cl_beta (digitised=0 rows interpolated or extrapolated)
      evidence: {tag: DIRECT, source: "AeSI FTG 2005 Fig-5 (beta = +10 deg, full slats), digitised in notes tejas_airframe_aero_fcs.md Q4"}
    cl_beta:
      table: {file: tejas_cl_beta.csv, column: cl_beta}
      units: 1/rad
      description: Dihedral effect Cl_beta(alpha) = rolling moment at beta 10 deg / sin 10 deg; reversal above ~27 deg
      evidence: {tag: DIRECT, source: "AeSI FTG 2005 Fig-5 digitised (-0.005..-0.015 at 0-10 deg, -0.03 at 23 deg, reversing above ~27 deg)"}
    cm_ls_alpha:
      table: {file: cm_ls.csv, column: alpha_deg}
      units: deg
      description: Alpha breakpoints of the low-speed pitch tables
      evidence: {tag: ASSUMPTION, source: "breakpoints at the NAL anchor angles (JOAST 56(3) 4.3/11.9 deg; DSJ 57(4) trim ~16.7 deg)"}
      sweep: [1.0, 1.0]
      assumption_id: A-W1.2-5
    cm_alpha_ls:
      table: {file: cm_ls.csv, column: cm_alpha}
      units: 1/rad
      description: Low-speed static stability Cm_alpha(alpha) about 34 % MAC; integrated to Cm_ls(alpha)
      evidence: {tag: ASSUMPTION, source: "through NAL anchors -0.014 (4.3 deg), +0.077 (11.9 deg) [JOAST 56(3) Tables 2-3], +0.053 (15.2 deg) [calibrated to the DSJ 57(4) short-period roots at its auto-slat trim with the slat increments active; the paper-alone derivation gives +0.049 about ~16.7 deg]; nose-down break above 20 deg shaped on HAL AEDC/Calspan Cm (AeSI FTG 2004 §18)"}
      sweep: [0.5, 1.5]
      assumption_id: A-W1.2-5
    cm_de_ls:
      table: {file: cm_ls.csv, column: cm_de}
      units: 1/rad
      description: Total symmetric elevon pitch power Cm_de(alpha) at low speed
      evidence: {tag: ASSUMPTION, source: "JOAST 56(3): -0.4151 (4.3 deg), -0.3905 (11.9 deg); DSJ 57(4) derived -0.356 (~16.7 deg); high-alpha decline assumed"}
      sweep: [0.85, 1.15]
      assumption_id: A-W1.2-6
    cm_q_ls:
      table: {file: cm_ls.csv, column: cm_q}
      units: "1"
      description: Pitch damping Cm_q + Cm_alpha-dot (per qhat) vs alpha at low speed
      evidence: {tag: ASSUMPTION, source: "JOAST 56(3): -1.3195 (4.3 deg), -1.1733 (11.9 deg); DSJ 57(4) derived -1.10 (~16.7 deg); notes tejas_airframe_aero_fcs.md #20 (-1.0..-1.3)"}
      sweep: [0.75, 1.25]
      assumption_id: A-W1.2-6
    elev_eff:
      table: {file: cm_ls.csv, column: elev_eff}
      units: "1"
      description: Elevon lift/roll effectiveness factor vs alpha (cm_de shape normalised to 1 at alpha 0)
      evidence: {tag: ASSUMPTION, source: "shape of cm_de_ls (this WP)"}
      sweep: [0.8, 1.2]
      assumption_id: A-W1.2-6
    lat_alpha:
      table: {file: lat_alpha.csv, column: alpha_deg}
      units: deg
      description: Alpha breakpoints of the lateral damping table
      evidence: {tag: ASSUMPTION, source: "this WP"}
      sweep: [1.0, 1.0]
      assumption_id: A-W1.2-7
    cl_p:
      table: {file: lat_alpha.csv, column: cl_p}
      units: "1"
      description: Roll damping Cl_p(alpha) per phat; slender-wing value -pi A/32 = -0.17 plus fin, falling at high alpha
      evidence: {tag: ASSUMPTION, source: "slender-wing theory (Cl_p = -pi A/32, A 1.75); ADMIRE/F-106B to replace (notes tejas_airframe_aero_fcs.md Q8 step 4, #29)"}
      sweep: [0.6, 1.5]
      assumption_id: A-W1.2-7
    cn_r:
