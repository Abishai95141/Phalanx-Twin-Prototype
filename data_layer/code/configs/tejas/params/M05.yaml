# M05 FCS (quadruplex DFCC replica) and the 13 actuators (W1.2). Format phalanx.params/1.
# Evidence notes: "notes" = research_notes/Virtual fighter telemetry layer research/. Published Tejas facts are DIRECT
# (Kala JOAST 67(2A) 2015; Patel et al. JOAST 58(4) 2006; DSJ 71(2) 2021; AeSI FTG 2005); gain tables, voting
# thresholds and actuator internals are not public and are ASSUMPTION (swept; docs/assumptions.md W1.2 section).
# For table and vector entries the sweep is a multiplicative factor on the whole table/vector ([1.0, 1.0] = not swept).
# The hinge-moment model used by the actuators is the M06 aero database (M06.yaml set "hinge").
format: phalanx.params/1
module: M05
sets:
  dfcc:
    frame_rate:
      value: 80
      units: Hz
      description: DFCC minor frame rate (12.5 ms frame; exact rate group, divisor 3 of 240 Hz)
      evidence: {tag: DIRECT, source: "Kala JOAST 67(2A) 2015 ('75% of 12.5 msec'); AeSI FTG 2005 §6 ('updated every 12.5 milli secs'); notes tejas_airframe_aero_fcs.md Q3 #42"}
    compute_delay:
      value: 0.008
      units: s
      description: Onboard computation delay from sampling to actuator command (applied at the first truth frame after it -> 8.33 ms)
      evidence: {tag: DIRECT, source: "Patel, Deodhare & Chetty JOAST 58(4) 2006 p.279 ('computation delay of 8 ms modeled as a transportation lag'); report §0"}
    n_sub_act:
      value: 2
      units: "1"
      description: RK4 sub-steps per 240 Hz tick for the actuators
      evidence: {tag: ASSUMPTION, source: "numerical configuration; servo poles ~57 rad/s give h|lambda| < 0.15 at 2 sub-steps (this WP)"}
      sweep: [1, 4]
      assumption_id: A-W1.2-20
    crit_subsystems:
      value: [0, 1, 3, 6, 7, 10]
      units: "1"
      description: "Indices (layout.SUBSYSTEMS) of the per-channel subsystems whose failure drops the channel: CPU, MEMORY, WATCHDOG, DA_CONVERTER, AD_CONVERTER, PSU"
      evidence: {tag: ASSUMPTION, source: "23 subsystems per channel (JOAST 57(4) 2005, DIRECT); which ones are channel-critical is not public (notes tejas_avionics_and_parameter_inventory.md Q3)"}
      sweep: [1.0, 1.0]
      assumption_id: A-W1.2-27
  laws:
    n_ref:
      value: 1.0
      units: standard_gravity
      description: Normal-acceleration normaliser of the blended pitch error
      evidence: {tag: ASSUMPTION, source: "C*-type blend normalisation (this WP); law structure q/Nz feedback DIRECT (JOAST 58(4))"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    q_ref:
      value: 0.05
      units: rad/s
      description: Pitch-rate normaliser of the blended pitch error (~g/V at 200 m/s, C* crossover-velocity sense)
      evidence: {tag: ASSUMPTION, source: "C* crossover velocity ~200 m/s (this WP)"}
      sweep: [0.03, 0.1]
      assumption_id: A-W1.2-22
    blend_m0:
      value: 0.90
      units: "1"
      description: Mach below which the pitch law integrates pitch-rate error (rate command)
      evidence: {tag: ASSUMPTION, source: "ADMIRE blends q to Nz at M0.58-0.62 (TRANSFER: ADMIRE, FOI-R--1624--SE); moved to M0.90-1.00 because the Nz-integral design cannot meet the margin template in the Tejas high-instability band M0.55-0.9 on this airframe model (design exploration, this WP)"}
      sweep: [0.58, 0.95]
      assumption_id: A-W1.2-22
    blend_m1:
      value: 1.00
      units: "1"
      description: Mach above which the pitch law integrates normal-acceleration error (Nz command)
      evidence: {tag: ASSUMPTION, source: "as blend_m0"}
      sweep: [0.62, 1.1]
      assumption_id: A-W1.2-22
    q_max:
      value: 20.0
      units: deg/s
      description: Pitch-rate command at full stick (rate-command region)
      evidence: {tag: ASSUMPTION, source: "fighter practice; Tejas stick gradients not public (notes tejas_airframe_aero_fcs.md Q3 gaps)"}
      sweep: [12.0, 30.0]
      assumption_id: A-W1.2-23
    nz_min:
      value: -3.5
      units: standard_gravity
      description: Negative load-factor limit
      evidence: {tag: DIRECT, source: "MoD DDP LCA Tejas (+8/-3.5 g); ADA AR 2019-20 (Navy +8g to -3.5g); dictionary constant nz_envelope_min"}
    tau_pf_pitch:
      value: 0.5
      units: s
      description: Command-path low-pass prefilter on pitch stick
      evidence: {tag: ASSUMPTION, source: "JOAST 58(4): 'a low-pass filter added in the command path to meet the handling quality requirements' (DIRECT existence); 0.5 s keeps the pitch-rate overshoot ratio below 1.5 on this design (step-response study, this WP)"}
      sweep: [0.05, 0.8]
      assumption_id: A-W1.2-23
    tau_pf_roll:
      value: 0.1
      units: s
      description: Command-path low-pass prefilter on roll stick
      evidence: {tag: ASSUMPTION, source: "as tau_pf_pitch"}
      sweep: [0.05, 0.3]
      assumption_id: A-W1.2-23
    alpha_min:
      value: -10.0
      units: deg
      description: Negative AoA limit of the carefree limiter (one-sided allowance on the predicted AoA, as the positive scheduled limit)
      evidence: {tag: ASSUMPTION, source: "the Tejas CLAW is carefree with AoA and g limiting (DIRECT: ADA IFCS; tejas.gov.in FBW); structure TRANSFER from the NAL carefree design on ADMIRE (DSJ 73(3) 2023: maximum positive and negative AoA via one-sided feedback loops); the negative value is not public: it keeps alpha inside the Tejas WT data range (-15..30 deg, AeSI FTG 2005) with margin and above the elevon-effectiveness decline of M06 (0.905 at -10 deg, 0.714 at -20 deg); validation: Tejas negative-AoA clearance if released"}
      sweep: [-15.0, -6.0]
      assumption_id: A-W2.1-13
    alpha_lead:
      value: 0.3
      units: s
      description: AoA-limiter anticipation - the allowance uses the predicted AoA alpha + lead x pitch rate
      evidence: {tag: ASSUMPTION, source: "carefree AoA protection engaging only when pilot inputs would exceed the limit (DSJ 73(3), ADMIRE stand-in); alpha-rate anticipation is limiter practice; Tejas algorithm not public"}
      sweep: [0.1, 0.8]
      assumption_id: A-W1.2-23
    de_max:
      value: 25.0
      units: deg
      description: Elevon command limit (symmetric plus differential)
      evidence: {tag: DIRECT, source: "elevon +/-25 deg (Alpha Defense 2026, secondary; AeSI FTG 2005 Fig-8 25 deg axes); notes tejas_airframe_aero_fcs.md #35"}
    da_max:
      value: 18.0
      units: deg
      description: Differential elevon ('aileron') command limit
      evidence: {tag: DIRECT-unnamed, source: "DSJ 71(2) 2021 §3.5 ('aileron ... +/-18 deg')"}
    da_rate:
      value: 45.0
      units: deg/s
      description: Differential elevon command rate limit
      evidence: {tag: DIRECT-unnamed, source: "DSJ 71(2) 2021 §3.5 ('+/-45 deg/sec')"}
    dr_max:
      value: 30.0
      units: deg
      description: Rudder command limit
      evidence: {tag: DIRECT-unnamed, source: "DSJ 71(2) 2021 §3.5 (+/-30 deg); AeSI FTG 2005 spin charts (30 deg)"}
    dr_rate:
      value: 100.0
      units: deg/s
      description: Rudder command rate limit
      evidence: {tag: DIRECT-unnamed, source: "DSJ 71(2) 2021 §3.5 ('+/-100 deg/sec')"}
    tau_washout:
      value: 1.0
      units: s
      description: Yaw-rate washout time constant
      evidence: {tag: ASSUMPTION, source: "lateral law feeds back stability-axis yaw rate (DSJ 71(2)); washout constant not public"}
      sweep: [0.5, 3.0]
      assumption_id: A-W1.2-22
    k_pedal:
      value: 0.5
      units: "1"
      description: Rudder deflection per unit pedal as a fraction of the rudder limit (direct pedal path)
      evidence: {tag: ASSUMPTION, source: "pedal shaping not public (this WP)"}
      sweep: [0.2, 1.0]
      assumption_id: A-W1.2-22
    slat_alpha0:
      value: 4.0
      units: deg
      description: Slat schedule start (slats begin to deploy above this AoA)
      evidence: {tag: ASSUMPTION, source: "slats 'automatically scheduled with AoA and IMN' (AeSI FTG 2005 §5, DIRECT); schedule not public"}
      sweep: [0.0, 8.0]
      assumption_id: A-W1.2-28
    slat_alpha1:
      value: 16.0
      units: deg
      description: AoA of full slat deployment
      evidence: {tag: ASSUMPTION, source: "as slat_alpha0"}
      sweep: [10.0, 22.0]
      assumption_id: A-W1.2-28
    slat_mach0:
      value: 0.80
      units: "1"
      description: Mach where the slat schedule starts to fade
      evidence: {tag: ASSUMPTION, source: "as slat_alpha0"}
      sweep: [0.7, 0.9]
      assumption_id: A-W1.2-28
    slat_mach1:
      value: 0.90
      units: "1"
      description: Mach above which slats are retracted
      evidence: {tag: ASSUMPTION, source: "as slat_alpha0"}
      sweep: [0.8, 1.0]
      assumption_id: A-W1.2-28
    slat_reversion:
      value: 1.0
      units: "1"
      description: Slat fraction held in the fixed-gain reversion (no air data)
      evidence: {tag: ASSUMPTION, source: "AeSI FTG 2005 §25: slats simplex in hydraulics, 'safer to set them in the safer extended position'"}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.2-28
    airbrake_open:
      value: 50.0
      units: deg
      description: Airbrake commanded open angle (open-loop jacks run to the stop)
      evidence: {tag: ASSUMPTION, source: "airbrakes are open-loop jacks operated from the cockpit (Kala 2015, DIRECT); angle = M06 airbrake_max (ASSUMPTION)"}
      sweep: [30.0, 60.0]
      assumption_id: A-W1.2-9
    k_gnd_pitch:
      value: 1.0
      units: "1"
      description: Ground law - elevon per unit pitch stick as a fraction of de_max (direct link)
      evidence: {tag: ASSUMPTION, source: "WoW-selected ground law (report §3 coupling map, TRANSFER: F-35 AIB); Tejas ground law not public"}
      sweep: [0.3, 1.0]
      assumption_id: A-W1.2-26
    k_gnd_q:
      value: 0.0
      units: s
      description: Ground law - elevon per unit pitch rate (rate damping kept on the ground)
      evidence: {tag: ASSUMPTION, source: "as k_gnd_pitch; zero = pure direct link (worst case of the false-WoW cascade)"}
      sweep: [0.0, 0.5]
      assumption_id: A-W1.2-26
    k_gnd_roll:
      value: 1.0
      units: "1"
      description: Ground law - differential elevon per unit roll stick as a fraction of da_max
      evidence: {tag: ASSUMPTION, source: "as k_gnd_pitch"}
      sweep: [0.3, 1.0]
      assumption_id: A-W1.2-26
    k_gnd_yaw:
      value: 1.0
      units: "1"
      description: Ground law - rudder per unit pedal as a fraction of dr_max
      evidence: {tag: ASSUMPTION, source: "as k_gnd_pitch"}
      sweep: [0.3, 1.0]
      assumption_id: A-W1.2-26
    p_max_fixed:
      value: 90.0
      units: deg/s
      description: Roll-rate command at full stick in the fixed-gain reversion
      evidence: {tag: ASSUMPTION, source: "reversion flown over a restricted envelope (JOAST 58(4)); value not public"}
      sweep: [45.0, 150.0]
      assumption_id: A-W1.2-26
    g_ny_fixed:
      value: -0.3
      units: rad
      description: Fixed-gain reversion - rudder per g of lateral acceleration (sideslip substitute without air data)
      evidence: {tag: ASSUMPTION, source: "fixed-gain mode uses inertial sensors only (JOAST 58(4), DIRECT); gain not public"}
      sweep: [-1.0, 0.0]
      assumption_id: A-W1.2-26
    nz_max_fixed:
      value: 6.0
      units: standard_gravity
      description: Load-factor limit used by the g limiter in the fixed-gain reversion
      evidence: {tag: ASSUMPTION, source: "restricted reversion envelope (JOAST 58(4)); IOC 6 g (JOAST 66(1))"}
      sweep: [4.0, 8.0]
      assumption_id: A-W1.2-26
  schedule:
    sched_mach:
      table: {file: schedule.csv, column: mach}
      units: "1"
      description: Mach breakpoints of the limiter, roll-rate and ARI schedules
      evidence: {tag: ASSUMPTION, source: "this WP (breakpoints at the published anchors)"}
      sweep: [1.0, 1.0]
      assumption_id: A-W1.2-23
    alpha_lim:
      table: {file: schedule.csv, column: alpha_lim_deg}
      units: deg
      description: AoA limit vs Mach (26 deg subsonic, ~4 deg at M1.55)
      evidence: {tag: ASSUMPTION, source: "26 deg subsonic and 1.55 M at 4 deg AoA cleared (ADA AR 2018-19, DIRECT anchors); shape between and beyond assumed (notes tejas_airframe_aero_fcs.md Q7 inferences)"}
      sweep: [0.9, 1.05]
      assumption_id: A-W1.2-23
    nz_max:
      table: {file: schedule.csv, column: nz_max_g}
      units: standard_gravity
      description: Positive load-factor limit vs Mach (+8 g subsonic operational, 6 g at M1.2)
      evidence: {tag: ASSUMPTION, source: "+8 g operational (MoD DDP), 6 g at M1.2 (ADA AR 2018-19) DIRECT anchors; transonic fairing assumed; DFCC v7307 allows 8.5 g subsonic"}
      sweep: [0.9, 1.07]
      assumption_id: A-W1.2-23
    p_max:
      table: {file: schedule.csv, column: p_max_dps}
      units: deg/s
      description: Stability-axis roll-rate command at full roll stick vs Mach
      evidence: {tag: ASSUMPTION, source: "ADMIRE baseline ~180 deg/s velocity-vector roll (DSJ 73(3), TRANSFER stand-in); Tejas value not public"}
      sweep: [0.6, 1.3]
      assumption_id: A-W1.2-23
    ari:
      table: {file: schedule.csv, column: ari}
      units: "1"
      description: "Aileron-to-rudder interconnect gain (rad rudder per rad differential elevon, Phalanx signs: -DSJ value) vs Mach; rows with ari_direct=1 carry the published values"
      evidence: {tag: ASSUMPTION, source: "DSJ 71(2) 2021 Table 2 (6 km): +3.47 at M0.26, -0.60 at M0.7, -0.319 at M1.3 (DIRECT-unnamed); sign mapping to the Phalanx convention, interpolation and altitude-independence assumed"}
      sweep: [0.67, 1.5]
      assumption_id: A-W1.2-22
    t_alpha_sched:
      table: {file: schedule.csv, column: t_alpha_s}
      units: s
      description: AoA-limiter time constant vs Mach - pitch-rate allowance = (alpha_lim - alpha - lead q) / t_alpha (slow at low speed where the elevons saturate, fast where the g limit governs)
      evidence: {tag: ASSUMPTION, source: "limiter structure and values set by the closed-loop limiter tests (this WP); Tejas algorithm not public"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-23
  gain_schedule:
    gs_mach:
      table: {file: gains.csv, column: mach}
      units: "1"
      description: Mach of each designed gain row (full Mach x altitude grid; generated by phalanx.fcs.design.main)
      evidence: {tag: ASSUMPTION, source: "Phalanx design on the M06 model (A-W1.2-22); gains scheduled on Mach and altitude (JOAST 58(4), DIRECT structure)"}
      sweep: [1.0, 1.0]
      assumption_id: A-W1.2-22
    gs_alt:
      table: {file: gains.csv, column: alt}
      units: m
      description: Pressure altitude of each designed gain row
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [1.0, 1.0]
      assumption_id: A-W1.2-22
    gs_g_n:
      table: {file: gains.csv, column: g_n}
      units: rad
      description: Pitch - elevon per g of (ASA nz - 1)
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    gs_g_q:
      table: {file: gains.csv, column: g_q}
      units: s
      description: Pitch - elevon per rad/s of pitch rate
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    gs_g_i:
      table: {file: gains.csv, column: g_i}
      units: rad/s
      description: Pitch - elevon per unit of the integrated normalised error
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    gs_g_ff:
      table: {file: gains.csv, column: g_ff}
      units: rad
      description: Pitch - elevon per unit normalised command (feed-forward)
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    gs_g_pr:
      table: {file: gains.csv, column: g_pr}
      units: s
      description: Roll - differential elevon per rad/s of roll-rate error
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    gs_g_ir:
      table: {file: gains.csv, column: g_ir}
      units: "1"
      description: Roll - differential elevon per rad of integrated roll-rate error
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    gs_g_b:
      table: {file: gains.csv, column: g_b}
      units: "1"
      description: Yaw - rudder per rad of sideslip
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    gs_g_r:
      table: {file: gains.csv, column: g_r}
      units: s
      description: Yaw - rudder per rad/s of washed-out stability-axis yaw rate
      evidence: {tag: ASSUMPTION, source: "as gs_mach"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-22
    fx_g_n:
      table: {file: fixed_gains.csv, column: g_n}
      units: rad
      description: Fixed-gain reversion sets (row 0 undercarriage up, row 1 down) - g_n
      evidence: {tag: ASSUMPTION, source: "Phalanx design at the fixed_* design points (A-W1.2-26); undercarriage-dependent fixed gains (JOAST 58(4), DIRECT)"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
    fx_g_q:
      table: {file: fixed_gains.csv, column: g_q}
      units: s
      description: Fixed-gain sets - g_q
      evidence: {tag: ASSUMPTION, source: "as fx_g_n"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
    fx_g_i:
      table: {file: fixed_gains.csv, column: g_i}
      units: rad/s
      description: Fixed-gain sets - g_i
      evidence: {tag: ASSUMPTION, source: "as fx_g_n"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
    fx_g_ff:
      table: {file: fixed_gains.csv, column: g_ff}
      units: rad
      description: Fixed-gain sets - g_ff
      evidence: {tag: ASSUMPTION, source: "as fx_g_n"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
    fx_g_pr:
      table: {file: fixed_gains.csv, column: g_pr}
      units: s
      description: Fixed-gain sets - g_pr
      evidence: {tag: ASSUMPTION, source: "as fx_g_n"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
    fx_g_ir:
      table: {file: fixed_gains.csv, column: g_ir}
      units: "1"
      description: Fixed-gain sets - g_ir
      evidence: {tag: ASSUMPTION, source: "as fx_g_n"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
    fx_g_b:
      table: {file: fixed_gains.csv, column: g_b}
      units: "1"
      description: Fixed-gain sets - g_b (unused in reversion, which has no air data)
      evidence: {tag: ASSUMPTION, source: "as fx_g_n"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
    fx_g_r:
      table: {file: fixed_gains.csv, column: g_r}
      units: s
      description: Fixed-gain sets - g_r
      evidence: {tag: ASSUMPTION, source: "as fx_g_n"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-26
  monitors:
    mon_thr_abs:
      table: {file: monitors.csv, column: thr_abs}
      units: "1"
      description: "Lane mistrack threshold (absolute part) per voted signal in the signal's SI unit (rad/s, m/s2, rad, Pa, fraction of travel, m; row order = ports.VOTED_SIGNALS)"
      evidence: {tag: ASSUMPTION, source: "mistrack thresholds and persistence not public (notes tejas_airframe_aero_fcs.md Q3 gaps); quad-FBW practice"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-24
    mon_thr_rel:
      table: {file: monitors.csv, column: thr_rel}
      units: "1"
      description: Lane mistrack threshold (relative part, fraction of the voted value)
      evidence: {tag: ASSUMPTION, source: "as mon_thr_abs"}
      sweep: [0.5, 2.0]
      assumption_id: A-W1.2-24
    mon_n:
      table: {file: monitors.csv, column: n_persist}
      units: "1"
      description: Consecutive 80 Hz frames of mistrack before a lane is failed (8 = 100 ms)
      evidence: {tag: ASSUMPTION, source: "as mon_thr_abs; F404 FADEC rate checks use 4 frames (report §9) - same order"}
      sweep: [0.5, 3.0]
      assumption_id: A-W1.2-24
    vane_mistrack:
      value: 5.0
      units: deg
      description: Left/right AoA vane disagreement threshold (after calibration)
      evidence: {tag: ASSUMPTION, source: "'+/-2 deg tolerance where AoA calibration is not accurate' (AeSI FTG 2005 §20) plus sideslip-induced L/R difference; threshold not public"}
      sweep: [3.0, 10.0]
      assumption_id: A-W1.2-24
    n_vane:
      value: 8
      units: "1"
      description: Frames of vane disagreement before both vanes are excluded
      evidence: {tag: ASSUMPTION, source: "as vane_mistrack"}
      sweep: [4, 40]
      assumption_id: A-W1.2-24
  modes:
    n_wow:
      value: 2
      units: "1"
      description: Frames of main-gear WoW before the ground law is selected
      evidence: {tag: ASSUMPTION, source: "WoW persistence not public; a false WoW selected the ground law in flight on an F-35A (report §3 coupling map, TRANSFER: F-35 AIB)"}
      sweep: [1, 40]
      assumption_id: A-W1.2-26
    wow_interlock:
      value: 0
      units: "1"
      description: 1 = refuse the ground law when the voted qbar exceeds wow_qbar_max (off by default, reproducing the AIB vulnerability)
      evidence: {tag: ASSUMPTION, source: "Tejas WoW logic not public; the AIB cascade requires no airspeed interlock"}
      sweep: [0, 1]
      assumption_id: A-W1.2-26
    wow_qbar_max:
      value: 6000.0
      units: Pa
      description: Dynamic pressure above which the optional interlock rejects WoW (~100 m/s at sea level)
      evidence: {tag: ASSUMPTION, source: "approach speeds 75-77 m/s (notes tejas_airframe_aero_fcs.md Q6 inferences)"}
      sweep: [3000.0, 12000.0]
      assumption_id: A-W1.2-26
  airdata:
    vane_k1:
      value: 1.5
      units: "1"
      description: AoA vane local-flow calibration slope (local = k1 alpha + c0); must equal the M12 vane upwash model's nominal slope (1 + ku, M12 vane_aoa.ku 0.5)
