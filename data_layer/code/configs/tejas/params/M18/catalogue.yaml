# M18 maintainable-item catalogue (W1.8). SYNTHETIC: part numbers, makers, serial formats and the position list are
# Phalanx constructs (AD-19, RULES.md rule 6). They are not the real Tejas illustrated parts catalogue.
#
# One entry per item class (a part-number class). `positions` are the installed positions on every tail.
# Numeric columns are declared once under `columns` with units and evidence; a class may override the evidence
# of one cell under `evidence` (e.g. a DIRECT life limit). ASSUMPTION columns carry a relative sweep (a multiplier
# range applied to every class) and an assumption_id registered in docs/assumptions.md (W1.8 section).
# Loader and rules: src/phalanx/maintenance/catalogue.py.
format: phalanx.m18.catalogue/1
synthetic_label: >-
  SYNTHETIC Phalanx item catalogue (AD-19): part numbers, makers and serials are synthetic; positions and
  classes are a v1 selection of maintenance-relevant LRUs, not the real Tejas IPC.
columns:
  ts_hours:
    units: h
    description: Median elapsed troubleshooting time (fault isolation) for a defect against this class.
    evidence: {tag: ASSUMPTION, source: "NAMP 4790.2E Fig 15-6 (IGB chip: 3.0 elapsed h incl. troubleshooting); research_notes maintenance_records_and_events.md chain 1 (troubleshooting 12:40-15:10, 2.5 h)"}
    sweep: [0.5, 2.0]
    assumption_id: A-W1.8-5
  rr_hours:
    units: h
    description: Median elapsed remove-and-replace time including ground run / operational check.
    evidence: {tag: ASSUMPTION, source: "NAMP 4790.2E Figs 15-8/15-41 (FADEC R/R; 13.5 elapsed h incl. waits); maintenance_records_and_events.md chain 1 (install 17:30-18:30)"}
    sweep: [0.5, 2.0]
    assumption_id: A-W1.8-5
  p_isolate:
    units: "1"
    description: Probability that troubleshooting isolates the truly faulty position when the fault is real (else a wrong suspect in the ambiguity group is replaced).
    evidence: {tag: ASSUMPTION, source: "report §9 (F110 EMS isolated ~70 % of real faults correctly at service entry; 90 % target); candidate_engine_and_ehm_data.md l.710"}
    sweep: [0.75, 1.15]
    assumption_id: A-W1.8-6
  p_ground_repro:
    units: "1"
    description: Probability that a real fault reproduces on the ground check (intermittents lower).
    evidence: {tag: ASSUMPTION, source: "report §9 (intermittents two-state Markov; NFF 30-60 % avionics, Khan et al.); TO 00-20-2 HMC 675/676"}
    sweep: [0.7, 1.15]
    assumption_id: A-W1.8-6
  p_bench_miss:
    units: "1"
    description: Probability that the bench test does not confirm a truly faulty unit (RTOK on a bad unit; rogue-unit mechanism).
    evidence: {tag: ASSUMPTION, source: "FAA AC 120-17B (rogue units: same S/N, repetitive removals); MIL-HDBK-338B (CND/RTOK)"}
    sweep: [0.0, 2.0]
    assumption_id: A-W1.8-7
  p_bcm:
    units: "1"
    description: Probability that a confirmed-faulty unit is beyond the capability of base (I-level) maintenance and goes to depot (BRD/HAL/OEM).
    evidence: {tag: ASSUMPTION, source: "CAG 17/2015 para 4.4 (of 344 LCA LRUs, 90 non-repairable, 69 without HAL ROH: D-level dependence) [DIRECT existence]; class values swept"}
    sweep: [0.5, 1.5]
    assumption_id: A-W1.8-7
  shop_days:
    units: day
    description: Median base-shop (I-level) turnaround for bench check and repair.
    evidence: {tag: ASSUMPTION, source: "NAMP §15.5 (I-level induction by turn-in document); no IAF value public"}
    sweep: [0.5, 3.0]
    assumption_id: A-W1.8-7
  depot_days:
    units: day
    description: Median depot (BRD/HAL/OEM) turnaround.
    evidence: {tag: "TRANSFER: F-35 military depots", source: "GAO-23-105341 pp.11-13 (average 72 days; goal 60-90); CAG 38/2015 para 2.1.3.2 (LRUs sent to OEM: longer turnaround)"}
  stock_per_ac:
    units: "1"
    description: Initial serviceable spares at the base per aircraft held (rounded up, minimum 0).
    evidence: {tag: ASSUMPTION, source: "Scale of Rotables not public (CAG 38/2015 para 2.1.3.4 names it); engine overridden by DIRECT CAG 17/2015"}
    sweep: [0.0, 3.0]
    assumption_id: A-W1.8-8
  life_fh:
    units: h
    description: Hard-time flight-hour life (0 = no FH limit).
    evidence: {tag: ASSUMPTION, source: "IAF maintains on hours flown and calendar life (41st Report 16th LS para 3.20) [DIRECT practice]; values per class swept unless overridden"}
    sweep: [0.6, 2.0]
    assumption_id: A-W1.8-9
  life_landings:
    units: "1"
    description: Life in landings (0 = none); tyres are replaced on condition at this landing count.
    evidence: {tag: ASSUMPTION, source: "per-class overrides carry the evidence"}
    sweep: [0.6, 1.5]
    assumption_id: A-W1.8-9
  life_streams:
    units: "1"
    description: Life in brake-chute streamings (0 = none).
    evidence: {tag: ASSUMPTION, source: "per-class override (chute) carries the evidence"}
    sweep: [0.8, 1.2]
    assumption_id: A-W1.8-9
  life_years:
    units: year
    description: Calendar life since manufacture or last overhaul (0 = none).
    evidence: {tag: ASSUMPTION, source: "per-class overrides carry the evidence"}
    sweep: [0.5, 1.5]
    assumption_id: A-W1.8-9
  lead_mult:
    units: "1"
    description: Multiplier on the supply lead-time distribution for this class (engine supply is a documented Tejas availability shock).
    evidence: {tag: ASSUMPTION, source: "indian_fleet_platform_relevance.md (GE F404 supply ~2 years late; 'only five' engines for 20 Mk1A, Apr 2026)"}
    sweep: [0.5, 3.0]
    assumption_id: A-W1.8-10
  unit_cost:
    units: "1"
    description: Relative unit cost (cost-proxy KPI only; engine = 100).
    evidence: {tag: ASSUMPTION, source: "relative ordering only; no prices used"}
    sweep: [0.5, 2.0]
    assumption_id: A-W1.8-11
