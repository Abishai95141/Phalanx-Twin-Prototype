# M03 Environment and process disturbances: model parameters (format phalanx.params/1).
# Channel semantics live in configs/tejas/dictionary/. Generated column entries reference CSV tables in M03/.
format: phalanx.params/1
module: M03
sets:
  atmosphere:
    r_star:
      value: 8314.32
      units: J/(kmol*K)
      description: 'Universal gas constant (USSA-1976 value)'
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    m0:
      value: 28.9644
      units: kg/kmol
      description: 'Sea-level mean molecular weight of air'
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    g0:
      value: 9.80665
      units: m/s**2
      description: 'Standard gravity (geopotential metre basis)'
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    r0:
      value: 6356766.0
      units: m
      description: 'Effective Earth radius for geopotential altitude'
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    gamma:
      value: 1.4
      units: '1'
      description: 'Ratio of specific heats of air'
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    m_water:
      value: 18.01528
      units: kg/kmol
      description: 'Molecular weight of water vapour (virtual temperature, specific humidity)'
      evidence: {tag: 'ASSUMPTION', source: 'Standard physical constant (not in the evidence base); humidity handling per modelling_methodology.md §1'}
      sweep: [18.0, 18.02]
      assumption_id: A-W1.1-4
    ussa_h_base:
      value: [0.0, 11000.0, 20000.0, 32000.0, 47000.0, 51000.0, 71000.0, 84852.0]
      units: m
      description: "USSA-1976 layer base geopotential heights (m')"
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    ussa_lapse:
      value: [-0.0065, 0.0, 0.001, 0.0028, 0.0, -0.0028, -0.002]
      units: K/m
      description: "USSA-1976 molecular-scale temperature gradients per layer (K/m')"
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    ussa_t0:
      value: 288.15
      units: K
      description: 'USSA-1976 sea-level temperature'
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    ussa_p0:
      value: 101325.0
      units: Pa
      description: 'USSA-1976 sea-level pressure'
      evidence: {tag: 'TRANSFER: USSA-76', source: 'USSA-1976, NASA-TM-X-74335 (defining constants and Table 4 layers); report §7 row 1; modelling_methodology.md §1. A standard, not a Tejas measurement: TRANSFER as M12 tags the same constants (RULES.md rule 3 reserves DIRECT for Tejas/IN20/IAF; E1 verifier §7, E1-HY)'}
    magnus_a:
      value: 610.94
      units: Pa
      description: 'Magnus saturation vapour pressure over water e_s = a exp(b t / (t + c)), t in degC'
      evidence: {tag: 'ASSUMPTION', source: 'Standard meteorological Magnus coefficients (Alduchov and Eskridge 1996); not in the evidence base'}
      sweep: [610.7, 611.2]
      assumption_id: A-W1.1-4
    magnus_b:
      value: 17.625
      units: '1'
      description: 'Magnus saturation vapour pressure over water e_s = a exp(b t / (t + c)), t in degC'
      evidence: {tag: 'ASSUMPTION', source: 'Standard meteorological Magnus coefficients (Alduchov and Eskridge 1996); not in the evidence base'}
      sweep: [17.27, 17.67]
      assumption_id: A-W1.1-4
    magnus_c:
      value: 243.04
      units: K
      description: 'Magnus saturation vapour pressure over water e_s = a exp(b t / (t + c)), t in degC'
      evidence: {tag: 'ASSUMPTION', source: 'Standard meteorological Magnus coefficients (Alduchov and Eskridge 1996); not in the evidence base'}
      sweep: [237.3, 243.5]
      assumption_id: A-W1.1-4
    vapour_scale_height:
      value: 2000.0
      units: m
      description: 'Scale height of the exponential decay of vapour pressure above the station (capped at saturation)'
      evidence: {tag: 'ASSUMPTION', source: 'No vertical humidity profile in the evidence base; replaced by ERA5 replay (modelling_methodology.md §1)'}
      sweep: [1500.0, 3000.0]
      assumption_id: A-W1.1-4
