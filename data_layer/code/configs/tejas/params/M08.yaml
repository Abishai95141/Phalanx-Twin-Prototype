# M08 FADEC, closed-loop governing and engine signal validation (W1.3b). Format: src/phalanx/dictionary/params.py.
# Structure evidence: architecture §6 M08; report §3 (F404 control structure) and §9 (signal-validation template);
# research_notes f404_in20_engine_model.md Q4 (control), Q6 (transients, relight), Q7 (start), Q9 (monitoring);
# texture_and_fault_gap_closure.md Q6 (fault cascades). No IN20 FADEC schedule, gain or threshold is public:
# loop gains and bandwidths are ASSUMPTION with sweeps and are identified on proxy data in W2.4 (AD-31, AD-34).
# Restricted-manual values (report Appendix A1) are not used anywhere in this file.
format: phalanx.params/1
module: M08
sets:
  control:
    t_std:
      value: 288.15
      units: K
      description: Standard-day temperature for corrected speeds (theta = T/T_std)
      evidence: {tag: "TRANSFER: ISA / NASA correction convention", source: "research_notes f404_in20_engine_model.md Q5 T7 (TM-100159 theta = TT/288.15 K)"}
    p_std:
      value: 101325.0
      units: Pa
      description: Standard-day pressure (delta = P/P_std); reference for the T5-limit P0 trim
      evidence: {tag: "TRANSFER: ISA / NASA correction convention", source: "research_notes f404_in20_engine_model.md Q5 T7 (TM-100159 delta = PT/101.325 kPa)"}
    fuel_law:
      value: 1
      units: "1"
      description: "Core fuel law: 1 = ratio units (governor and limiters output Wf/PS3, multiplied by validated PS3), 0 = direct Wf (C-MAPSS40k style)"
      evidence: {tag: ASSUMPTION, source: "report §3 (accel/decel on Wf/PS3; AB in ratio units); f404 notes Q4 (MFC PS3 input, Wr/PS3 to AB control); W1.3b A2 sweep (only law 1 gives the real-data FF->N2 sign)"}
      sweep: [0, 1]
      assumption_id: A-W1.3b-2
    pla_cutoff:
      value: 10.0
      units: deg
      description: PLA below which main fuel is shut off (below the ground-idle detent)
      evidence: {tag: ASSUMPTION, source: "parameter_inventory.csv ENG.PLA (GI ~18 deg); f404 notes Q7 (ground idle 13-15 deg FOCSI vs 18 deg ARL)"}
      sweep: [5.0, 13.0]
      assumption_id: A-W1.3b-4
    pla_gi:
      value: 18.0
      units: deg
      description: Ground-idle PLA detent
      evidence: {tag: "TRANSFER: F404-400", source: "parameter_inventory.csv ENG.PLA ('GI~18' on -400 rigging); Frith 1985 Fig. 28 via f404 notes Q7"}
    pla_irp:
      value: 87.0
      units: deg
      description: Intermediate (IRP / MIL) PLA detent; N1 isochronous and A8-holds-T5 regime at and above
      evidence: {tag: "TRANSFER: F404-400", source: "f404 notes Q5 T3 (TM-100159: IRP 87 deg); report §3"}
    pla_ab_min:
      value: 94.0
      units: deg
      description: Minimum-afterburner PLA (AB request at and above)
      evidence: {tag: "TRANSFER: F404-400", source: "f404 notes Q5 T3 (TM-100159: min AB 94 deg); parameter_inventory.csv ENG.PLA (92-94)"}
    pla_ab_max:
      value: 130.0
      units: deg
      description: Maximum-afterburner PLA
      evidence: {tag: "TRANSFER: F404-400", source: "f404 notes Q5 T3 (TM-100159: max AB 130 deg)"}
    n2c_pla_x:
      table: {file: n2c_pla.csv, column: pla_deg}
      units: deg
      description: "Breakpoints (PLA) of the corrected-N2 demand schedule N2c = f(PLA), trimmed by T25 (corrected to theta25); the W1.3b shape's breakpoints"
      evidence: {tag: ASSUMPTION, source: "derived from the nominal M07 model by phalanx.fadec.harmonise (A-W2.1b-1; drift-tested in tests/integration/test_fadec_harmonise.py; regenerate after an M07 recalibration); shape breakpoints n2c_pla_shape_x (A-W1.3b-4)"}
      sweep: [0.0, 130.0]
      assumption_id: A-W2.1b-1
    n2c_pla_y:
      table: {file: n2c_pla.csv, column: n2c25}
      units: "1"
      description: "Core corrected-speed demand N2/sqrt(theta25) (fraction of 16,810 rpm): the W1.3b shape mapped onto M07 (ground idle at harm_idle_n2, N1-limit onset at harm_n1_onset_pla); rises beyond reach at and above IRP so the N1 regulator wins"
      evidence: {tag: ASSUMPTION, source: "derived from the nominal M07 model by phalanx.fadec.harmonise (A-W2.1b-1; drift-tested in tests/integration/test_fadec_harmonise.py; regenerate after an M07 recalibration); -400: NL reaches its scheduled limit just prior to IRP (CR-1998-208416 §7.2); N2/sqrt(theta25) nearly flat near IRP (CR-191195 Fig. 33)"}
      sweep: [0.6, 0.9]
      assumption_id: A-W2.1b-1
    n2c_pla_shape_x:
      table: {file: n2c_pla_shape.csv, column: pla_deg}
      units: deg
      description: "Breakpoints (PLA) of the W1.3b core-speed demand shape that harmonisation (phalanx.fadec.harmonise) maps onto M07's corrected-speed range"
      evidence: {tag: ASSUMPTION, source: "W1.3b schedule shape (A-W1.3b-4): report §3 / f404 notes Q4 (N2 scheduled on PLA and T2.5 below IRP; NL reaches its limit just prior to IRP); numeric schedule not public"}
      sweep: [0.0, 130.0]
      assumption_id: A-W1.3b-4
    n2c_pla_shape_y:
      table: {file: n2c_pla_shape.csv, column: n2c25}
      units: "1"
      description: "W1.3b core-speed demand shape N2/sqrt(theta25) (its values on the W1 fixture's speed range); only its shape is used: harmonisation maps it affinely onto M07 (ground idle and N1-limit onset anchors)"
      evidence: {tag: ASSUMPTION, source: "W1.3b schedule (A-W1.3b-4): idle 0.641 = F404-GE-102 ground idle ~63-70 % N2 (KSAS 2006, f404 notes Q7); shape between the detents assumed"}
      sweep: [0.6, 0.9]
      assumption_id: A-W1.3b-4
    harm_idle_n2:
      value: 0.666
      units: "1"
      description: "Harmonisation anchor: physical N2 (fraction of 16,810 rpm) at ground idle (PLA pla_gi), SLS ISA, on M07"
      evidence: {tag: ASSUMPTION, source: "F404-GE-102 ground idle ~63-70 % N2 (KSAS 2006 Fig. 2, f404 notes Q7) and USAF IERA test-cell idle ~65 % (iaf_usage_and_validation_gap_closure.md Q3); the W1.3b value 0.641 x sqrt(1.08) = 0.666 is kept"}
      sweep: [0.63, 0.70]
      assumption_id: A-W2.1b-1
    harm_n1_onset_pla:
      value: 84.0
      units: deg
      description: "Harmonisation anchor: PLA at which M07 reaches the N1 limit at SLS ISA with the scheduled nozzle floor (the N2 governor is in control below it)"
      evidence: {tag: ASSUMPTION, source: "-400: 'during a slow throttle advance, NL reaches its scheduled limit just prior to IRP' (CR-1998-208416 §7.2.1, f404 notes Q4); IRP 87 deg (TM-100159); the margin below IRP is not public"}
      sweep: [80.0, 87.0]
      assumption_id: A-W2.1b-1
    harm_bleed:
      value: 0.503
      units: kg/s
      description: "Harmonisation design condition (W2.3a): nominal customer bleed of the installed engine; the reference, accel/decel and feed-forward lines are M07's steady line with this bleed and harm_pto extracted (a FADEC schedule is laid out against the installed engine's steady line)"
      evidence: {tag: ASSUMPTION, source: "M09 nominal ground ECS extraction as delivered on the W2.5 ground-run bench (5 identities, initial_condition at PLA 18: 0.501-0.505 kg/s; M09.yaml ecs_m_set 0.50 + ecs_m_aux 0.03 through the flow-control valve); F404 HARV customer bleed limits about 5-7.2 % of HPC inlet flow, maximum specification bleed 3.0-4.2 lb/s (TM-104247, f404 notes Q4/Q5 T4); W2.5 analysis/faults_b7b8 DEVIATIONS D3 (roll-back with the no-load line)"}
      sweep: [0.0, 1.9]
      assumption_id: A-W2.3-1
    harm_pto:
      value: 21800.0
      units: W
      description: "Harmonisation design condition (W2.3a): nominal shaft power off-take of the installed engine (hydraulic pumps, generator, AMAGB losses) at ground idle"
      evidence: {tag: ASSUMPTION, source: "M09 nominal ground PTO as delivered on the W2.5 ground-run bench (5 identities, initial_condition at PLA 18: 21.3-22.3 kW; M09.yaml hydraulic leakage, generator ground loads, no-load and gearbox losses); IN20 closure off-take 150 kW total including accessories (f404 notes Q1, a high-power figure)"}
      sweep: [0.0, 60000.0]
      assumption_id: A-W2.3-1
    harm_line_min_n2c:
      value: 0.55
      units: "1"
      description: "Lowest corrected core speed N2/sqrt(theta1) (fraction of 16,810 rpm) to which the reference ratio-unit line follows M07's installed steady line below ground idle (W2.3a); below it (start regime, A-W1.3b-18) the W1.3b shape is scaled to join"
      evidence: {tag: ASSUMPTION, source: "below run speed (n2_run 0.60) with a margin of 5 points, so a running engine that sags below idle meets an accel schedule laid out on its own steady line (W2.5 DEVIATIONS D3); M07 steady solutions exist down to about 54 % N2 (core map from 48 %, fan on the PROXY fan-law extrapolation, A-W1.3a-3)"}
      sweep: [0.50, 0.62]
      assumption_id: A-W2.3-1
    n1c_cap:
      value: 1.044
      units: "1"
      description: Cold-day corrected fan-speed cap (fraction of 13,270 rpm corrected to theta1)
      evidence: {tag: "TRANSFER: F404-400", source: "report §3; f404 notes Q4 (Frith 1985 Fig. 29: corrected fan speed capped at 104.4 %)"}
    n1lim_t1_x:
      table: {file: n1lim_t1.csv, column: t1_k}
      units: K
      description: Breakpoints (T1) of the physical N1 limit schedule (XNL-T1 schedule)
      evidence: {tag: ASSUMPTION, source: "f404 notes Q4 (ECU 'XNL-T1 Schedule', CR-1998-208416 §10.6; T1 regimes Frith 1985 Fig. 29); values not public"}
      sweep: [200.0, 400.0]
      assumption_id: A-W1.3b-5
    n1lim_t1_y:
      table: {file: n1lim_t1.csv, column: n1_frac}
      units: "1"
      description: Physical N1 limit (fraction of 13,270 rpm); the governed N1 = min(this, n1c_cap * sqrt(theta1))
      evidence: {tag: ASSUMPTION, source: "X-29 F404-400 max-AB point N1 13,537 rpm = 102.0 % (Conners 1989, f404 notes Q5 T5)"}
      sweep: [1.0, 1.04]
      assumption_id: A-W1.3b-5
    n2_max:
      value: 1.03
      units: "1"
      description: N2 overspeed limiter (fraction of 16,810 rpm, physical)
      evidence: {tag: ASSUMPTION, source: "f404 notes Q4 (limit regulators include N2 max; C-MAPSS40k Nc max); value not public; N2 sensor span 110 %"}
      sweep: [1.02, 1.06]
      assumption_id: A-W1.3b-5
    n2_reduce:
      value: 1000.0
      units: rpm
      description: N2-limit reduction on a speed-sensor accommodation
      evidence: {tag: "TRANSFER: FADEC signal-validation template", source: "report §9 signal-validation table (accommodation: reduce N2 limit by ~1,000 rpm)"}
    n2c_part:
      value: 0.72
      units: "1"
      description: Core corrected-speed demand cap N2/sqrt(theta25) in part-power reversion (second like failure)
      evidence: {tag: ASSUMPTION, source: "f404 notes Q3 (-400: NL dual-pickup mismatch -> fuel reduced to part power, CR-1998-208416); report §9 (revert on a second like failure)"}
      sweep: [0.66, 0.76]
      assumption_id: A-W1.3b-13
    gov_kff:
      value: 1.0
      units: "1"
      description: "Weight of the demand feed-forward in ratio units (u_gov = kff * RU_ff(demand) + PI trim); 0 = pure PI governor"
      evidence: {tag: ASSUMPTION, source: "f404 notes Q4 (-400 MFC schedules fuel from the PLA/N2 schedule; C-MAPSS40k scheduled gain ahead of the integrator); W1.3b A2: low feedback gain is needed for the small-signal sign, so large PLA steps rely on the feed-forward and the accel schedule"}
      sweep: [0.0, 1.5]
      assumption_id: A-W1.3b-3
    ru_ff_x:
      table: {file: ru_ff.csv, column: n2c25}
      units: "1"
      description: Breakpoints (demanded N2/sqrt(theta25)) of the feed-forward ratio-unit schedule
      evidence: {tag: ASSUMPTION, source: "derived from the nominal M07 model by phalanx.fadec.harmonise (A-W2.1b-1; drift-tested in tests/integration/test_fadec_harmonise.py; regenerate after an M07 recalibration): the M07 SLS operating line under the scheduled demand, nozzle floor and VG; flat outside the line"}
      sweep: [0.6, 0.9]
      assumption_id: A-W2.1b-1
    ru_ff_y:
      table: {file: ru_ff.csv, column: ru_pph_psi}
      units: lb/hour/psi
      description: Feed-forward ratio units Wf/PS3 at the demanded core corrected speed (M07 steady state, SLS ISA)
      evidence: {tag: ASSUMPTION, source: "derived from the nominal M07 model by phalanx.fadec.harmonise (A-W2.1b-1; drift-tested in tests/integration/test_fadec_harmonise.py; regenerate after an M07 recalibration)"}
      sweep: [10.0, 30.0]
      assumption_id: A-W2.1b-1
    gov_kl:
      value: 20.0
      units: "1"
      description: "Large-signal governor gain on the N2 error outside the dead zone gov_edz (drives large PLA moves onto the accel/decel Wf/PS3 schedules; small signals see gov_kp only)"
      evidence: {tag: ASSUMPTION, source: "f404 notes Q6 (CF-18 take-off: the maximum fuel schedule is engaged above ~50 deg/s throttle rate, Henry AGARD-CP-448 p.37); W1.3b A2 (a low small-signal gain is needed for the real FF->N2 sign)"}
      sweep: [0.0, 50.0]
      assumption_id: A-W1.3b-3
    gov_edz:
      value: 0.02
      units: "1"
      description: Dead zone of the large-signal governor path (fraction of 100 % N2)
      evidence: {tag: ASSUMPTION, source: "as gov_kl; real small-signal N2 fluctuations are well inside +-2 % (DASHlink fast-band N2 SD ~0.05 %, empirical_dashlink_texture.md)"}
      sweep: [0.005, 0.05]
      assumption_id: A-W1.3b-3
    gov_kp:
      value: 1.5
      units: "1"
      description: N2 governor proportional gain (fraction of scheduled ratio units per fraction of N2 error)
      evidence: {tag: ASSUMPTION, source: "f404 notes Q4 (C-MAPSS40k scheduled PI setpoint loop, GM > 6 dB, PM > 45 deg); gains not public; identified jointly with ps3_tau and the disturbance mix in W2.4a (AD-50). Raised 1 -> 2 in the W1.3b fix-back: with Kp 1 the real W1.3a M07 limit-cycles at SLS ground idle (N2 +-2.3 %, Wf +-15 %, ~0.05 Hz: the weak PI cannot hold the ratio-unit self-feedback, the dead-zone gain bounds it); Kp 2 is steady there and keeps the A2 signs on both plants; Kp >= 3-5 destroys them (AD-50); W2.1b entry gate 4 retune on the real M07 (A-W2.1b-2): lowered 2 -> 1.5 so the governed small-signal FF correlation stays positive up to the N1-limited region (AD-50; harmonised M07, n = 3 x 120 s per PLA: r(N2,FF) > 0 to PLA 80 at Kp 1.5, inverts from PLA 75 at Kp 2)"}
      sweep: [0.0, 8.0]
      assumption_id: A-W1.3b-3
    gov_ks_margin:
      value: 5.0
      units: "1"
      description: "Margin of the N2-governor gain schedule (W2.3a, phalanx.fadec.harmonise.governor_gain_schedule): where the installed steady Wf/PS3 line falls as N2 rises (ground idle with the aircraft's extraction) the small-signal PI gains are multiplied by max(1, margin x (-dRU/dN2c) / (kp x RU_ref)); on the W2.1b-harmonised M07 that is x5.4 at ground idle (N2c 0.666), up to x12.3 at N2c 0.63 and 1 from N2c 0.69"
      evidence: {tag: ASSUMPTION, source: "design rule GM > 6 dB / PM > 45 deg of the C-MAPSS40k scheduled setpoint loops (TM-2010-216811, f404 notes Q4), applied as a step overshoot below 23 % (damping ratio > 0.42) on the largest idle disturbance (the W2.5 bench step: M09 idle loads and each B7 deterioration stepped in from the no-load trim): the smallest tested margin meeting it for every case; margin 2.5 overshoots 40-83 % (rings 19-29 s), 4 overshoots 29 % (F3), 5 at most 15 % (zeta >= 0.51, settled within 8 s), 6 at most 8 % (analysis/calibration_w23/README.md); without the schedule the integrated aircraft's idle N2 wandered 2.6 % peak to peak and a 1 s idle kick did not decay. IN20 governor gains not public"}
      sweep: [2.5, 10.0]
      assumption_id: A-W2.3-3
    gov_ks_x:
      table: {file: gov_ks.csv, column: n2c}
      units: "1"
      description: Breakpoints (N2/sqrt(theta1), fraction of 16,810 rpm) of the N2-governor gain schedule
      evidence: {tag: ASSUMPTION, source: "derived from the nominal installed M07 line by phalanx.fadec.harmonise (A-W2.3-3; drift-tested in tests/integration/test_fadec_harmonise.py; regenerate after an M07 recalibration)"}
      sweep: [0.5, 1.0]
      assumption_id: A-W2.3-3
    gov_ks_y:
      table: {file: gov_ks.csv, column: gain}
      units: "1"
      description: Multiplier on gov_kp and gov_ki at gov_ks_x (1 where the installed steady Wf/PS3 line rises)
      evidence: {tag: ASSUMPTION, source: "derived from the nominal installed M07 line by phalanx.fadec.harmonise (A-W2.3-3; drift-tested in tests/integration/test_fadec_harmonise.py)"}
      sweep: [1.0, 20.0]
      assumption_id: A-W2.3-3
    gov_ki:
      value: 1.0
      units: 1/s
      description: N2 governor integral gain
      evidence: {tag: ASSUMPTION, source: "as gov_kp"}
      sweep: [0.1, 5.0]
      assumption_id: A-W1.3b-3
    n1_kp:
      value: 2.0
      units: "1"
      description: N1 isochronous governor / limiter proportional gain
      evidence: {tag: ASSUMPTION, source: "f404 notes Q4 (NL isochronous via fuel-trim torque motor; C-MAPSS40k limit regulators PI); gains not public; W2.1b entry gate 4 retune on the real M07 (A-W2.1b-2): 3 -> 2 with n1dot_tau 1 s and n1_lead 1.5 s, the N1 loop gain margin on M07 is >= 6 dB at the cold/hot corners (W2.1b margin test)"}
      sweep: [0.5, 8.0]
      assumption_id: A-W1.3b-3
    n1_lead:
      value: 1.5
      units: s
      description: Rate anticipation of the N1 isochronous governor / limiter (error on N1 + lead * dN1/dt; compensates the fan lag)
      evidence: {tag: ASSUMPTION, source: "fan small-step tau ~0.77 s (Merrington, f404 notes Q6); N2 -> N1 lag +0.5 s in real data (round-2 REPORT §3.2); limiter lead not public; W2.1b entry gate 4 retune on the real M07 (A-W2.1b-2): 1 -> 1.5 s with the N1-rate filter n1dot_tau 1 s (the anticipation of a slow approach is kept while the high-frequency gain kp*(1 + lead/tau) falls from 15 to 5)"}
      sweep: [0.0, 3.0]
      assumption_id: A-W1.3b-3
    n1dot_tau:
      value: 1.0
      units: s
      description: "Time constant of the filtered N1 rate used by the N1 rate anticipation (n1_lead); the high-frequency gain of the anticipation path is n1_kp * n1_lead / n1dot_tau"
      evidence: {tag: ASSUMPTION, source: "W2.1 entry gate 4: separate from n2dot_tau so the fan-lag anticipation is kept while the N1 loop keeps its gain margin on M07 at dense, cold inlet conditions; not public"}
      sweep: [0.05, 2.0]
      assumption_id: A-W2.1b-2
    n1_gs_t0:
      value: 288.15
      units: K
      description: "Inlet temperature T1 above which the N1 regulator gains (n1_kp, n1_ki) are scheduled up (gain 1 + n1_gs_k * (T1 - n1_gs_t0), capped at n1_gs_max)"
      evidence: {tag: ASSUMPTION, source: "C-MAPSS40k setpoint-loop gains scheduled on altitude/Mach/ambient and C-MAPSS 90k designs scheduled on P2 x corrected fan speed (f404 notes Q4, NASA TM-2010-216811, TM-2007-215026); W2.1b gate 4: the M07 N1 margin is least on cold dense days (6-7 dB) and largest on hot days (13 dB), while on hot days the N1 limit meets the T5/nozzle loop and needs bandwidth; schedule values not public"}
      sweep: [250.0, 320.0]
      assumption_id: A-W2.1b-2
    n1_gs_k:
      value: 0.0157
      units: 1/K
      description: "Slope of the N1 regulator gain schedule above n1_gs_t0 (0.0157/K: x1.5 at 320 K)"
      evidence: {tag: ASSUMPTION, source: "W2.1b gate 4: x1.5 at 320 K keeps the M07 N1 margin at 9.5 dB (320 K SLS) and removes the hot-day N1 settling violations of the 192-point grid; not public"}
      sweep: [0.0, 0.04]
      assumption_id: A-W2.1b-2
    n1_gs_max:
      value: 1.5
      units: "1"
      description: Cap of the N1 regulator gain schedule
      evidence: {tag: ASSUMPTION, source: "W2.1b gate 4: the M07 N1 margin at x2 is 7.0 dB at 320 K SLS; capped at the x1.5 used to tune"}
      sweep: [1.0, 2.5]
      assumption_id: A-W2.1b-2
    n1_gs_pexp:
      value: 0.5
      units: "1"
      description: "Exponent of the ambient-pressure factor of the N1 regulator gain schedule, (P_std / P0)^n1_gs_pexp capped at n1_gs_pmax (P0 floored at fo_delta_min x P_std; 0 = no pressure scheduling)"
      evidence: {tag: ASSUMPTION, source: "C-MAPSS 90k linear designs scheduled on P2 x corrected fan speed (NASA TM-2007-215026, f404 notes Q4); W2.1b gate 4: without it the M07 grid failed the 0.5 % N1 settling bound at 4/192 points (PLA 110, 30 kPa: the N1/nozzle interplay after the AB light settles in about 12 s); with 0.5: 0/192 on M07 and on the fixture, M07 N1 margin at 30-60 kPa 9.5-16.6 dB; not public"}
      sweep: [0.0, 1.0]
      assumption_id: A-W2.1b-2
    n1_gs_pmax:
      value: 2.0
      units: "1"
      description: Cap of the ambient-pressure factor of the N1 regulator gain schedule
      evidence: {tag: ASSUMPTION, source: "W2.1b gate 4: M07 N1 margin at 30 kPa is 14.8-21.2 dB at the nominal gains, so x2 keeps it above 6 dB; not public"}
      sweep: [1.0, 3.0]
      assumption_id: A-W2.1b-2
    n1_ki:
      value: 1.5
      units: 1/s
      description: N1 isochronous governor integral gain
      evidence: {tag: ASSUMPTION, source: "as n1_kp; W2.1b entry gate 4 retune on the real M07 (A-W2.1b-2): 3 -> 1.5 (less integral phase lag; the fixture N1/T5-nozzle interplay on hot days is damped)"}
      sweep: [0.1, 5.0]
      assumption_id: A-W1.3b-3
    n2m_kp:
      value: 3.0
      units: "1"
      description: N2-max limiter proportional gain
      evidence: {tag: ASSUMPTION, source: "C-MAPSS40k limit-regulator structure (f404 notes Q4); value not public"}
      sweep: [0.0, 8.0]
      assumption_id: A-W1.3b-3
    n2m_ki:
      value: 3.0
      units: 1/s
      description: N2-max limiter integral gain
      evidence: {tag: ASSUMPTION, source: "as n2m_kp"}
      sweep: [0.1, 10.0]
      assumption_id: A-W1.3b-3
    t5f_kp:
      value: 3.0
      units: "1"
      description: T5 fuel limiter proportional gain (per fraction of T5 error)
      evidence: {tag: ASSUMPTION, source: "f404 notes Q4 inference (T5 max in the fuel MIN select); value not public"}
      sweep: [0.0, 10.0]
      assumption_id: A-W1.3b-3
    t5f_ki:
      value: 3.0
      units: 1/s
      description: T5 fuel limiter integral gain
      evidence: {tag: ASSUMPTION, source: "as t5f_kp"}
      sweep: [0.1, 20.0]
      assumption_id: A-W1.3b-3
    ps3x_kp:
      value: 2.0
      units: "1"
      description: PS3-max limiter proportional gain
