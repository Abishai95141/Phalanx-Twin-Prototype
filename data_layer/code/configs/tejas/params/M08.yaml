    ign_lo:
      value: 0.10
      units: "1"
      description: Ignition permissive lower N2 bound (fraction); fuel on while starting only at or above it
      evidence: {tag: "TRANSFER: F404-400", source: "f404 notes Q6/Q7 (ignition permissive at NH 10-45 %, CR-1998-208416 §7.2.5)"}
    ign_hi:
      value: 0.45
      units: "1"
      description: Ignition permissive upper N2 bound (igniters off above it in a start)
      evidence: {tag: "TRANSFER: F404-400", source: "as ign_lo"}
    n2_run:
      value: 0.60
      units: "1"
      description: Corrected N2 (N2/sqrt(theta1), fraction) above which a start is complete (RUNNING); also the hung-start and sub-idle-mode threshold
      evidence: {tag: "TRANSFER: F404-400 (NASA)", source: "f404 notes Q7 (NASA hung-start rule N2 < 60 %, TM-101702)"}
    hs_window:
      value: 1.0
      units: s
      description: "Hung-start rule: N2 < n2_run and not rising for this long"
      evidence: {tag: "TRANSFER: F404-400 (NASA)", source: "f404 notes Q7 (not increasing for 1 s, TM-101702)"}
    hs_timeout:
      value: 35.0
      units: s
      description: "Hung-start rule: N2 < n2_run for this long while starting"
      evidence: {tag: "TRANSFER: F404-400 (NASA)", source: "f404 notes Q7 (or N2 < 60 % for 35 s, TM-101702)"}
    hs_pla_lo:
      value: 14.0
      units: deg
      description: "Hung-start 1-s rule applies only with PLA at or above this (lower edge of the start band)"
      evidence: {tag: "TRANSFER: NASA F404-400 monitoring rule", source: "f404 notes Q7 (NASA hung-start rule: N2 < 60 % and not increasing for 1 s with PLA between 14 and 24 deg, TM-101702)"}
    hs_pla_hi:
      value: 24.0
      units: deg
      description: "Hung-start 1-s rule applies only with PLA at or below this (upper edge of the start band)"
      evidence: {tag: "TRANSFER: NASA F404-400 monitoring rule", source: "as hs_pla_lo"}
    hs_deadband:
      value: 0.001
      units: 1/s
      description: "'Not rising' means filtered dN2/dt at or below this (fraction per s); keeps quantisation from resetting the window"
      evidence: {tag: ASSUMPTION, source: "N2 lane LSB 0.03125 % (dictionary); deadband not public"}
      sweep: [0.0, 0.005]
      assumption_id: A-W1.3b-8
