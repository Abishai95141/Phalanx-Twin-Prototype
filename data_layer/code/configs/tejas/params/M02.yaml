# M02 Scenario, fleet calendar and mission generator: model parameters (format phalanx.params/1).
# Plan-level values marked 'calibrated' were set on the calibration scenario (scenario key 'cal') to bring the
# plan-level usage gates inside their bands (AD-28: accept a configuration only if fleet statistics fall in
# the gates); the gate tests run on an independent scenario key. See the W1.1 report.
format: phalanx.params/1
module: M02
sets:
  calendar:
    peace_rate:
      value: 1.5
      units: '1'
      description: 'Planned sorties per available aircraft per flying day, peacetime'
      evidence: {tag: 'ASSUMPTION', source: 'report §4 (Tejas sorties, usage gates, six-layer generator); research_notes/.../iaf_usage_and_validation_gap_closure.md Q1 (1-2 peace; CAG 17/2015 ~1 per flown aircraft-day in development)'}
      sweep: [1.0, 2.0]
      assumption_id: A-W1.1-20
    surge_rate:
      value: 5.0
      units: '1'
      description: 'Planned sorties per available aircraft per flying day, surge'
      evidence: {tag: 'ASSUMPTION', source: 'report §4 (Tejas sorties, usage gates, six-layer generator); Gagan Shakti 2018: Tejas 6 sorties per aircraft per day (PIB; ANI)'}
      sweep: [4.0, 6.0]
      assumption_id: A-W1.1-20
    day_wave_hours:
      value: [3.0, 6.5, 9.5]
      units: hour
      description: 'Day-wave take-off times (UTC; 08:30, 12:00, 15:00 IST)'
      evidence: {tag: 'ASSUMPTION', source: 'No IAF wave structure in the evidence base'}
      sweep: [0.0, 12.0]
      assumption_id: A-W1.1-20
    night_wave_hour:
      value: 14.5
      units: hour
      description: 'Night-wave take-off time (UTC; 20:00 IST)'
      evidence: {tag: 'ASSUMPTION', source: 'All 52 bases night-capable (18th LS 2nd Report); timing not in the evidence base'}
      sweep: [13.0, 17.0]
      assumption_id: A-W1.1-29
    night_wave_prob:
      value: 0.6
      units: '1'
      description: 'Probability that a flying day has a night wave (calibrated: night share 10-20 %)'
      evidence: {tag: 'ASSUMPTION', source: 'report §4 (Tejas sorties, usage gates, six-layer generator) (night 10-20 % [ASSUMPTION])'}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-29
    surge_wave_hours:
      value: [1.0, 3.5, 6.0, 8.5, 11.0, 14.5]
      units: hour
      description: 'Surge wave take-off times (UTC)'
      evidence: {tag: 'ASSUMPTION', source: 'Surge generates maximum sorties per 24 h (PIB Gagan Shakti 2018); wave times not public'}
      sweep: [0.0, 18.0]
      assumption_id: A-W1.1-20
    flying_weekdays:
      value: [1, 1, 1, 1, 1, 0, 0]
      units: '1'
      description: 'Flying days Monday..Sunday (1 = flying) outside surge'
      evidence: {tag: 'ASSUMPTION', source: 'No IAF weekly pattern in the evidence base'}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-20
    ground_run_day_prob:
      value: 0.16
      units: '1'
      description: 'Probability that an aircraft-day includes a maintenance ground run'
      evidence: {tag: 'TRANSFER: Gripen RM12', source: 'Chalmers 2014 §5.1: 16 % of flying days started with a ground mission; research_notes/.../flight_profiles_and_usage.md Q2'}
    ground_run_duration:
      value: 4.6
      units: minute
      description: 'Mean ground-run engine time'
      evidence: {tag: 'TRANSFER: Gripen RM12', source: 'Chalmers 2014 §5.1 (average ground mission 4.6 min); research_notes/.../flight_profiles_and_usage.md Q2'}
    cancel_fog:
      value: 0.8
      units: '1'
      description: 'Weather-cancel probability: morning waves on a fog day'
      evidence: {tag: 'ASSUMPTION', source: "IMD day counts give the phenomenon; cancel-given-phenomenon not in the evidence base (research_notes/.../iaf_usage_and_validation_gap_closure.md Q1: 'a daily weather-cancel probability can be drawn from these monthly day counts')"}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-21
    cancel_thunder:
      value: 0.6
      units: '1'
      description: 'Weather-cancel probability: afternoon/night waves on a thunder day'
      evidence: {tag: 'ASSUMPTION', source: "IMD day counts give the phenomenon; cancel-given-phenomenon not in the evidence base (research_notes/.../iaf_usage_and_validation_gap_closure.md Q1: 'a daily weather-cancel probability can be drawn from these monthly day counts')"}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-21
    cancel_dust:
      value: 0.7
      units: '1'
      description: 'Weather-cancel probability: every wave on a dust-storm day'
      evidence: {tag: 'ASSUMPTION', source: "IMD day counts give the phenomenon; cancel-given-phenomenon not in the evidence base (research_notes/.../iaf_usage_and_validation_gap_closure.md Q1: 'a daily weather-cancel probability can be drawn from these monthly day counts')"}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-21
    cancel_precip:
      value: 0.15
      units: '1'
      description: 'Weather-cancel probability: any wave on a precipitation day'
      evidence: {tag: 'ASSUMPTION', source: "IMD day counts give the phenomenon; cancel-given-phenomenon not in the evidence base (research_notes/.../iaf_usage_and_validation_gap_closure.md Q1: 'a daily weather-cancel probability can be drawn from these monthly day counts')"}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-21
    pilots_per_aircraft:
      value: 1.25
      units: '1'
      description: 'Sanctioned fighter pilot-to-cockpit ratio'
      evidence: {tag: 'DIRECT', source: '16th LS 47th Report, Pilot-Cockpit Ratio (printed 1:25, read as 1:1.25); research_notes/.../iaf_usage_and_validation_gap_closure.md Q1'}
    hot_refuel_prob_surge:
      value: 0.5
      units: '1'
      description: 'Probability of a hot (engine-running) refuel turn in surge'
      evidence: {tag: 'ASSUMPTION', source: 'Hot refuelling demonstrated (ADA AR 2018-19, LSP-8 trial 2018); frequency not public'}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-24
  sortie:
    duration_median:
      value: 47.4
      units: minute
      description: 'Median flight time (lognormal; geometric mean of the P5-P95 25-90 min)'
      evidence: {tag: 'ASSUMPTION', source: 'report §4 (Tejas sorties, usage gates, six-layer generator): median 45-55 min, P5-P95 25-90 min [ASSUMPTION, Tejas-anchored]'}
      sweep: [45.0, 55.0]
      assumption_id: A-W1.1-23
    duration_sig:
      value: 0.33
      units: '1'
      description: 'Within-mission-type lognormal sigma of flight time (calibrated so the mix spans P5-P95 25-90 min)'
      evidence: {tag: 'ASSUMPTION', source: 'report §4 (Tejas sorties, usage gates, six-layer generator)'}
      sweep: [0.25, 0.45]
      assumption_id: A-W1.1-23
    drop_tank_shift:
      value: [15.0, 30.0]
      units: minute
      description: 'Flight-time increase with drop tanks or AAR (uniform)'
      evidence: {tag: 'ASSUMPTION', source: "report §4 (Tejas sorties, usage gates, six-layer generator): 'shifted up by 15-30 min with drop tanks or air-to-air refuelling'"}
      sweep: [10.0, 35.0]
      assumption_id: A-W1.1-23
    takeoff_roll_ab:
      value: 20.0
      units: s
      description: 'Ground roll with AB take-off'
      evidence: {tag: 'ASSUMPTION', source: 'Not public (lift-off 290-325 km/h at 9.8 t is [ASSUMPTION: physics], R§4 table)'}
      sweep: [12.0, 35.0]
      assumption_id: A-W1.1-24
    takeoff_roll_mil:
      value: 30.0
      units: s
      description: 'Ground roll with MIL take-off'
      evidence: {tag: 'ASSUMPTION', source: 'Not public (R§4 table)'}
      sweep: [18.0, 45.0]
      assumption_id: A-W1.1-24
    hot_day_temperature:
      value: 308.15
      units: K
      description: 'Station temperature above which an AB take-off becomes more likely (35 C)'
      evidence: {tag: 'ASSUMPTION', source: 'Hot/high take-off performance (R§3 density altitude 4,000-5,200 ft); threshold not public'}
      sweep: [303.15, 313.15]
      assumption_id: A-W1.1-24
  grammar:
    preflight:
      value: 6.0
      units: minute
      description: 'Median power-up/BIT/alignment time before engine start (engine off)'
      evidence: {tag: 'ASSUMPTION', source: 'report §4 (Tejas sorties, usage gates, six-layer generator) phase table (prototype FBW diagnostic ~10 min; modern LRUs faster [ASSUMPTION])'}
      sweep: [3.0, 12.0]
      assumption_id: A-W1.1-24
    engine_start:
      value: 40.0
      units: s
      description: 'Engine start to stable idle'
      evidence: {tag: 'TRANSFER: F404-102 (T-50)', source: 'report §4 (Tejas sorties, usage gates, six-layer generator) phase table: T-50 FADEC timeline, idle ~63-70 % N2 at ~40 s (KSAS 2006); f404_in20_engine_model.md Q7 (KSAS Fig. 2 graph-read: rotation ~14 s, idle ~40 s, i.e. ~26 s rotation-to-idle; Phalanx start [ASSUMPTION]: idle at ~40 s from JFS engagement on a standard day, longer at altitude and in cold soak). Value 45 -> 40 s to match the evidence (E1 verifier §7, E1-HY). Sweep: 26 s (T-50 rotation-to-idle) to 60 s (x1.5 for cold-soak and altitude starts: no released number, ASSUMPTION). Restricted-manual start timings (report App. A1) are not used'}
      sweep: [26.0, 60.0]
      assumption_id: A-W1.1-24
    ground_idle:
      value: 3.0
      units: minute
      description: 'Median post-start checks at ground idle'
      evidence: {tag: 'ASSUMPTION', source: 'report §4 (Tejas sorties, usage gates, six-layer generator) / research_notes/.../flight_profiles_and_usage.md (b) row 3: ~2-10 min'}
      sweep: [2.0, 10.0]
      assumption_id: A-W1.1-24
    taxi_out:
      value: 9.0
      units: minute
      description: 'Median taxi-out (calibrated to EOT/EFH 1.56; USAF default 18.5 min)'
      evidence: {tag: 'ASSUMPTION', source: 'USAF Air Emissions Guide (taxi-out 18.5 min, TRANSFER); research_notes/.../flight_profiles_and_usage.md (b) row 4: ~3-15 min'}
      sweep: [3.0, 18.5]
      assumption_id: A-W1.1-24
    taxi_sig:
      value: 0.4
      units: '1'
      description: 'Lognormal sigma of taxi times'
      evidence: {tag: 'ASSUMPTION', source: 'research_notes/.../flight_profiles_and_usage.md (b)'}
      sweep: [0.2, 0.6]
      assumption_id: A-W1.1-24
    runup_prob:
      value: 0.5
      units: '1'
      description: 'Probability of a static run-up check against the brakes before take-off (at pla_runup; rolling take-off otherwise)'
      evidence: {tag: 'ASSUMPTION', source: 'research_notes/.../flight_profiles_and_usage.md (b) row 5 (optional; rolling take-off allowed)'}
      sweep: [0.0, 1.0]
      assumption_id: A-W1.1-24
    cold_soak_temperature:
      value: 258.15
      units: K
      description: 'Station temperature at or below which a sortie power-up is a cold-soak start (ops.power_up cold_soak = 1)'
      evidence: {tag: 'DIRECT', source: "reports/Virtual fighter telemetry layer research.md Engine start row: the JFS start requirement demonstrated at -15 degC after an 18-42 h soak (85 % battery); using the station temperature at the sortie as the soak temperature is an ASSUMPTION"}
      sweep: [248.15, 273.15]
      assumption_id: A-W2.1-11
    runup:
      value: 30.0
      units: s
      description: 'Run-up duration (at pla_runup, against the brakes)'
      evidence: {tag: 'ASSUMPTION', source: 'research_notes/.../flight_profiles_and_usage.md (b) row 5 (~1-5 min including checks)'}
      sweep: [15.0, 60.0]
      assumption_id: A-W1.1-24
    taxi_in:
      value: 7.0
      units: minute
      description: 'Median taxi-in (calibrated to EOT/EFH 1.56; USAF default 11.3 min)'
      evidence: {tag: 'ASSUMPTION', source: 'USAF Air Emissions Guide (taxi-in 11.3 min, TRANSFER); research_notes/.../flight_profiles_and_usage.md (b) row 15'}
      sweep: [3.0, 11.3]
      assumption_id: A-W1.1-24
    cooldown:
      value: 259.0
      units: s
      description: "Median idle before shutdown (scaled by the pilot's cooldown discipline)"
      evidence: {tag: 'TRANSFER: Gripen RM12', source: 'Chalmers 2014 (recorded average idle before shutdown 259 s); report §4 (Tejas sorties, usage gates, six-layer generator) phase table'}
    pattern:
      value: 4.0
      units: minute
      description: 'Median pattern/break time'
      evidence: {tag: 'ASSUMPTION', source: 'research_notes/.../flight_profiles_and_usage.md (b) row 11 (~2-6 min)'}
      sweep: [2.0, 6.0]
      assumption_id: A-W1.1-24
    approach:
      value: 2.0
      units: minute
      description: 'Final approach time'
      evidence: {tag: 'ASSUMPTION', source: 'research_notes/.../flight_profiles_and_usage.md (b) row 12 (~1-3 min)'}
      sweep: [1.0, 3.0]
      assumption_id: A-W1.1-24
    landing:
      value: 40.0
      units: s
      description: 'Touchdown to taxi speed'
      evidence: {tag: 'ASSUMPTION', source: 'research_notes/.../flight_profiles_and_usage.md (b) row 13 (~20-60 s)'}
      sweep: [20.0, 60.0]
      assumption_id: A-W1.1-24
    touch_and_go_cycle:
      value: 4.0
      units: minute
      description: 'One touch-and-go circuit (approach, touch, MIL re-acceleration, downwind)'
      evidence: {tag: 'ASSUMPTION', source: 'research_notes/.../flight_profiles_and_usage.md (b) row 14 (+5-10 min per circuit [ASSUMPTION])'}
      sweep: [3.0, 10.0]
      assumption_id: A-W1.1-24
    climb_rate:
