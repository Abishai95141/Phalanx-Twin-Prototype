# U6 channel-coverage plan (W2.2; E1 verifier U6; A-W2.2-11). Every dictionary channel has exactly one owner class:
#
#   m12_sensor     an M12 sensor of the channel map (sensors.config.build_sensor_config) -> M13 -> param.samples
#   recorded       an LRU-computed value supplied by a module's ports.RECORDED (AD-42) -> M13 external= -> param.samples
#   topic          delivered through another contract topic or record field (usage.counters, events.*,
#                  sortie.manifest, param.samples time fields)
#   not_simulated  explicitly not produced: contract state `absent` (never a param.samples row); `gap` names the
#                  owner and plan (G-*) or the scope decision (S-*); `target` is the class it will have once built;
#                  `nm` lists the not_measured_states.csv rows that cite it as partial information (information the
#                  downstream user does not get while it is absent)
#
# Produced channels (m12_sensor, recorded) carry `route` when they are not consumer-visible on a recorded bus
# (AD-54: the param.samples channel set is identical on the fast and full paths): `internal` = no full-path
# transport (LRU-internal lanes, the ADC-DFCC RS-422 links), the channel stays in the CIR and internal
# diagnostics; `fti` = the FTI PCM stream, visible only when the FTI system is fitted. They carry `acq_gap` when
# the recording path (M13 acquisition) cannot record them yet (none since W2.2 phase B); topic channels carry `gap`
# when the topic's producer does not exist yet. Every gap below has an owner
# (modules) and a work package (scheduled, or proposed for the coordinator to schedule) and a plan.
#
# Enforced by tests/integration/test_w22_channel_coverage.py against the code: M12 channel map, every ports.RECORDED
# (the 15 gated packages and phalanx.sensors.avionics), M14 usage counters and codes, the contract spec, the M13
# acquisition build of every produced channel, M14 monitor inputs, and the not_measured_states.csv cross-references
# (token rule: a parenthetical qualifier is dropped; `X` and `X.*` match X and its sub-channels; `none` is ignored).
format: phalanx.coverage/1
platform: tejas
classes: [m12_sensor, recorded, topic, not_simulated]
contract_state_not_simulated: absent

gaps:
  # ---- recording path (data path) -------------------------------------------------------------------------------
  # W2.2 phase B part 1 closed the phase-A acquisition gaps: G-ACQ-WORDS (the M13 word path: status, discrete, enum
  # and code words held at the producer's value and read at the LRU rate, A-W2.2-12) and G-ACQ-CLOCK-INGPS / AHRS /
  # RADALT (M13 clock sets for those LRU domains, plus SMS, CWS, OAC, RADAR and ECMS so every dictionary word has a
  # path). No produced channel has an acquisition gap; the kind stays for future ones.
  G-MANIFEST:
    kind: contract
    title: No producer of the sortie.manifest topic
    owner: [M02, M18, M17]
    wp: W2.2 phase B (item 6, skeleton milestone)
    plan: >-
      Emit sortie.manifest from the M02 sortie plan and the M18 configuration state (tail, base, mission, crew,
      engine and LRU serials, sw_config_id) on both paths. Per-LRU software identifiers (AV.SW_CONFIG.*) fold into
      the single sw_config_id field; a per-LRU map would be an additive contract change (coordinator decision).
  # ---- avionics status and BIT (bus and monitoring) ----------------------------------------------------------------
  G-AV-BUS-STATUS:
    kind: simulation
    title: MIL-STD-1553 bus-status and RT status words are not generated
    owner: [M15]
    wp: W2.2 phase B part 2 (item 5, events.* on the full path)
    plan: >-
      The M13 word path and M15/M17 carry these words exactly once produced (W2.2 phase B part 1). M15 generates RT
      status words (message error, busy, subsystem flag) and bus status from the bus model:
      message errors from M11 wiring faults and RT no-response from the LRU powered flags (the avionics module
      publishes powered_ingps/ahrs/radalt/sms for this).
    sources: [avio.powered_ingps, avio.powered_ahrs, avio.powered_radalt, avio.powered_sms]
  G-AV-LRU-BIT:
    kind: simulation
    title: Per-LRU BIT and health words (link, memory, port) are not produced
    owner: [M14, M11]
    wp: W2.2 phase B part 2 (item 5, events.* on the full path)
    plan: >-
      M14 publishes per-LRU BIT/health words from its BIT state and the M11 LRU fault modes as RECORDED channels
      with the synthetic dictionary code values (AV.LRU.BIT.DFCC is already RECORDED by M05 and is the template);
      they then record through the M13 word path onto the bus (built, W2.2 phase B part 1).
  G-AV-LRU-TEMP:
    kind: simulation
    title: LRU internal temperatures are not modelled
    owner: [M12, M09]
    wp: proposed (coordinator)
    plan: >-
      LRU internal temperature = avionics-bay temperature (M09 util.ecs_t, AVIONICS_BAY point) plus a first-order
      self-heating rise driven by the LRU's powered state, per LRU in the avionics extension; recorded on the LRU
      clock sets (built, W2.2 phase B).
    truth: [util.ecs_t]
  # ---- air data, flight control ----------------------------------------------------------------------------------
  G-AD-DPA-DPB:
    kind: simulation
    title: Side-probe flow-angle differential pressures (AD.DPA / AD.DPB) are not simulated (PROXY A-W2.2-10)
    owner: [M12]
    wp: proposed (coordinator)
    plan: >-
      Side-probe pressure coefficients (TRANSFER: F/A-18 FADS or the Tejas SADP calibration) as M12 lanes on the
      DFCC/ADC clock; the avionics ADC then votes AD.DPA.V / AD.DPB.V and runs their AD.VALID monitors.
  G-PROBE-HEAT:
    kind: simulation
    title: Probe heater currents (FCS.HEATER_I.*) and heater faults are not modelled
    owner: [M12, M09, M11]
    wp: proposed (coordinator)
    plan: >-
      The M12 TAT probe reads the heater state from util.probe_heat since W2.2 (as the avionics ADC's correction
      does). Remaining: FCS.HEATER_I.* = heater state x nominal heater current with a per-unit spread and the
      heater-fault modes of M11 (a failed heater with the flag on), acquired on the DFCC clock.
    truth: [util.probe_heat]
  G-FCS-ATTITUDE:
    kind: simulation
    title: The DFCC attitude estimator (FCS.KALMAN_ATT.*) is not in the M05 replica (PROXY A-W1.2-29)
    owner: [M05]
    wp: proposed (coordinator); inputs now exist (W2.2 avionics NAV.INS / NAV.AHRS)
    plan: >-
      M05 attitude estimator blending the rate-gyro lanes with the avionics INS/AHRS outputs, published as
      RECORDED FCS.KALMAN_ATT.PITCH / ROLL (fcs.ports.NOT_MODELLED reason).
  # ---- engine -----------------------------------------------------------------------------------------------------
  G-M08-VOTED:
    kind: simulation
    title: M08 does not produce ENG.PLA.V / ENG.A8.V
    owner: [M08]
    wp: W2.1b
    plan: Validate the PLA resolver and nozzle LVDT lanes in M08 and publish the voted values (fadec.ports.RECORDED_MISSING).
  G-ENG-VIB:
    kind: simulation
    title: Engine vibration (ENG.VIB.*) is not modelled
    owner: [M07, M10, M12, M13]
    wp: proposed (coordinator)
    plan: >-
      Once-per-rev amplitudes from rotor imbalance and bearing health (M10) at N1/N2, an M12 velocity pickup with
      its band-pass, and an HF acquisition group in M13 (the dictionary's HF rate group has no LRU). Without it the
      M14 ECM-701 vibration monitor has no input.
    consumers: [M14:ECM-701]
  G-ENG-THRUST-EST:
    kind: simulation
    title: The ECMS thrust estimate is not computed
    owner: [M14]
    wp: proposed (coordinator)
    plan: ECMS synthesis of thrust from the recorded N1, PS3 and T1 (M14 ECMS model) published as RECORDED ENG.THRUST_EST.
  G-ENG-DISCRETES:
    kind: simulation
    title: Engine discretes (chip detector, lube filter dP, oil level, bleed state) are not produced
    owner: [M07, M11, M12, M08]
    wp: proposed (coordinator)
    plan: >-
      Physical states first (chip accumulation from M10/M11 bearing health, lube filter loading, oil quantity, bleed
      valve state from M09 bleed extraction), then M12 discrete sensors (chip detector, dP switch, level switch) and
      the FADEC bleed-state word. Without ENG.CHIP the M14 ECM-001 chip monitor has no input.
    consumers: [M14:ECM-001]
  # ---- utilities ----------------------------------------------------------------------------------------------
  G-ECS:
    kind: simulation
    title: ECS and life-support channels without a truth point have no sensors (named U6 gap)
    owner: [M12, M09, M13]
    wp: proposed (coordinator)
    plan: >-
      Done in W2.2 phase B: M12 sensors on the M09 points util.ecs_t / util.ecs_p (bleed manifold, PHX outlet, ACM
      turbine outlet, cockpit, avionics bay; A-W2.2-16). Remaining: M09 to publish the ACM turbine inlet and supply
      duct temperatures, the temperature-control-valve position, the avionics overheat and ECS switch states, and
      to model OBOGS (O2, pressure, fail) and LOX quantity; M13 clock sets for the CPCS / OBOGS domains if they are
      separate LRUs. Without them the M14 ECS-503 monitor has no input.
    truth: [util.ecs_t, util.ecs_p]
    consumers: [M14:ECS-503]
  G-ELEC:
    kind: simulation
    title: Generator, TRU, battery and backup currents, voltages and frequency are not published
    owner: [M09, M12, M13]
    wp: proposed (coordinator)
    plan: >-
      M09 load-flow outputs (generator phase voltages, current and frequency, TRU and battery currents and voltages,
      backup-generator status) as truth signals, M12 channel-map entries, M13 clock sets for the GCU, TRU, BDU and
      DC_GCU domains. Without ELEC.GEN.F the M14 ELE-701 monitor has no input.
    truth: [util.bus_v, util.gen_online, util.batt_soc]
    consumers: [M14:ELE-701]
  G-SPS-JFS:
    kind: simulation
    title: JFS and AMAGB channels have no published truth or sensors (named U6 gap)
    owner: [M09, M12, M13]
    wp: proposed (coordinator)
    plan: >-
      M09 already integrates JFS speed, EGT, oil temperature and quantity internally (state jfs_n, jfs_egt, jfs_oilt,
      jfs_oilq): publish them (and the AMAGB oil temperature and level) as truth signals, add M12 channel-map entries
      and the BHEEM_EU clock set in M13; SPS.JFS.OIL_QTY is a per-sortie (SORTIE-acquired) reading.
    truth: [util.jfs_state]
  G-HYD-LEVEL:
    kind: simulation
    title: Hydraulic reservoir low-level switches are not produced (the level transmitters are, since W2.2)
    owner: [M12, M13]
    wp: proposed (coordinator)
    plan: >-
      The level transmitters read util.hyd_res_level since W2.2 phase B (A-W2.2-16). Remaining: the low-level
      switches (HYD.SYS*.LEVEL.LOW) as M12 discrete sensors on util.hyd_res_level (a falling-level comparator with
      hysteresis), recorded through the M13 word path on the BHEEM_EU clock.
    truth: [util.hyd_res_level]
  G-HYD-DISCRETES:
    kind: simulation
    title: Hydraulic discretes (low pressure, filter dP, DFCC channel status) are not produced
    owner: [M12, M05, M09]
    wp: proposed (coordinator)
    plan: >-
      Low-pressure switches on util.hyd_p (M12 discrete sensors), filter dP from a filter-loading state in M09,
      HYD.CH_STATUS as an M05 RECORDED word from the DFCC's hydraulic-channel logic.
    truth: [util.hyd_p]
  G-BRAKES:
    kind: simulation
    title: Brake pedals and antiskid flags have no sensors (the brake pressures do, since W2.2)
    owner: [M12, M13]
    wp: proposed (coordinator)
    plan: >-
      The brake pressure transducers read util.brake_p since W2.2 phase B (A-W2.2-16). Remaining: the pedal
      position transducers (pilot.brake_cmd) and the antiskid wheel-speed flags as an antiskid word, M13 clock set
      for ANTISKID if it is a separate LRU.
    truth: [util.brake_p, pilot.brake_cmd, af.wheel_speed]
  G-LANDING-GEAR:
    kind: simulation
    title: Gear position, WOW word, chute state and nose-wheel steering are not produced
    owner: [M06, M05, M09, M12]
    wp: proposed (coordinator)
    plan: >-
      af.gear_pos from M06 (also replaces the ADC gear-ramp PROXY A-W2.2-7), LG.WOW as an M05 RECORDED word from
      af.wow, CHUTE.STATE from the M09 chute events, a nose-wheel-steering model in M06 for NWS.STATE.*.
    truth: [af.wow, pilot.gear_cmd]
  G-FIRE:
    kind: simulation
    title: Engine fire detection (FIRE.WARN) is not modelled
    owner: [M09, M11, M12]
    wp: proposed (coordinator)
    plan: Fire state (M11 fault mode, M09 extinguisher event) and the fire-loop discrete in M12. Without it the M14 FIR-501 monitor has no input.
    consumers: [M14:FIR-501]
  G-FUEL-GAUGING:
    kind: simulation
    title: The ECFM-C gauged fuel total (FUEL.TOTAL.*) is not computed
    owner: [M14, M12]
    wp: W2.2 phase B (item 7, zoom-climb gauging end to end)
    plan: >-
      ECFM-C gauging computation summing the M12 tank-probe readings (attitude and acceleration artefacts from the M12
      gauge physics, AD-42) into FUEL.TOTAL.TOTAL and its flags, as a RECORDED producer. Without it the M14 FUE-501
      low-fuel monitor has no input.
    consumers: [M14:FUE-501]
  G-FUEL-SYSTEM:
    kind: simulation
    title: Fuel boost pressure, tank pressurisation, refuel discrete and fuel temperature are not produced
    owner: [M09, M12]
    wp: proposed (coordinator)
    plan: M09 boost-pump and tank-pressurisation states and tank fuel temperature; M12 sensors and switches; refuel discrete from the util.refuel event.
  # ---- ground processes ------------------------------------------------------------------------------------------
  G-INSPECTION:
    kind: contract
    title: Ground inspection measurements (MX.*) have no numeric carrier in maint.records
    owner: [M18]
    wp: proposed (coordinator); contract minor bump
    plan: >-
      M18 inspection records carrying param_id = MX.* and a measured value (additive maint.records fields: a contract
      minor version), from M09 brake and tyre wear, M10 oil consumption and debris, and the inspection schedule.
  G-GROUND-PHASE:
    kind: contract
    title: The ground-derived flight phase (SYS.PHASE) is not produced
    owner: [M17, M20]
    wp: proposed (coordinator)
    plan: Ground segmentation of the sortie into phases from sortie.manifest times and recorded air data (a derived record, not a sensor).
  G-EVENT-MARKER:
    kind: simulation
    title: The pilot event marker (SYS.EVENT_MARKER) is not produced
    owner: [M04]
    wp: proposed (coordinator)
    plan: A pilot event-marker action in M04 driving the OAC discrete.
  # ---- scope decisions (not gaps) ---------------------------------------------------------------------------------
  S-FTI:
    kind: scope
    title: Flight-test instrumentation (FTI strain gauges, flight-test points, the FTI DAS stream) is out of scope
    owner: [coordinator]
    wp: none
    plan: Not simulated for the service fleet (FTI is fitted to test aircraft only); revisit only if a loads-monitoring use case needs strain.
  S-MEDIA:
    kind: scope
    title: Cockpit video (DVR) is non-numeric media with no contract topic
    owner: [coordinator]
    wp: none
    plan: Not simulated.

# AD-42 truth signals catalogued for M12 that M12's channel map does not bind (E1 U6). W2.2 phase B bound
