# Phalanx proxy-mode dictionary (DASHlink Tail 687; W2.4a, AD-33/AD-43). Hand-maintained source.
# FADEC lanes: TRANSFER of the Tejas FADEC lane definitions (the proxy runs the same M08 structure, AD-43).
# Recorded words: MEASURED on DASHlink Tail 687 archive 1 (analysis/dashlink_texture, round-1/2 results).
format: phalanx.dictionary.rules/1
rules:
  R-LANE-PROXY:
    title: Proxy FADEC lanes transfer the Tejas FADEC lane definitions
    statement: 'The proxy engine runs the M08 governor structure (AD-43: same method structure, closed-loop governing AD-31/AD-50), so its controller acquires the same dual-lane sensor set as the Tejas
      FADEC (N1, N2, T1, PS3 lanes A/B; T25; T5 harnesses A/B) with the same signal kinds, native steps, converter, encoding, transport and validity. The DASHlink aircraft''s real engine control is hydromechanical/TMS-era
      (round-2 REPORT §6 item 3); these lanes are the build''s structure, not that aircraft''s.'
    tag: 'TRANSFER: Phalanx Tejas dictionary FADEC lanes'
    source: configs/tejas/dictionary/sources/engine.yaml (ENG.N1.A ... ENG.T5.HARNESS_B); architecture AD-43
    sweep: none
    affects: [M08, M12, M13]
  R-RANGE-LANE-PROXY:
    title: Proxy FADEC lane ranges
    statement: N1, N2, T1, T25 and PS3 lane ranges are the Tejas lane ranges; they contain every DASHlink value.
    tag: 'TRANSFER: Phalanx Tejas dictionary FADEC lanes'
    source: configs/tejas/dictionary/sources/engine.yaml; analysis/dashlink_texture/results/param_table.csv (DASHlink maxima inside)
    sweep: none
    affects: [M08, M12, M13]
  R-RANGE-EGT-PROXY:
    title: Proxy EGT ranges (T5 harness lanes and the EGT word)
    statement: '0-1000 degC: the DASHlink EGT words span 0-732 degC on Tail 687 archive 1 (global min/max of EGT_1..4); the span is rounded up so that no value saturates. The Tejas harness range (371-871
      degC) would clip the proxy''s idle EGT at altitude.'
    tag: MEASURED
    source: analysis/dashlink_texture/results/param_table.csv (EGT_1 global_min 0, global_max 732)
    sweep: none
    affects: [M08, M12, M13]
  R-RANGE-DASHLINK:
    title: DASHlink engine-word ranges
    statement: 'Ranges of the recorded N1, N2 and FF words: the word spans that contain every Tail 687 archive-1 value (N1 0-102.8 %, N2 0-99.9 %, FF 0-3,096 lb/h observed), rounded up to the next convenient
      bound.'
    tag: MEASURED
    source: analysis/dashlink_texture/results/param_table.csv (N1_1, N2_1, FF_1 global_min/global_max)
    sweep: none
    affects: [M12, M13]
  R-DASHLINK-WORD:
    title: DASHlink engine words acquired by the ACMS
    statement: N1, N2, EGT and FF per engine are recorded at 4 Hz in percent, degC and lb/h by the aircraft condition monitoring recorder; each word is the value of the engine indicating source read at
      the recorder's sample instant (point sampling; no slip sentinel on digital words, P4 refuted).
    tag: MEASURED
    source: analysis/dashlink_texture/results/param_table.csv (rate_hz 4, units); research_notes/.../empirical_dashlink_texture.md Q1-Q3
    sweep: none
    affects: [M12, M13, M20]
  R-LSB-DASHLINK-REC:
    title: DASHlink recorder LSB of the engine words
    statement: 'Recorder lattice: N1/N2 0.03125 %, EGT 0.5 degC, FF 8 lb/h (lsb_mode of the Tail 687 words).'
    tag: MEASURED
    source: analysis/dashlink_texture/results/param_table.csv lsb_mode; round-2 r2common.LSB_REC
    sweep: none
    affects: [M13]
  R-LSB-NATIVE-CAL:
    title: DASHlink native (source) quantisation steps
    statement: 'Double quantiser (AD-05): native steps N1/N2 0.04 % (1.28 recorder LSB) and EGT 0.8 degC (1.6 LSB) reproduce the never-used residues; FF has no finer native grid than its 8 lb/h lattice.'
    tag: MEASURED
    source: analysis/settling_experiment/results/native_step_cal.json (687-CAL, 152 flights); round-2 REPORT §3.5
    sweep: none
    affects: [M13]
  R-RATE-PROXY-FADEC:
    title: Proxy FADEC frame rate
    statement: The proxy controller runs the M08 FADEC clock domain at 60 Hz nominal (band 50-67 Hz), as the Tejas FADEC.
    tag: 'TRANSFER: Phalanx Tejas dictionary FADEC lanes'
    source: configs/tejas/dictionary/tables/rate_groups.yaml FADEC-INT (R-RATE-FADEC); AD-39
    sweep: none
    affects: [M08, M13]
  R-RATE-ACMS4:
    title: DASHlink engine-word rate
    statement: The engine words are sampled at 4 Hz by the recorder (one ACMS clock domain).
    tag: MEASURED
    source: analysis/dashlink_texture/results/param_table.csv rate_hz 4.0 for N1_1..FF_4
    sweep: none
    affects: [M13, M20]
  R-SINK-PROXY:
    title: Proxy sinks
    statement: FADEC lanes are consumed inside the controller (INTERNAL); engine words go to the ACMS recording.
    tag: MEASURED
    source: DASHlink MAT files carry the engine words (analysis/dashlink_texture/results/param_table.csv); architecture §7
    sweep: none
    affects: [M13, M20]
  R-CODES-PHASE:
    title: Flight-phase codes from DASHlink
    statement: PH codes 0 unknown, 1 preflight, 2 taxi, 3 takeoff, 4 climb, 5 cruise, 6 approach, 7 rollout; 15 is the all-ones invalid code.
    tag: 'TRANSFER: DASHlink FAQ (2014)'
    source: analysis/dashlink_texture/dlio.py PHASES (DASHlink FAQ 2014); empirical_dashlink_texture.md (PH 15 all-ones)
    sweep: none
    affects: [M02, M13, M20]
  R-REF-SPEED-PROXY:
    title: Proxy percent-speed references
    statement: 100 % N1/N2 equal the Tejas references. The DASHlink engine's rpm is not public; percent-speed behaviour depends only on I omega_ref^2, which the proxy M07 sets through rotor energy times
      (A-W2.4a-6), so the reference value has no behavioural effect.
    tag: 'TRANSFER: Phalanx Tejas dictionary channel_reference'
    source: configs/tejas/dictionary/tables/constants.yaml channel_reference; configs/proxy_dashlink/params/M07.yaml
    sweep: none
    affects: [M07, M08, M13]
  R-ICD-NONE:
    title: No bus in proxy mode
    statement: Proxy mode records acquisition-level values (M13); no 1553/429/PCM bus map is modelled.
    tag: 'TRANSFER: Phalanx architecture §14.3'
    source: docs/architecture.md §14.3 (proxy mode validates M12-M13 and M20 on real data)
    sweep: none
    affects: [M13, M15]
