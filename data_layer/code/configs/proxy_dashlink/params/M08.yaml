# M08 configuration of the DASHlink proxy (W2.4a; AD-43 same method structure, AD-31/AD-50 governing,
# architecture §14.3 autothrottle). Generated once from the Tejas M08.yaml with the proxy entries replaced;
# this file is the maintained source. Entries without a proxy note are the Tejas values (TRANSFER of the M08
# structure and its tagged placeholders). Derived tables: phalanx.proxy.schedules (regenerated in tests).
format: phalanx.params/1
module: M08
sets:
  control:
    t_std:
      value: 288.15
      units: K
      description: Standard-day temperature for corrected speeds (theta = T/T_std)
      evidence:
        tag: 'TRANSFER: ISA / NASA correction convention'
        source: research_notes f404_in20_engine_model.md Q5 T7 (TM-100159 theta = TT/288.15 K)
    p_std:
      value: 101325.0
      units: Pa
      description: Standard-day pressure (delta = P/P_std); reference for the T5-limit P0 trim
      evidence:
        tag: 'TRANSFER: ISA / NASA correction convention'
        source: research_notes f404_in20_engine_model.md Q5 T7 (TM-100159 delta = PT/101.325 kPa)
    fuel_law:
      value: 1
      units: '1'
      description: 'Core fuel law: 1 = ratio units (governor and limiters output Wf/PS3, multiplied by validated PS3), 0 = direct Wf (C-MAPSS40k style)'
      evidence:
        tag: ASSUMPTION
        source: report §3 (accel/decel on Wf/PS3; AB in ratio units); f404 notes Q4 (MFC PS3 input, Wr/PS3 to AB control); W1.3b A2 sweep (only law 1 gives the real-data
          FF->N2 sign)
      sweep:
      - 0
      - 1
      assumption_id: A-W1.3b-2
    pla_cutoff:
      value: 5.0
      units: deg
      description: PLA below which main fuel is shut off (below every recorded airborne lever angle)
      evidence:
        tag: ASSUMPTION
        source: DASHlink PLA_1 p01 flight min -1.05 deg at shutdown, idle about 23 deg (analysis/dashlink_texture/results/param_table.csv; round-2 frozen f-map first
          knot 22.94 deg)
      sweep:
      - 0.0
      - 15.0
      assumption_id: A-W2.4a-13
    pla_gi:
      value: 22.94
      units: deg
      description: Idle PLA (first knot of the measured PLA-to-fuel relation)
      evidence:
        tag: MEASURED
        source: round-2 frozen M-A variant S FFN2.f_knots_x[0] 22.94 deg (687-CAL)
    pla_irp:
      value: 120.0
      units: deg
      description: 'No isochronous-N1 / nozzle-T5 regime in the proxy (fixed nozzles, AD-43): placed beyond the lever range'
      evidence:
        tag: ASSUMPTION
        source: AD-43 (fixed nozzles); DASHlink PLA p99 88.9 deg (param_table.csv)
      sweep:
      - 100.0
      - 130.0
      assumption_id: A-W2.4a-13
    pla_ab_min:
      value: 140.0
      units: deg
      description: 'No afterburner in the proxy (AD-43): AB request beyond the lever range'
      evidence:
        tag: ASSUMPTION
        source: AD-43 (non-afterburning)
      sweep:
      - 130.0
      - 150.0
      assumption_id: A-W2.4a-13
    pla_ab_max:
      value: 150.0
      units: deg
      description: End of the (unused) AB lever range
      evidence:
        tag: ASSUMPTION
        source: AD-43 (non-afterburning)
      sweep:
      - 140.0
      - 160.0
      assumption_id: A-W2.4a-13
    n2c_pla_x:
      table:
        file: n2c_pla.csv
        column: pla_deg
      units: deg
      description: 'Breakpoints (PLA) of the core corrected-speed demand: the knots of the measured PLA-to-fuel relation, extended flat to 0 and 120 deg'
      evidence:
        tag: MEASURED
        source: round-2 frozen M-A variant S FFN2.f_knots_x (687-CAL)
    n2c_pla_y:
      table:
        file: n2c_pla.csv
        column: n2c25
      units: '1'
      description: 'Core corrected-speed demand N2/sqrt(theta25): the measured g(f(PLA)) at M 0.5, delta = theta = 1, carried to theta25 through the proxy M07 T25/T2'
      evidence:
        tag: MEASURED
        source: round-2 frozen M-A variant S f and g maps (687-CAL); derived from the proxy M07 separate_fixed model by phalanx.proxy.schedules.derive_tables (SLS
          steady operating line; AD-50 harmonisation of the ratio-unit schedules with M07); regenerated and compared by tests/unit/test_proxy_config.py
    n1c_cap:
      value: 1.1
      units: '1'
      description: Corrected fan-speed cap (above every recorded N1c, so it does not bind in the replay)
      evidence:
        tag: ASSUMPTION
        source: proxy control limits not public; DASHlink N1c up to 104 % (round-2 h-map top knot)
      sweep:
      - 1.05
      - 1.12
      assumption_id: A-W2.4a-13
    n1lim_t1_x:
      table:
        file: n1lim_t1.csv
        column: t1_k
      units: K
      description: Breakpoints (T1) of the physical N1 limit (flat)
      evidence:
        tag: ASSUMPTION
        source: proxy control limits not public
      sweep:
      - 200.0
      - 400.0
      assumption_id: A-W2.4a-13
    n1lim_t1_y:
      table:
        file: n1lim_t1.csv
        column: n1_frac
      units: '1'
      description: Physical N1 limit 105 % (above the recorded maximum 102.8 %)
      evidence:
        tag: ASSUMPTION
        source: DASHlink N1_1 global max 102.84 % (param_table.csv)
      sweep:
      - 1.03
      - 1.08
      assumption_id: A-W2.4a-13
    n2_max:
      value: 1.03
      units: '1'
      description: N2 overspeed limiter (fraction of 16,810 rpm, physical)
      evidence:
        tag: ASSUMPTION
        source: f404 notes Q4 (limit regulators include N2 max; C-MAPSS40k Nc max); value not public; N2 sensor span 110 %
      sweep:
      - 1.02
      - 1.06
      assumption_id: A-W1.3b-5
    n2_reduce:
      value: 1000.0
      units: rpm
      description: N2-limit reduction on a speed-sensor accommodation
      evidence:
        tag: 'TRANSFER: FADEC signal-validation template'
        source: 'report §9 signal-validation table (accommodation: reduce N2 limit by ~1,000 rpm)'
    n2c_part:
      value: 0.72
      units: '1'
      description: Core corrected-speed demand cap N2/sqrt(theta25) in part-power reversion (second like failure)
      evidence:
        tag: ASSUMPTION
        source: 'f404 notes Q3 (-400: NL dual-pickup mismatch -> fuel reduced to part power, CR-1998-208416); report §9 (revert on a second like failure)'
      sweep:
      - 0.66
      - 0.76
      assumption_id: A-W1.3b-13
    gov_kff:
      value: 1.0
      units: '1'
      description: Weight of the demand feed-forward in ratio units (u_gov = kff * RU_ff(demand) + PI trim); 0 = pure PI governor
      evidence:
        tag: ASSUMPTION
        source: 'f404 notes Q4 (-400 MFC schedules fuel from the PLA/N2 schedule; C-MAPSS40k scheduled gain ahead of the integrator); W1.3b A2: low feedback gain
          is needed for the small-signal sign, so large PLA steps rely on the feed-forward and the accel schedule'
      sweep:
      - 0.0
      - 1.5
      assumption_id: A-W1.3b-3
    ru_ff_x:
      table:
        file: ru_ff.csv
        column: n2c25
      units: '1'
      description: Breakpoints (demanded N2/sqrt(theta25)) of the feed-forward ratio units
      evidence:
        tag: ASSUMPTION
        source: derived from the proxy M07 separate_fixed model by phalanx.proxy.schedules.derive_tables (SLS steady operating line; AD-50 harmonisation of the ratio-unit
          schedules with M07); regenerated and compared by tests/unit/test_proxy_config.py
      sweep:
      - 0.5
      - 1.0
      assumption_id: A-W2.4a-14
    ru_ff_y:
      table:
        file: ru_ff.csv
        column: ru_pph_psi
      units: lb/hour/psi
      description: Feed-forward ratio units Wf/PS3 = the proxy engine's steady ratio units at that speed
      evidence:
        tag: ASSUMPTION
        source: derived from the proxy M07 separate_fixed model by phalanx.proxy.schedules.derive_tables (SLS steady operating line; AD-50 harmonisation of the ratio-unit
          schedules with M07); regenerated and compared by tests/unit/test_proxy_config.py
      sweep:
      - 5.0
      - 25.0
      assumption_id: A-W2.4a-14
    gov_kl:
      value: 20.0
      units: '1'
      description: Large-signal governor gain on the N2 error outside the dead zone gov_edz (drives large PLA moves onto the accel/decel Wf/PS3 schedules; small signals
        see gov_kp only)
      evidence:
        tag: ASSUMPTION
        source: 'f404 notes Q6 (CF-18 take-off: the maximum fuel schedule is engaged above ~50 deg/s throttle rate, Henry AGARD-CP-448 p.37); W1.3b A2 (a low small-signal
          gain is needed for the real FF->N2 sign)'
      sweep:
      - 0.0
      - 50.0
      assumption_id: A-W1.3b-3
    gov_edz:
      value: 0.02
      units: '1'
      description: Dead zone of the large-signal governor path (fraction of 100 % N2)
      evidence:
        tag: ASSUMPTION
        source: as gov_kl; real small-signal N2 fluctuations are well inside +-2 % (DASHlink fast-band N2 SD ~0.05 %, empirical_dashlink_texture.md)
      sweep:
      - 0.005
      - 0.05
      assumption_id: A-W1.3b-3
    gov_kp:
      value: 2.0
      units: '1'
      description: N2 governor proportional gain (fraction of scheduled ratio units per fraction of N2 error)
      evidence:
        tag: ASSUMPTION
        source: 'f404 notes Q4 (C-MAPSS40k scheduled PI setpoint loop, GM > 6 dB, PM > 45 deg); gains not public; identified jointly with ps3_tau and the disturbance
          mix in W2.4a (AD-50). Raised 1 -> 2 in the W1.3b fix-back: with Kp 1 the real W1.3a M07 limit-cycles at SLS ground idle (N2 +-2.3 %, Wf +-15 %, ~0.05 Hz:
          the weak PI cannot hold the ratio-unit self-feedback, the dead-zone gain bounds it); Kp 2 is steady there and keeps the A2 signs on both plants; Kp >= 3-5
          destroys them (AD-50)'
      sweep:
      - 0.0
      - 8.0
      assumption_id: A-W1.3b-3
    gov_ki:
      value: 1.0
      units: 1/s
      description: N2 governor integral gain
      evidence:
        tag: ASSUMPTION
        source: as gov_kp
      sweep:
      - 0.1
      - 5.0
      assumption_id: A-W1.3b-3
    n1_kp:
      value: 3.0
      units: '1'
      description: N1 isochronous governor / limiter proportional gain
      evidence:
        tag: ASSUMPTION
        source: f404 notes Q4 (NL isochronous via fuel-trim torque motor; C-MAPSS40k limit regulators PI); gains not public
      sweep:
      - 0.0
      - 8.0
      assumption_id: A-W1.3b-3
    n1_lead:
      value: 1.0
