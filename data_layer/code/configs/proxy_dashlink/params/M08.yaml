      units: '1'
      description: PS3-max limiter proportional gain
      evidence:
        tag: ASSUMPTION
        source: C-MAPSS40k Ps3 max limit regulator (f404 notes Q4); value not public
      sweep:
      - 0.0
      - 8.0
      assumption_id: A-W1.3b-3
    ps3x_ki:
      value: 2.0
      units: 1/s
      description: PS3-max limiter integral gain
      evidence:
