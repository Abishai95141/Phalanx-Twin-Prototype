      description: Rate anticipation of the N1 isochronous governor / limiter (error on N1 + lead * dN1/dt; compensates the fan lag)
      evidence:
        tag: ASSUMPTION
        source: fan small-step tau ~0.77 s (Merrington, f404 notes Q6); N2 -> N1 lag +0.5 s in real data (round-2 REPORT §3.2); limiter lead not public
      sweep:
      - 0.0
      - 1.5
      assumption_id: A-W1.3b-3
    n1_ki:
