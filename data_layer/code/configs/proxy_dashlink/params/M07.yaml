# M07 proxy engine (DASHlink Tail 687 proxy mode; AD-33, AD-43): topology separate_fixed (format phalanx.params/1).
# Owner: W2.4a. The DASHlink aircraft type is not disclosed by NASA (a four-engine regional jet; BAe 146 /
# Avro RJ class is an ASSUMPTION, research_notes/.../public_aerospace_datasets.md:82), so no cycle value of the
# real engine is public. Structure: AD-43 (same component-level method as the Tejas M07). Anchors: [MEASURED]
# round-2 frozen M-A on 687-CAL (analysis/settling_experiment_round2/results/frozen/S/ma_readable.json; an existing
# result, not a new fit). Everything else is ASSUMPTION with a sweep, or TRANSFER from the Tejas M07
# (configs/tejas/params/M07.yaml, same method structure). Identified in W2.4a-2 (AD-34). No restricted value
# (report App. A1) is used.
format: phalanx.params/1
module: M07
sets:
  design:
    wf_design_anchor:
      value: 0.44372
      units: kg/s
      description: Corrected fuel flow at the design (top-knot) corrected core speed; the inlet airflow is scaled to reproduce it (design closure)
      evidence: {tag: MEASURED, source: "round-2 frozen M-A variant S (687-CAL, 152 flights): g^-1(N2c 98.385 %) = 3,521.7 lb/h corrected; analysis/settling_experiment_round2/results/frozen/S/ma_readable.json FFN2.g_knots"}
    egt_design_anchor:
      value: 918.78
      units: K
      description: Corrected EGT at the design point (theta = 1); T4 is solved so that the EGT-station temperature (T5, A-W2.4a-4) equals it
      evidence: {tag: MEASURED, source: "round-2 frozen M-A variant S: k_W(3,521.7 lb/h) + k_N(103.99 %) = 918.8 K (EGT stage knots); analysis/settling_experiment_round2/results/frozen/S/ma_readable.json"}
    n1_design_frac:
      value: 1.0398686
      units: "1"
      description: Corrected fan speed at the design point as a fraction of 100 % N1 (top knot of the measured N1c(N2c) relation)
      evidence: {tag: MEASURED, source: "round-2 frozen M-A variant S N1.h_knots (N1c 103.99 % at N2c 98.38 %), 687-CAL"}
    n2_design_frac:
      value: 0.9838461
      units: "1"
      description: Corrected core speed at the design point as a fraction of 100 % N2 (top knot of the measured relation)
      evidence: {tag: MEASURED, source: "round-2 frozen M-A variant S N1.h_knots_x[7] = 98.385 %, 687-CAL"}
    n1_100pct:
      value: 13270.0
      units: rpm
      description: Fan speed at 100 % N1 (percent reference; the DASHlink engine's rpm is not public). Only I omega_ref^2 enters the percent-speed dynamics, which are set by the rotor energy time h_lp_s, so the value has no behavioural effect (tested)
      evidence: {tag: "TRANSFER: Phalanx Tejas dictionary channel_reference", source: "configs/tejas/dictionary/tables/constants.yaml channel_reference.n1_100pct; proxy dictionary configs/proxy_dashlink/dictionary (same reference so the M08 lane conversions are shared); A-W2.4a-6"}
    n2_100pct:
      value: 16810.0
      units: rpm
      description: Core speed at 100 % N2 (percent reference; not public for the DASHlink engine; no behavioural effect, see n1_100pct)
      evidence: {tag: "TRANSFER: Phalanx Tejas dictionary channel_reference", source: "configs/tejas/dictionary/tables/constants.yaml channel_reference.n2_100pct; A-W2.4a-6"}
    bpr_design:
      value: 5.0
      units: "1"
      description: Bypass ratio at design (high-bypass regional-jet class)
      evidence: {tag: ASSUMPTION, source: "AD-43 (separate-flow high-bypass); DASHlink engine type not disclosed (public_aerospace_datasets.md:82); no cycle data in the evidence base"}
      sweep: [4.0, 6.5]
      assumption_id: A-W2.4a-1
    fpr_design:
      value: 1.55
      units: "1"
      description: Fan total pressure ratio at design (single-stage high-bypass fan class)
      evidence: {tag: ASSUMPTION, source: "AD-43; no cycle data in the evidence base"}
      sweep: [1.4, 1.75]
      assumption_id: A-W2.4a-1
    opr_design:
      value: 13.0
      units: "1"
      description: Overall pressure ratio P3/P2 at design (regional-jet class)
      evidence: {tag: ASSUMPTION, source: "AD-43; no cycle data in the evidence base"}
      sweep: [10.0, 18.0]
      assumption_id: A-W2.4a-1
    eta_fan_design:
      value: 0.88
      units: "1"
      description: Fan isentropic efficiency at design
      evidence: {tag: ASSUMPTION, source: "generic high-bypass fan practice; not public"}
      sweep: [0.84, 0.91]
      assumption_id: A-W2.4a-1
    eta_hpc_design:
      value: 0.84
      units: "1"
      description: HPC isentropic efficiency at design (booster lumped in, PROXY A-W2.4a-3)
      evidence: {tag: ASSUMPTION, source: "generic practice; not public"}
      sweep: [0.80, 0.88]
      assumption_id: A-W2.4a-1
    eta_hpt_design:
      value: 0.87
      units: "1"
      description: HPT isentropic efficiency at design
      evidence: {tag: ASSUMPTION, source: "generic practice; not public"}
      sweep: [0.84, 0.91]
      assumption_id: A-W2.4a-1
    eta_lpt_design:
      value: 0.90
      units: "1"
      description: LPT isentropic efficiency at design
      evidence: {tag: ASSUMPTION, source: "generic practice; not public"}
      sweep: [0.86, 0.93]
      assumption_id: A-W2.4a-1
    f_ngv:
      value: 0.08
      units: "1"
      description: HP NGV cooling air, fraction of HPC delivery
      evidence: {tag: ASSUMPTION, source: "lower-T4 civil core than the F404 (11 %, TRANSFER there); not public"}
      sweep: [0.04, 0.12]
      assumption_id: A-W2.4a-1
    f_rot:
      value: 0.05
      units: "1"
      description: Turbine blade/disc and LPT cooling air, fraction of HPC delivery
      evidence: {tag: ASSUMPTION, source: "not public"}
      sweep: [0.03, 0.08]
      assumption_id: A-W2.4a-1
    p_acc_design:
      value: 40.0
      units: kW
      description: Engine accessory-gearbox load at design N2 (scales with N2^2), incl. the aircraft electrical/hydraulic off-take per engine
      evidence: {tag: ASSUMPTION, source: "not public; Tejas value 50 kW (A-W1.3a-16) as order of magnitude"}
      sweep: [10.0, 120.0]
      assumption_id: A-W2.4a-1
    eta_mech:
      value: 0.995
      units: "1"
      description: Shaft mechanical efficiency (bearings, windage)
      evidence: {tag: "TRANSFER: Phalanx Tejas M07", source: "configs/tejas/params/M07.yaml eta_mech (A-W1.3a-16)"}
    gear_ratio:
      value: 3.0
      units: "1"
      description: LP-turbine speed / fan speed (fan gearbox; 1 = direct drive). Enters only the LPT map speed, which the design scaler absorbs; kept for physical meaning
      evidence: {tag: ASSUMPTION, source: "AD-43 (LP spool inertia including any fan gearbox); whether the DASHlink engine is geared is not disclosed"}
      sweep: [1.0, 3.5]
      assumption_id: A-W2.4a-5
    eta_gearbox:
      value: 0.99
      units: "1"
      description: Fan gearbox efficiency (1.0 for a direct-drive fan)
      evidence: {tag: ASSUMPTION, source: "AD-43; not public"}
      sweep: [0.98, 1.0]
      assumption_id: A-W2.4a-5
    h_lp_s:
      value: 0.7293
      units: s
      description: LP rotor energy time (kinetic energy of the LP spool reflected to the fan shaft at design / design fan power); sets i_lp = 2 H P / omega^2
      evidence: {tag: MEASURED, source: "W2.4a-2 stage 5 (analysis/proxy_quicklook/results/stage5): staged indirect transient-weighted output-error identification on 687-CAL, n = 4 A/T windows of 120 s (st5_segments.py), shape residual (per window offset and gain removed); plant stage with the committed governor gains and the stage-0 autothrottle gains (i_lp x1.216 of the W2.4a-1 value 0.6 s); not public"}
      sweep: [0.2, 2.0]
      assumption_id: A-W2.4a-6
    h_hp_s:
      value: 0.3770
      units: s
      description: HP rotor energy time (kinetic energy of the HP spool at design / design HPC power); sets i_hp
      evidence: {tag: MEASURED, source: "W2.4a-2 stage 5 (analysis/proxy_quicklook/results/stage5): staged indirect transient-weighted output-error identification on 687-CAL, n = 4 A/T windows of 120 s (st5_segments.py), shape residual (per window offset and gain removed); (i_hp x1.257 of the W2.4a-1 value 0.3 s); not public"}
      sweep: [0.1, 1.0]
      assumption_id: A-W2.4a-6
    fan_ncmap_design:
      value: 1.0
      units: "1"
      description: Design-point position on the (scaled AXI5) fan map, corrected-speed axis
      evidence: {tag: ASSUMPTION, source: "pyCycle map defaults; map positions not public"}
      sweep: [0.95, 1.05]
