  surge:
    sm_trigger:
      value: -0.02
      units: "1"
      description: Surge trigger margin (PR_stall/PR - 1) of the PROXY surge event model. The relative margin of a low-PR fan shrinks in proportion to (PR - 1) toward idle (about +0.8 % at ground idle on the scaled map), so the trigger sits below 0 so that the thin idle margin does not fire the event model (-2 % with the W2.4a-2 identified plant, whose ground idle sits on the scaled map's stall line); real fan surge at idle is not modelled
      evidence: {tag: ASSUMPTION, source: "Tejas M07 event model (A-W1.3a-9, trigger 0.0, sweep -0.02..0.05); proxy fan margin from the scaled AXI5 map (A-W2.4a-8). W2.4a-2: -0.02 (end of the declared range) because the identified plant (A-W2.4a-21) puts ground idle on the scaled map stall line, in the similarity extrapolation below its lowest speed line (margins -1.0 to -1.1 % at the replay start fired 6-12 surge events per engine at -0.01); in flight the identified plant keeps at least 3 % (stage-1 floors), so the trigger does not hide flight margins; the DASHlink record shows no surge"}
