const chainOld = S('path', { d: `M${300 + LBW / 2} ${LOGY + 29} H${LX1 + LBW / 2}`, stroke: '#D6D6D1', 'stroke-width': 2, 'stroke-dasharray': '6 6', fill: 'none' }, GLG);
const oldB = OLD.map(o => H('lblock old', `<div class="ty">${o[0]}</div><div class="hh"><span>#</span>…</div>`, o[1], LOGY, WN, { opacity: 0 }));
const logLab = H('loglab', `<div class="k2">ONE LOG</div><div class="s2">hash-chained · append-only · every step</div>`, LX1, LOGY - 32, WN, { opacity: 0 });
// learning closes the loop back to the engines
const [rcx, rcy] = pol(315, LR);
const learnP = S('path', { d: `M${rcx - 8} ${rcy - 14} C ${rcx - 40} ${rcy - 120}, ${2720} ${880}, ${2700} ${786}`, fill: 'none', stroke: '#B4511F', 'stroke-width': 2.4, 'stroke-dasharray': '9 7', 'marker-end': 'url(#ah-acc2)' }, GLP);
const learnL = H('', `<div style="font:600 15px/1.3 var(--mono);color:#B4511F;white-space:nowrap">outcomes → labels → learning</div>`, 2440, 846, WN, { opacity: 0 });
// the assistant reads the same state
const asst = H('asst', `<svg width="26" height="26" viewBox="0 0 26 26"><path d="M4 6 h18 v11 h-9 l-5 4 v-4 h-4 z" fill="none" stroke="#0B0D10" stroke-width="2" stroke-linejoin="round"/></svg><div><div class="an">assistant</div><div class="as">read-only tools · same state · drafts only</div></div>`, 0, 870, WN, { opacity: 0 });
asst.style.left = px(HX + HW - asst.offsetWidth);
const asstLine = S('path', { d: `M${HX + HW - asst.offsetWidth / 2} 868 V${HY0 + HH - 30}`, stroke: '#8E939A', 'stroke-width': 1.8, 'stroke-dasharray': '5 5', fill: 'none' }, $('#g-x'));
// region outlines for the closing beat
const outlines = [[HX - 12, HY0 - 12, HW + 24, HH + 24, 22], [280, LOGY - 44, 3752 - 280 + 16, 118, 16]]
  .map(([x, y, wd, ht, r]) => S('rect', { x, y, width: wd, height: ht, rx: r, fill: 'none', stroke: '#E8743B', 'stroke-width': 4, opacity: 0 }, $('#g-fx')));

// -- S18 choreography
tl.fromTo(baseRing, { opacity: 0 }, { opacity: 1, duration: .5 }, 54.1);
fadeIn(hub, 54.55, .5);
const stT = STAGES.map(s => w(s.w[0], s.w[1], s.w[2] || 1) - .04);
stT[1] = w('S18', 'policies') + .1; stT[2] = w('S18', 'optimisers'); stT[3] = w('S18', 'simulation'); stT[4] = w('S18', 'person');
stT[5] = w('S18', 'approves') + .55; stT[6] = w('S18', 'and', 2) + .05; stT[7] = w('S18', 'every') + .2;
STAGES.forEach((s, i) => {
  const t = stT[i];
  tl.fromTo(nodes[i].g, { opacity: 0 }, { opacity: 1, duration: .3, ease: 'power2.out' }, t);
  tl.fromTo(nodes[i].c, { attr: { r: (s.human ? 21 : 15) * .4 } }, { attr: { r: s.human ? 21 : 15 }, duration: .45, ease: 'back.out(2)' }, t);
  rise(labels[i], t + .06, { dy: 10, d: .45 });
  const tn = i < 7 ? stT[i + 1] : stT[7] + .35;
  drawP([segs[i]], t + .1, Math.max(.25, tn - t - .1), 0, 'power1.inOut');
  // log block for this stage, chained to the previous one
  tl.fromTo(logB[i], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .35, ease: 'power3.out' }, t + .12);
  type(tl, `#lh${i}`, s.h, t + .22, .28);
});
tl.fromTo(chainLine, { opacity: 0 }, { opacity: 1, duration: .1 }, stT[0] + .1);
tl.fromTo(chainLine, { attr: { d: `M${LX1 + LBW / 2} ${LOGY + 29} H${LX1 + LBW / 2 + 1}` } }, { attr: { d: `M${LX1 + LBW / 2} ${LOGY + 29} H${3752 - LBW / 2}` }, duration: stT[7] - stT[0], ease: 'none' }, stT[0] + .12);
fadeIn(logLab, stT[0] + .2, .5);
// propose orders → fork gate (CRN-paired tests vs status quo) → one dropped
const [px2, py2] = pol(90, LR), [px3, py3] = pol(135, LR);
const ordPath = (o, t0, tgtA, off) => { const p = { a: 0 };
  const set = () => { const ang = 90 + (tgtA - 90) * p.a, [x, y] = pol(ang, LR + off); o.style.transform = `translate(${(x - 28).toFixed(2)}px, ${(y - 14).toFixed(2)}px)`; };
  tl.fromTo(p, { a: 0 }, { a: 1, duration: 1.0, ease: 'power2.inOut', onUpdate: set }, t0); p.a = 0; set(); };
ordPath(ordWA, w('S18', 'propose') + .05, 127, 0); ordPath(ordWB, w('S18', 'propose') + .2, 116, 0);
pop(ordA, w('S18', 'propose') + .05, { d: .35 }); pop(ordB, w('S18', 'propose') + .2, { d: .35 });
const [fx3, fy3] = pol(135, LR + 34);
forkL.style.left = px(fx3); forkL.style.top = px(fy3 + 30);
rise(forkL, w('S18', 'against') - .05, { dy: 8 });
tl.fromTo(ordB, { opacity: 1 }, { opacity: .25, duration: .3, immediateRender: false }, w('S18', 'quo') - .1);
{ const [dx, dy] = pol(116, LR + 40); dropT.style.left = px(dx); dropT.style.top = px(dy - 8); }
tl.fromTo(dropT, { opacity: 0 }, { opacity: 1, duration: .3 }, w('S18', 'quo'));
tl.fromTo(ordA, { opacity: 1 }, { opacity: 0, duration: .35, immediateRender: false }, stT[5]);
tl.fromTo([ordB, dropT], { opacity: 0.25 }, { opacity: 0, duration: .35, immediateRender: false }, stT[5]);
// the human gate
const [bx, by] = pol(180, LR);
approve.style.left = px(bx - approve.offsetWidth / 2); approve.style.top = px(by - 66);
pop(approve, w('S18', 'approves') + .05, { d: .4 });
tl.fromTo('#hub-n', { color: '#0B0D10' }, { color: '#1F8A4C', duration: .3, immediateRender: false }, w('S18', 'approves') + .1);
tl.fromTo(approve, { opacity: 1 }, { opacity: 0, duration: .3, immediateRender: false }, 63.2);
// learning arrow closes the loop back to the engines
drawP([learnP], stT[7] + .3, .9, 0, 'power2.inOut');
rise(learnL, stT[7] + .7, { dy: 8 });
// pull back: one log under everything, the assistant on the same state, the outer loop through orders
tl.fromTo(chainOld, { opacity: 0 }, { opacity: 1, duration: .6 }, 63.6);
oldB.forEach((b, i) => tl.fromTo(b, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .4, ease: 'power3.out' }, 64.45 - i * .12));
tl.fromTo(logLab, { x: 0 }, { x: 300 - LX1, duration: .01, immediateRender: false }, 63.9);
tl.fromTo(logLab, { opacity: 1 }, { opacity: 0, duration: .25, immediateRender: false }, 63.62);
tl.fromTo(logLab, { opacity: 0 }, { opacity: 1, duration: .4, immediateRender: false }, 64.3);
fadeIn(asst, 64.15, .45); drawP([asstLine], 64.2, .45);
// closing beat: one state · one loop · one log
['#tg1', '#td1', '#tg2', '#td2', '#tg3'].forEach((s, i) => rise(s, 65.12 + i * .2, { dy: 14 }));
outlines.forEach((o, i) => { const t = 65.12 + i * .8; tl.fromTo(o, { opacity: 0 }, { opacity: 1, duration: .25 }, t); tl.fromTo(o, { opacity: 1 }, { opacity: 0, duration: .6, immediateRender: false }, t + .55); });
tl.fromTo(segs, { strokeWidth: 4.5 }, { strokeWidth: 10, duration: .25, ease: 'power2.out', immediateRender: false }, 65.52);
tl.fromTo(segs, { strokeWidth: 10 }, { strokeWidth: 4.5, duration: .6, ease: 'power2.inOut', immediateRender: false }, 65.8);
// push through BOARD into the product
tl.fromTo('#tag', { opacity: 1 }, { opacity: 0, duration: .35, ease: 'power2.in', immediateRender: false }, 66.4);
tl.fromTo('#whiteout', { opacity: 0 }, { opacity: 1, duration: .27, ease: 'power2.in' }, 66.93);

// camera, last (pure function of time)
const camO = { t: 0 };
tl.fromTo(camO, { t: 0 }, { t: D, duration: D, ease: 'none', onUpdate: () => applyCam(camO.t) }, 0);
applyCam(0);
window.__timelines["main"] = tl;
}
window.__timelines = window.__timelines || {};
document.fonts.ready.then(build);
})();
