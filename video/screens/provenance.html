<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Provenance — Phalanx Twin</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .a-grid { grid-template-rows: 38px 322px 404px; }
  .tabbar { grid-column: 1 / -1; display: flex; align-items: flex-end; }
  .tabbar .tabs2 { flex: 1; }
  .tabbar a { text-decoration: none; }
  .tabbar .div { width: 1px; height: 16px; background: var(--line-strong); margin: 0 2px 16px; }
  .chaincard { grid-row: 2 / span 2; padding: 22px 28px 20px; }
  .q { display: flex; align-items: center; gap: 12px; height: 52px; border: 1px solid var(--line-strong); border-radius: 14px; padding: 0 8px 0 16px; background: var(--bg); box-shadow: 0 0 0 4px var(--bg-2); }
  .q .lbl { font-size: 15px; font-weight: 650; color: var(--ink); white-space: nowrap; }
  .q .oid { font: 500 13px var(--mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .q .oid b { color: var(--ink); font-weight: 650; }
  .q .kbd { margin-right: 4px; }
  .q .btn { height: 36px; }

  .chain { position: relative; margin-top: 16px; }
  .ev { display: grid; grid-template-columns: 96px 30px minmax(0,1fr) 92px 206px; column-gap: 14px; align-items: center; height: 49px; position: relative; }
  .ev + .ev { border-top: 1px solid var(--line-2); }
  .ev .tv { font: 500 13px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .ev .tv b { color: var(--ink); font-weight: 600; }
  .ev .rail { position: relative; height: 100%; display: grid; place-items: center; }
  .ev .rail::before { content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 1.5px; background: var(--line); }
  .ev:first-child .rail::before { top: 50%; } .ev:last-child .rail::before { bottom: 50%; }
  .ev .rail i { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink); z-index: 1; display: block; }
  .ev.h .rail i { background: var(--ink); }
  .ev.pend .rail i { border-style: dashed; border-color: var(--ink-4); }
  .ev .tt { min-width: 0; }
  .ev .tt .a { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .tt .b { font-size: 13px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .hx { font: 500 12.5px var(--mono); color: var(--ink-4); text-align: right; white-space: nowrap; }
  .ev .hx b { color: var(--ink-2); font-weight: 600; }
  .ev .hx .c { color: var(--ink-5); margin-right: 6px; }
  .ev.on { background: var(--accent-wash); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--accent-line); border-top-color: transparent; }
  .ev.on + .ev { border-top-color: transparent; }
  .ev.on .rail i { background: var(--accent); border-color: var(--accent); }
  .rid2 { font: 500 12px var(--mono); color: var(--wire); }

  .head-row { display: flex; align-items: flex-start; gap: 16px; }
  .head-row .grow { flex: 1; }
  .rp .kv2 { margin-top: 18px; row-gap: 11px; font-size: 14px; }
  .rp .kv2 > span:nth-child(even) { font: 600 13px var(--mono); color: var(--ink); display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .ok2 { color: var(--ok); display: inline-flex; }
  .mp .r2 { grid-template-columns: 104px minmax(0,1fr) auto; min-height: 46px; column-gap: 14px; }
  .mp .r2 .ttl { font-size: 14px; }
  .mp .r2 .why { margin-top: 1px; font-size: 13px; }
  .std { font: 700 12px var(--mono); color: var(--ink-2); }
  .evn { font: 600 12px var(--mono); color: var(--ink-4); white-space: nowrap; }
</style>
</head>
<body data-page="assurance">
<div id="content">
<div class="v2 a-grid">
  <div class="tabbar" id="tabbar"></div>

  <section class="panel2 c8 chaincard" data-shot="chain">
    <div class="q" data-shot="query">
      <i data-i="search" class="ico" style="color:var(--ink-3)"></i>
      <span class="lbl">Why was this order issued?</span>
      <span class="oid" id="oid"></span>
      <span class="kbd">⏎</span>
    </div>
    <div class="chain" id="chain"></div>
  </section>

  <section class="panel2 c4 rp" data-shot="replay">
    <div class="kick">Replay · epoch 20260622T0800</div>
    <div class="t2">Re-running the epoch gives the identical order</div>
    <div class="sub2">Fresh process, input rows shuffled before hashing.</div>
    <div class="kv2" id="replay"></div>
  </section>

  <section class="panel2 c4 mp" data-shot="standards">
    <div class="kick">Assurance mapping</div>
    <div class="t2">What this chain gives an auditor</div>
    <div class="rows2" style="margin-top:12px" id="map"></div>
  </section>
</div>
</div>

<script src="assets/logo.js"></script>
<script src="assets/data.js"></script>
<script src="assets/data-provenance.js"></script>
<script src="assets/shell.js"></script>
<script>
const R = window.PHX_PROV, E = R.chain;
const TABS = [['Models','assurance.html'],['Backtests','assurance-backtest.html'],['Drift','assurance-drift.html'],null,['Decision table','policies.html'],['Policy lifecycle','policies-lifecycle.html'],['Authority','policies-authority.html'],null,['Why this order','provenance.html']];
const here = location.pathname.split('/').pop();
document.getElementById('tabbar').innerHTML = '<div class="tabs2">' + TABS.map(t => t ? `<a href="${t[1]}"><span class="${t[1]===here?'on':''}">${t[0]}</span></a>` : '<i class="div"></i>').join('') + '</div>';

const oid = R.order_id, parts = oid.split(':');
document.getElementById('oid').innerHTML = `${parts.slice(0, 6).join(':')}:<b>${parts[6]}</b>`;

const t = s => { const d = s.slice(5, 10).split('-'), mo = { '01': 'Jan', '06': 'Jun' }[d[0]]; return `${+d[1]} ${mo} <b>${s.slice(11, 16)}</b>`; };
const p = i => E[i].payload, rf = i => E[i].refs;
const ev6 = rf(3).record_ids;
const TXT = [
  ['Release adopted', `Release v0.9 · manifest ${rf(0).release_id.slice(0, 8)} · contract 0.2.0 · dictionary 0.1.3`],
  ['Batch admitted', `Checksum, schema and content checks passed · sha256 ${rf(1).file_sha256.slice(0, 8)}`],
  ['Snapshot sealed', `Everything ingested by 06:00 · ${Object.values(p(2).records).reduce((a, b) => a + b, 0).toLocaleString('en-GB')} records · hash ${rf(2).snapshot_hash.slice(0, 8)}`],
  ['Evidence linked', `6 HYD-101 events, all ingested before 06:00 · latest <span class="rid2">${ev6[5].slice(0, 12)}</span>`],
  ['Finding', `HYD-101: ${p(4).nofault.replace('/', ' of ')} jobs no-fault, 0 confirmed · model 2.3.0`],
  ['Issue triaged', `P2 · standing ${p(5).consec_flights} flights → nuisance review for the engineering owner`],
  ['Policy evaluated', `P-DEC-01 row ${p(6).matched} → ${p(6).result.action} · version jdm.${rf(6).policy_version.split('jdm.')[1]}`],
  ['Fork evaluated', `${p(7).pairs} CRN pairs · mission capable +${p(7).d_mc[0].toFixed(2)} [${p(7).d_mc[1].toFixed(2)}, ${p(7).d_mc[2].toFixed(2)}] vs status quo`],
  ['Recommendation proposed', `TROUBLESHOOT HYD-101 on TJ107 · consent required before 07:45`],
  ['Approved', `Senior Engineering Officer · approved as recommended`],
  ['Order accepted', `Issued by the agent at 08:00 · gateway verdict ACCEPTED`],
  ['Status queued', `Mirrored from orders.status · waiting for the job to open`],
  ['Outcome pending', `Label waits for the job close and any shop finding`],
];
const BOARD = new URLSearchParams(location.search).get('state') === 'board';  // before 08:00: order frozen, not yet issued
const rows = E;
document.getElementById('chain').innerHTML = rows.map((e, i) => {
  const future = BOARD && e.t_valid.slice(11, 16) === '08:00';
  const human = e.actor.startsWith('HUMAN'), on = !BOARD && e.type === 'ORDER_ACCEPTED', pend = e.type === 'LABEL_PENDING' || future;
  if (future) return `<div class="ev pend"><span class="tv">${t(e.t_valid)}</span><span class="rail"><i></i></span>
    <div class="tt"><div class="a" style="color:var(--ink-3)">${TXT[i][0]}</div><div class="b">Scheduled · the frozen order set submits at 08:00</div></div>
    <span><span class="auth agent">AGENT</span></span><span class="hx"><span class="c">pending</span></span></div>`;
  const badge = human ? `<span class="auth human"><i data-i="signature" class="ico-sm"></i>HUMAN</span>` : `<span class="auth agent">AGENT</span>`;
  const n = +e.event_id.slice(4), cause = e.causation_id ? '← ' + String(+e.causation_id.slice(4)).padStart(2, '0') : 'root';
  const prev = e.type === 'ORDER_ACCEPTED' ? e.prev_hash : e.prev_hash;
  const shown = e;
  return `<div class="ev ${human ? 'h' : ''} ${on ? 'on' : ''} ${pend ? 'pend' : ''}">
    <span class="tv">${t(e.t_valid)}</span><span class="rail"><i></i></span>
    <div class="tt"><div class="a">${TXT[i][0]}</div><div class="b">${TXT[i][1]}</div></div>
    <span>${badge}</span>
    <span class="hx"><span class="c">${cause}</span>${prev.slice(0, 6)} → <b>${shown.hash.slice(0, 8)}</b></span>
  </div>`;
}).join('');

const rp = R.replay;
const allOk = k => rp.every(x => x[k]);
const ck = ok => ok ? '<span class="ok2"><i data-i="check" class="ico-sm"></i></span>' : '✗';
document.getElementById('replay').innerHTML = [
  ['Order id', parts[6], allOk('order_equal')], ['Snapshot hash', R.snapshot.slice(0, 12), allOk('snapshot_equal')],
  ['Policy trace hash', E[6].refs.trace_hash.slice(0, 12), allOk('trace_equal')], ['Policy version', 'jdm.' + R.policy_version.split('jdm.')[1], allOk('policy_equal')],
  ['Replays', `${rp.length} of ${rp.length} identical`, rp.length && allOk('order_equal')],
].map(r => `<span>${r[0]}</span><span>${r[1]} ${ck(r[2])}</span>`).join('');

const MAP = [
  ['EASA DA-04', 'Traceable from origin', 'events 1–4'],
  ['EASA CM-01', 'Versioned by hash', 'events 5–7'],
  ['EASA EXP-09', 'Explained after the fact', 'this chain'],
  ['EASA QA-01', 'Independent sign-off', 'event 10'],
  ['DRDO ETAI', 'Transparent and replayable', 'replay'],
  ['NIST · DoD', 'Measured and logged', 'drift'],
];
document.getElementById('map').innerHTML = MAP.map(m => `<div class="r2"><span class="std">${m[0]}</span><div><div class="ttl">${m[1]}</div></div><span class="evn">${m[2]}</span></div>`).join('');

PHX.mount({ page: 'assurance', title: 'Provenance', sub: 'One hash-chained log answers why any order was issued',
  chips: [{ i: 'clock', t: 'Epoch <b>Mon 22 Jun 08:00 IST</b>' }, { k: 'ok', i: 'hash', t: 'Chain verified' }] });
</script>
</body></html>
