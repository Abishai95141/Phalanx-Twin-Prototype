<!doctype html>
<!-- Transparent lower-third overlay (2 s) to test WebM VP9-alpha and ProRes 4444 output. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; background: transparent; font-family: Inter, sans-serif; }
      #lt { position: absolute; left: 96px; bottom: 120px; display: flex; flex-direction: column; gap: 6px; }
      #lt-bar { width: 520px; height: 8px; background: #f59e0b; transform-origin: 0 50%; }
      #lt-name { font-size: 54px; font-weight: 900; color: #fff; background: rgba(15, 27, 45, 0.85); padding: 10px 22px; }
      #lt-role { font-size: 28px; color: #e2e8f0; background: rgba(15, 27, 45, 0.6); padding: 8px 22px; width: fit-content; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lt" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="lt" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div id="lt-bar"></div>
        <div id="lt-name">Predictive maintenance</div>
        <div id="lt-role">Synthetic fleet · demo overlay</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#lt-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#lt-name", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo("#lt-role", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      window.__timelines["lt"] = tl;
    </script>
  </body>
</html>
