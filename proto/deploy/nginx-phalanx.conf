# Public entry point for the prototype: http(s)://148.100.99.205/ → the ground API and screens on 127.0.0.1:8700.
# HTTPS uses a Let's Encrypt certificate for the IP address (short-lived profile, ~6 days), issued and renewed by
# acme.sh as linux1 over HTTP-01 (webroot /var/www/acme); see proto/README.md "Public HTTPS".
# Browsers that try HTTPS first need port 443 open (iptables, saved with netfilter-persistent).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    include /etc/nginx/snippets/phalanx-app.conf;
}

server {
    listen 443 ssl http2 default_server;      # nginx 1.24: http2 is a listen flag
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/phalanx.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/phalanx.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/phalanx-app.conf;
}
